            <td style="cursor:pointer;">${statusChipHtml(status)}</td>
            <td style="cursor:pointer;">${t.memo?escapeHtml(t.memo):'-'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>` : `<div class="empty-note">등록된 부재가 없습니다.</div>`}
  `;

  container.querySelectorAll('.ticket-row').forEach(el=>{
    el.addEventListener('click', ()=> openModal(el.dataset.id));
  });

  container.querySelectorAll('.sortable-th').forEach(th=>{
    th.onclick = ()=>{
      const key = th.dataset.sort;
      if(absenceSortKey === key){
        absenceSortDir = absenceSortDir==='asc' ? 'desc' : 'asc';
      } else {
        absenceSortKey = key;
        absenceSortDir = ABSENCE_SORT_DEFAULT_DIR[key] || 'asc';
      }
      renderAbsenceResults();
    };
  });

  container.querySelectorAll('.absence-select-cb').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const id = cb.dataset.id;
      if(cb.checked) absenceSelectedIds.add(id); else absenceSelectedIds.delete(id);
      renderAbsenceResults();
    });
  });

  const selectAllEl = container.querySelector('#absenceSelectAll');
  if(selectAllEl){
    selectAllEl.onchange = ()=>{
      if(selectAllEl.checked){
        filtered.forEach(t=> absenceSelectedIds.add(t.id));
      } else {
        filtered.forEach(t=> absenceSelectedIds.delete(t.id));
      }
      renderAbsenceResults();
    };
  }

  const csvBtn = container.querySelector('#absenceCsvDownloadBtn');
  if(csvBtn){
    csvBtn.onclick = ()=>{
      const toExport = filtered.filter(t=>absenceSelectedIds.has(t.id));
      if(!toExport.length) return;
      exportAbsenceTicketsToCSV(toExport, `부재_${csvFilenameTimestamp()}.csv`);
    };
  }
}

function wireAbsenceView(){
  const input = document.getElementById('absenceSearchInput');
  if(!input) return; // 부재 관리 화면이 아닐 때는 존재하지 않음

  input.oninput = (e)=>{
    absenceSearchText = e.target.value;
    renderAbsenceResults();
  };
  document.querySelectorAll('#absenceWorkerPills [data-worker]').forEach(el=>{
    el.onclick = ()=>{
      const w = el.dataset.worker;
      absenceWorkerFilter = (absenceWorkerFilter===w) ? null : w;
      renderContent();
    };
  });
  const resetWorker = document.getElementById('resetAbsenceWorkerFilter');
  if(resetWorker) resetWorker.onclick = ()=>{ absenceWorkerFilter = null; renderContent(); };

  const hideSharedCb = document.getElementById('absenceHideSharedCb');
  if(hideSharedCb){
    hideSharedCb.onchange = ()=>{
      absenceHideShared = hideSharedCb.checked;
      renderAbsenceResults();
    };
  }

  renderAbsenceResults();
}

function wireDashboardWorkerCardNav(){
  const prevBtn = document.getElementById('workerCardPrev');

  const projNextBtn = document.getElementById('projectCardNext');
  if(projPrevBtn){
    projPrevBtn.onclick = ()=>{ projectCardMonthOffset--; renderContent(); };
    projNextBtn.onclick = ()=>{ projectCardMonthOffset++; renderContent(); };

}
function wireMonthWorkerFilter(){

      e.stopPropagation();
      const w = el.dataset.worker;
      monthFilterWorker = (monthFilterWorker === w) ? null : w;

/* ============================= 모달 (생성/수정) ============================= */
function openModal(id, presetProject){
  editingId = id;
  const t = id ? TICKETS.find(x=>x.id===id) : null;
  const initialStatus = t ? ticketStatus(t) : '예정';
  const initialProject = t ? t.project : (presetProject || null);
  const isDedicatedAbsenceEntry = presetProject==='부재' && !t; // "+ 부재 등록" 버튼으로 들어온 신규 부재 등록
  const overlay = document.createElement('div');
  overlay.className = 'overlay open';
  overlay.id = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h3>${t ? '티켓 수정' : (presetProject==='부재' ? '부재 등록' : '새 티켓 만들기')}</h3>
        <div style="display:flex; align-items:center; gap:8px;">
          <button type="button" class="btn btn-ghost csv-download-btn" id="mCsvDownload" title="현재 티켓 내용을 CSV 파일로 내려받기">⬇ CSV</button>
          <button class="modal-close" id="mClose">✕</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="field" id="statusFieldWrapper">
          <label>상태</label>
          <div class="pill-group" id="fStatus">
            ${STATUS_LIST.map(s=>`<div class="pill ${initialStatus===s?'selected':''}" data-val="${s}" style="${initialStatus===s?`border-color:${STATUS_COLORS[s]};background:${STATUS_COLORS[s]}22;color:${STATUS_COLORS[s]}`:''}">${s}</div>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>제목</label>
          <input type="text" id="fTitle" value="${t?escapeHtml(t.title):''}" placeholder="${isDedicatedAbsenceEntry?'예: 연차, 반차, 병가, 출장 등 사유를 적어주세요':'예: 시즌 밸런스 패치 작업'}">
        </div>
        <div class="field" id="qtyFieldWrapper" style="display:${isDedicatedAbsenceEntry?'none':'block'};">
          <label>수량 <span class="hint">(한 티켓에 여러 종/개의 작업이 묶여 있는 경우, 예: 3종이면 3)</span></label>
          <input type="number" id="fQty" min="1" step="1" value="${t&&t.qty?t.qty:1}" style="max-width:120px;">
        </div>
        <div class="select-row" id="projectTypeRow" style="display:${isDedicatedAbsenceEntry?'none':'grid'};">
          <div class="field" id="projectFieldWrapper">
            <label>프로젝트</label>
            <select id="fProject">
              <option value="">프로젝트 선택</option>
              ${PROJECTS.filter(p=> p!=='부재' || initialProject==='부재').map(p=>`<option value="${p}" ${(t?t.project===p:presetProject===p)?'selected':''}>${p}</option>`).join('')}
            </select>
          </div>
          <div class="field" id="workTypeFieldWrapper">
            <label>업무 유형</label>
            <select id="fWorkType">
              <option value="">업무 유형 선택</option>
              ${WORK_TYPES.map(wt=>`<option value="${wt}" ${t&&t.workType===wt?'selected':''}>${WORK_TYPE_ICONS[wt]} ${wt}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field">
          <label>담당자 <span class="hint">(최대 4명까지 선택 가능)</span></label>
          <div class="pill-group" id="fAssignee">
            ${WORKERS.map(w=>`<div class="pill ${t&&t.assignees&&t.assignees.includes(w)?'selected':''}" data-val="${w}">${workerDot(w)}${w}</div>`).join('')}
          </div>
          <div class="form-error" id="assigneeLimitMsg" style="display:none; margin-top:8px;">담당자는 최대 4명까지 선택할 수 있습니다.</div>
        </div>
        <div class="two-col">
          <div class="field">
            <label>시작일</label>
            <input type="date" id="fStart" value="${t?t.startDate:''}">
          </div>
          <div class="field">
            <label>마감일</label>
            <input type="date" id="fEnd" value="${t?t.endDate:''}">
          </div>
        </div>
        ${t ? `
        <div class="field" style="margin-top:-6px; margin-bottom:14px;">
          <button type="button" class="btn btn-ghost" id="mJumpToBoard" style="display:inline-flex; align-items:center; gap:6px; padding:7px 12px; font-size:12.5px;">📅 보드에서 일정 위치 보기</button>
        </div>` : ''}
        <div class="field" id="expectedDaysFieldWrapper">
          <div class="computed-days" id="computedDays" style="justify-content:space-between;">
            <span>예상 작업일수(영업일): <b id="daysVal">-</b></span>
            <span id="weekendWorkFieldWrapper" style="display:flex; align-items:center; gap:10px; font-size:12px; font-weight:600; color:var(--text-dim); white-space:nowrap;">
              <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                <input type="checkbox" id="fWeekendSat" ${t&&(t.weekendSat||t.weekendWork)?'checked':''} style="width:14px; height:14px; margin:0;">
                토요일 출근
              </label>
              <label style="display:flex; align-items:center; gap:4px; cursor:pointer;">
                <input type="checkbox" id="fWeekendSun" ${t&&(t.weekendSun||t.weekendWork)?'checked':''} style="width:14px; height:14px; margin:0;">
                일요일 출근
              </label>
            </span>
          </div>
        </div>
        <div class="field" id="completionField" style="display:${initialStatus==='완료'?'block':'none'};">
          <label>완료일 <span class="hint">(실제 작업을 마친 날짜)</span></label>
          <input type="date" id="fActualEnd" value="${t&&t.actualEndDate?t.actualEndDate:(t&&t.endDate?t.endDate:todayISO())}">
          <div class="computed-days" id="actualDaysBox" style="margin-top:8px;">실제 소요(영업일): <b id="actualDaysVal">-</b></div>
        </div>
        <div class="field" id="specFieldWrapper">
          <label>사이즈 · 포맷 · 구성 <span class="hint">(선택)</span></label>
          <textarea id="fSpec" rows="5" placeholder="작업 사이즈, 포맷, 어떤 내용인지 상세 내용을 적어주세요">${t?escapeHtml(t.spec||''):''}</textarea>
        </div>
        <div class="field" id="resourceCheckFieldWrapper" style="margin-bottom:8px;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600;">
            <input type="checkbox" id="fResourceCheckNeeded" ${t&&t.resourceCheckNeeded?'checked':''} style="width:15px; height:15px; margin:0;">
            리소스 마감일까지 도착 확인 필요 <span class="hint">(체크하면 보드에서 눈에 띄게 표시됩니다)</span>
          </label>
        </div>
        <div class="field" id="resourceDeadlineWrapper">
          <label>리소스 마감일 <span class="hint">(선택, 참고 자료가 준비되어야 하는 날짜)</span></label>
          <input type="date" id="fResourceDeadline" value="${t&&t.resourceDeadline?t.resourceDeadline:''}">
        </div>
        <div class="field" id="resourceFieldWrapper">
          <div class="repeat-field-head"><label id="resourceFieldLabel">리소스 링크 · 드라이브 위치 <span class="hint">(선택)</span></label><button type="button" class="add-link-btn" id="addResourceLink" title="리소스 링크 추가">＋</button></div>
          <div id="resourceInputs"></div>
        </div>
        <div class="field" id="referenceFieldWrapper">
          <div class="repeat-field-head"><label>레퍼런스 링크 <span class="hint">(선택)</span></label><button type="button" class="add-link-btn" id="addReferenceLink" title="레퍼런스 링크 추가">＋</button></div>
          <div id="referenceInputs"></div>
        </div>
        <div class="field" id="sbFieldWrapper">
          <label>SB · 기획안 <span class="hint">(선택, 스토리보드/기획 문서 링크 또는 메모)</span></label>
          <input type="text" id="fSB" value="${t?escapeHtml(t.sb||''):''}" placeholder="예: https://... SB/기획안 링크 또는 메모">
        </div>
        <div class="form-error" id="formError"></div>
      </div>
      <div class="modal-foot">
        <div style="display:flex; gap:8px;">
          ${t ? `<button class="btn btn-danger" id="mDelete">삭제</button><button class="btn btn-ghost" id="mCopyLink">🔗 링크 복사</button>` : ''}
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="footer-error" id="footerError"></span>
          <button class="btn btn-ghost" id="mCancel">취소</button>
          <button class="btn btn-primary" id="mSave">저장</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  let selStatus = initialStatus;
  let selProject = initialProject;
  let selAssignees = t ? [...(t.assignees||[])] : [];
  let selWorkType = t ? (t.workType || null) : null;

  function updateFieldsForProject(){
    const isAbsence = selProject === '부재';
    overlay.querySelector('#workTypeFieldWrapper').style.visibility = isAbsence ? 'hidden' : 'visible';
    overlay.querySelector('#sbFieldWrapper').style.display = isAbsence ? 'none' : 'block';
    overlay.querySelector('#resourceDeadlineWrapper').style.display = isAbsence ? 'none' : 'block';
    overlay.querySelector('#resourceCheckFieldWrapper').style.display = isAbsence ? 'none' : 'block';
    overlay.querySelector('#specFieldWrapper').style.display = isAbsence ? 'none' : 'block';
    overlay.querySelector('#referenceFieldWrapper').style.display = isAbsence ? 'none' : 'block';
    overlay.querySelector('#statusFieldWrapper').style.display = isAbsence ? 'none' : 'block';
    overlay.querySelector('#weekendWorkFieldWrapper').style.visibility = isAbsence ? 'hidden' : 'visible';
    overlay.querySelector('#expectedDaysFieldWrapper').style.display = isAbsence ? 'none' : 'block';
    if(isAbsence){
      overlay.querySelector('#completionField').style.display = 'none';
    } else if(selStatus==='완료'){
      overlay.querySelector('#completionField').style.display = 'block';
    }
    const label = overlay.querySelector('#resourceFieldLabel');
    const input = overlay.querySelector('#resourceInputs input');
    if(isAbsence){
      label.innerHTML = '비고 <span class="hint">(선택, 추가로 남길 메모)</span>';
      if(input) input.placeholder = '예: 인수인계 사항, 연락 가능 여부 등';
      overlay.querySelector('#addResourceLink').style.display='none';
    } else {
      label.innerHTML = '리소스 링크 · 드라이브 위치 <span class="hint">(선택)</span>';
      if(input) input.placeholder = '예: https://drive.google.com/... 또는 사내 드라이브 경로';
      overlay.querySelector('#addResourceLink').style.display='flex';
    }
  }
  updateFieldsForProject();

  overlay.querySelectorAll('#fStatus .pill').forEach(p=>{
    p.onclick = ()=>{
      const prevStatus = selStatus;
      selStatus = p.dataset.val;
      overlay.querySelectorAll('#fStatus .pill').forEach(x=>{ x.classList.remove('selected'); x.style.cssText=''; });
      p.classList.add('selected');
      const c = STATUS_COLORS[selStatus];
      p.style.cssText = `border-color:${c};background:${c}22;color:${c}`;
      overlay.querySelector('#completionField').style.display = (selStatus==='완료') ? 'block' : 'none';
      if(selStatus==='완료' && prevStatus!=='완료'){
        // '완료'로 처음 전환하는 순간에는 마감일을 그대로 완료일 기본값으로 채워준다.
        // 생각보다 일찍 끝난 경우에만 사용자가 이 필드를 수동으로 앞당기면 된다.
        const endVal = overlay.querySelector('#fEnd').value;
        if(endVal) overlay.querySelector('#fActualEnd').value = endVal;
      }
      updateActualDays();
    };
  });

  overlay.querySelector('#fProject').onchange = (e)=>{ selProject = e.target.value || null; updateFieldsForProject(); };
  overlay.querySelectorAll('#fAssignee .pill').forEach(p=>{
    p.onclick = ()=>{
      const val = p.dataset.val;
      const limitMsg = overlay.querySelector('#assigneeLimitMsg');
      if(selAssignees.includes(val)){
        selAssignees = selAssignees.filter(x=>x!==val);
        p.classList.remove('selected');
        limitMsg.style.display = 'none';
      } else if(selAssignees.length >= 4){
        limitMsg.style.display = 'block';
      } else {
        selAssignees.push(val);
        p.classList.add('selected');
        limitMsg.style.display = 'none';
      }
    };
  });
  overlay.querySelector('#fWorkType').onchange = (e)=>{ selWorkType = e.target.value || null; updateDays(); updateActualDays(); };

  const initialResourceLinks = t ? ((t.resourceLinks&&t.resourceLinks.length)?t.resourceLinks:[t.memo||'']) : [''];
  const initialReferenceLinks = t ? ((t.referenceLinks&&t.referenceLinks.length)?t.referenceLinks:[t.referenceLink||'']) : [''];
  function renderRepeatInputs(containerId, values, placeholder){
    const box=overlay.querySelector('#'+containerId);
    box.innerHTML=values.map((v,i)=>`<div class="repeat-input-row"><input type="text" value="${escapeHtml(v||'')}" placeholder="${placeholder}">${values.length>1?'<button type="button" class="remove-link-btn" title="삭제">✕</button>':''}</div>`).join('');
    box.querySelectorAll('.remove-link-btn').forEach((btn,i)=>btn.onclick=()=>{ values.splice(i,1); renderRepeatInputs(containerId,values,placeholder); });
  }
  renderRepeatInputs('resourceInputs', initialResourceLinks, '예: https://drive.google.com/... 또는 사내 드라이브 경로');
  renderRepeatInputs('referenceInputs', initialReferenceLinks, '예: https://... 참고 자료 링크');
  overlay.querySelector('#addResourceLink').onclick=()=>{ initialResourceLinks.push(''); renderRepeatInputs('resourceInputs',initialResourceLinks,'예: https://drive.google.com/... 또는 사내 드라이브 경로'); };
  overlay.querySelector('#addReferenceLink').onclick=()=>{ initialReferenceLinks.push(''); renderRepeatInputs('referenceInputs',initialReferenceLinks,'예: https://... 참고 자료 링크'); };


  function currentFormTicketDraft(){
    const satEl = overlay.querySelector('#fWeekendSat');
    const sunEl = overlay.querySelector('#fWeekendSun');
    return {
      id: editingId || '__draft__',
      project: selProject,
      assignees: selAssignees || [],
      workType: selWorkType,
      weekendSat: satEl ? satEl.checked : false,
      weekendSun: sunEl ? sunEl.checked : false
    };
  }
  function updateDays(){
    const s = overlay.querySelector('#fStart').value;
    const e = overlay.querySelector('#fEnd').value;
    const rdField = overlay.querySelector('#fResourceDeadline');
    const rd = rdField ? rdField.value : '';
    const el = overlay.querySelector('#daysVal');
    if(s && e && e>=s){
      const effectiveStart = rd ? nextBusinessDay(rd) : s;
      el.textContent = fmtDays(countWorkingDaysForTicket(effectiveStart, e, currentFormTicketDraft())) + '일';
    }
    else { el.textContent = '-'; }
  }
  function updateActualDays(){
    const s = overlay.querySelector('#fStart').value;
    const ae = overlay.querySelector('#fActualEnd') ? overlay.querySelector('#fActualEnd').value : '';
    const el = overlay.querySelector('#actualDaysVal');
    if(!el) return;
    if(s && ae && ae>=s){ el.textContent = fmtDays(countWorkingDaysForTicket(s, ae, currentFormTicketDraft())) + '일'; }
    else { el.textContent = '-'; }
  }
  overlay.querySelector('#fStart').oninput = ()=>{ updateDays(); updateActualDays(); };
  overlay.querySelector('#fEnd').oninput = updateDays;
  overlay.querySelector('#fResourceDeadline').oninput = updateDays;
  overlay.querySelector('#fActualEnd').oninput = updateActualDays;
  const fWeekendSatEl = overlay.querySelector('#fWeekendSat');
  const fWeekendSunEl = overlay.querySelector('#fWeekendSun');
  if(fWeekendSatEl) fWeekendSatEl.onchange = ()=>{ updateDays(); updateActualDays(); };
  if(fWeekendSunEl) fWeekendSunEl.onchange = ()=>{ updateDays(); updateActualDays(); };
  updateDays();
  updateActualDays();

  function close(){ overlay.remove(); }
  overlay.querySelector('#mClose').onclick = close;
  overlay.querySelector('#mCancel').onclick = close;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) close(); });

  const jumpBtn = overlay.querySelector('#mJumpToBoard');
  if(jumpBtn){
    jumpBtn.onclick = ()=>{
      const ticketId = t.id;
      const jumpStart = overlay.querySelector('#fStart').value || t.startDate;
      close();
      jumpToTicketOnBoard(ticketId, jumpStart);
    };
  }

  overlay.querySelector('#mCsvDownload').onclick = ()=>{
    const isAbsenceDraft = selProject === '부재';
    const draftTitle = overlay.querySelector('#fTitle').value.trim();
    const draftStart = overlay.querySelector('#fStart').value;
    const draftEnd = overlay.querySelector('#fEnd').value;
    const draftResourceLinks = isAbsenceDraft ? [] : Array.from(overlay.querySelectorAll('#resourceInputs input')).map(x=>x.value.trim()).filter(Boolean);
    const draftReferenceLinks = isAbsenceDraft ? [] : Array.from(overlay.querySelectorAll('#referenceInputs input')).map(x=>x.value.trim()).filter(Boolean);
    const draftSB = isAbsenceDraft ? '' : (overlay.querySelector('#fSB') ? overlay.querySelector('#fSB').value.trim() : '');
    const draftSpec = isAbsenceDraft ? '' : (overlay.querySelector('#fSpec') ? overlay.querySelector('#fSpec').value.trim() : '');
    const draftResourceDeadline = isAbsenceDraft ? '' : (overlay.querySelector('#fResourceDeadline') ? overlay.querySelector('#fResourceDeadline').value : '');
    const draftWeekendSat = isAbsenceDraft ? false : (overlay.querySelector('#fWeekendSat') ? overlay.querySelector('#fWeekendSat').checked : false);
    const draftWeekendSun = isAbsenceDraft ? false : (overlay.querySelector('#fWeekendSun') ? overlay.querySelector('#fWeekendSun').checked : false);
    const draft = {
      title: draftTitle || '(제목 없음)', project: selProject || '', workType: isAbsenceDraft ? '' : selWorkType,
      assignees: selAssignees, status: selStatus, startDate: draftStart, endDate: draftEnd,
      resourceLinks: draftResourceLinks, referenceLinks: draftReferenceLinks, memo: draftResourceLinks[0]||'',
      referenceLink: draftReferenceLinks[0]||'', sb: draftSB, spec: draftSpec,
      resourceDeadline: draftResourceDeadline, weekendSat: draftWeekendSat, weekendSun: draftWeekendSun
    };
    exportTicketsToCSV([draft], `티켓_${draftTitle||'제목없음'}_${csvFilenameTimestamp()}.csv`);
  };

  if(t){
    const copyLinkBtn = overlay.querySelector('#mCopyLink');
    if(copyLinkBtn){
      copyLinkBtn.onclick = async ()=>{
        const shareUrl = new URL(window.location.href);
        shareUrl.searchParams.set('ticket', t.id);
        shareUrl.hash = '';
        const text = shareUrl.toString();
        try{
          if(navigator.clipboard && window.isSecureContext){
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          showToast('티켓 링크를 복사했습니다.');
        }catch(e){
          window.prompt('아래 티켓 링크를 복사해주세요.', text);
        }
      };
    }
    let deleting = false;
    overlay.querySelector('#mDelete').onclick = async ()=>{
      if(deleting) return;
      if(!confirm('이 티켓을 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) return;
      deleting = true;
      TICKETS = TICKETS.filter(x=>x.id!==t.id);
      const ok = await persistTickets(true);
      if(ok){
        showToast('티켓을 삭제했습니다.');
      } else if(!persistenceAvailable()){
        showToast('저장할 수 없는 화면입니다. 안내 배너를 확인해주세요.');
        document.getElementById('storageWarningBanner').style.display = 'flex';
      } else {
        showToast('저장에 실패했습니다. 다시 시도해주세요.');
      }
      close();
      renderApp();
    };
  }

  let saving = false;
  async function attemptSave(retryCount){
    retryCount = retryCount || 0;
    const title = overlay.querySelector('#fTitle').value.trim();
    const start = overlay.querySelector('#fStart').value;
    const end = overlay.querySelector('#fEnd').value;
    const actualEnd = overlay.querySelector('#fActualEnd').value;
    const resourceLinks = Array.from(overlay.querySelectorAll('#resourceInputs input')).map(x=>x.value.trim()).filter(Boolean);
    const memo = resourceLinks[0] || '';
    const sb = selProject==='부재' ? '' : overlay.querySelector('#fSB').value.trim();
    const resourceDeadline = selProject==='부재' ? '' : overlay.querySelector('#fResourceDeadline').value;
    const resourceCheckNeeded = selProject==='부재' ? false : (overlay.querySelector('#fResourceCheckNeeded') ? overlay.querySelector('#fResourceCheckNeeded').checked : false);
    const spec = selProject==='부재' ? '' : overlay.querySelector('#fSpec').value.trim();
    const referenceLinks = selProject==='부재' ? [] : Array.from(overlay.querySelectorAll('#referenceInputs input')).map(x=>x.value.trim()).filter(Boolean);
    const referenceLink = referenceLinks[0] || '';
    const weekendSat = selProject==='부재' ? false : overlay.querySelector('#fWeekendSat').checked;
    const weekendSun = selProject==='부재' ? false : overlay.querySelector('#fWeekendSun').checked;
    const qtyInput = overlay.querySelector('#fQty');
    const qty = (selProject==='부재' || !qtyInput) ? 1 : Math.max(1, parseInt(qtyInput.value, 10) || 1);
    const errEl = overlay.querySelector('#formError');
    const footerErrEl = overlay.querySelector('#footerError');
    const saveBtn = overlay.querySelector('#mSave');

    const errors = [];
    if(!title) errors.push('제목을 입력해주세요.');
    if(!selProject) errors.push('프로젝트를 선택해주세요.');
    if(!selAssignees.length) errors.push('담당자를 한 명 이상 선택해주세요.');
    if(!start || !end) errors.push('시작일과 마감일을 모두 입력해주세요.');
    if(start && end && end < start) errors.push('마감일은 시작일보다 빠를 수 없습니다.');
    if(selStatus==='완료' && start && actualEnd && actualEnd < start) errors.push('완료일은 시작일보다 빠를 수 없습니다.');
    if(!selWorkType && selProject!=='부재') errors.push('업무 유형을 선택해주세요.');

    if(errors.length){
      errEl.style.display = 'block';
      errEl.textContent = errors.join(' ');
      // 스크롤을 내려야 보이는 하단 안내문 외에, 저장 버튼 바로 옆에도 즉시 보이도록 표시
      footerErrEl.textContent = '⚠ ' + errors[0];
      showToast(errors.join(' '));
      return;
    }
    errEl.style.display = 'none';
    errEl.textContent = '';
    footerErrEl.textContent = '';

    if(retryCount===0){
      saving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중...';
    }

    const now = new Date().toISOString();
    const isAbsenceSave = selProject === '부재';
    const payload = {
      title, project:selProject, assignees:selAssignees,
      status: isAbsenceSave ? null : selStatus,
      workType: isAbsenceSave ? null : selWorkType,
      startDate:start, endDate:end,
      actualEndDate: (!isAbsenceSave && selStatus==='완료') ? (actualEnd||null) : null,
      memo, resourceLinks: isAbsenceSave ? [] : resourceLinks, sb: isAbsenceSave ? '' : sb, resourceDeadline: (isAbsenceSave || !resourceDeadline) ? null : resourceDeadline,
      resourceCheckNeeded: isAbsenceSave ? false : !!resourceCheckNeeded,
      spec: isAbsenceSave ? '' : spec, referenceLink: isAbsenceSave ? '' : referenceLink, referenceLinks: isAbsenceSave ? [] : referenceLinks,
      weekendSat: isAbsenceSave ? false : !!weekendSat, weekendSun: isAbsenceSave ? false : !!weekendSun,
      weekendWork: false, qty: isAbsenceSave ? 1 : qty, updatedAt:now
    };
    if(editingId){
      const idx = TICKETS.findIndex(x=>x.id===editingId);
      if(idx>-1) TICKETS[idx] = {...TICKETS[idx], ...payload};
    } else {
      TICKETS.push({id:uid(), ...payload, createdAt:now});
    }

    const ok = await persistTickets();

    if(ok){
      saving = false;
      showToast('저장했습니다.');
      close();
      renderApp();
    } else if(!persistenceAvailable()){
      // 저장소가 아예 연결되지 않은 환경 - 재시도해도 소용없으므로 바로 정확한 안내
      saving = false;
      saveBtn.disabled = false;
      saveBtn.textContent = '저장';
      errEl.style.display = 'block';
      errEl.textContent = '저장할 수 없는 화면입니다. 아래 배너를 확인해주세요.';
      document.getElementById('storageWarningBanner').style.display = 'flex';
    } else if(retryCount < 2){
      saveBtn.textContent = `저장 재시도 중... (${retryCount+1})`;
      setTimeout(()=>{ if(overlay.isConnected) attemptSave(retryCount+1); }, 1200 * (retryCount+1));
    } else {
      saving = false;
      saveBtn.disabled = false;
      saveBtn.textContent = '저장';
      errEl.style.display = 'block';
      errEl.textContent = '저장에 실패했습니다. 네트워크 상태를 확인하고 다시 시도해주세요.';
      showToast('저장에 실패했습니다. 다시 시도해주세요.');
    }
  }

  overlay.querySelector('#mSave').onclick = ()=>{
    if(saving) return;
    attemptSave(0);
  };
}

function openTicketFromSharedUrl(){
  const params = new URLSearchParams(window.location.search);
  const ticketId = params.get('ticket');
  if(!ticketId) return;
  const exists = TICKETS.some(t=>t.id===ticketId);
  if(exists){
    openModal(ticketId);
  } else {
    showToast('공유된 티켓을 찾을 수 없습니다.');
  }
}

/* ============================= 초기화 ============================= */
wireDeviceModeToggle();

(async function init(){
  const loadingText = document.getElementById('loadingVeil');
  const slowHintTimer = setTimeout(()=>{
    if(loadingText) loadingText.textContent = '불러오는 중... (시간이 오래 걸리면 저장소 연결에 문제가 있을 수 있어요)';
  }, 4000);

  function forceReveal(bannerHtml){
    document.getElementById('loadingVeil').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    if(bannerHtml){
      const b = document.getElementById('storageWarningBanner');
      b.style.display = 'flex';
      b.innerHTML = bannerHtml;
    }
    try{ renderApp(); }catch(e2){ /* 최후의 방어: 여기서도 실패하면 더 할 수 있는 게 없음 */ }
  }

  // 절대적인 최종 안전장치: 위에서 어떤 예외가 나든, 무슨 일이 있어도 이 시간 안에는 화면을 보여준다
  let unlocked = false;
  const hardTimeout = setTimeout(()=>{
    if(unlocked) return;
    unlocked = true;
    forceReveal('<span>⚠️ 초기화가 너무 오래 걸려 강제로 화면을 열었습니다. 데이터가 없거나 오래된 상태일 수 있으니 새로고침해보세요. 계속되면 브라우저 개발자도구(F12) → Console 탭의 빨간 에러 메시지를 확인해주세요.</span>');
  }, 25000);

  try{
    // Claude 아티팩트 자체 저장소가 있으면 그걸 그대로 쓰고, 없을 때만(깃허브 배포 등) Firebase 시도
    if(!storageAvailable()){
      await Promise.race([
        initFirebaseIfConfigured(),
        new Promise(resolve => setTimeout(resolve, 8000))
      ]);
    }

    // 저장소 응답이 없어도 화면이 영원히 멈추지 않도록 최대 대기시간을 둔다
    const timedOut = await Promise.race([
      loadTickets().then(()=>false),
      new Promise(resolve => setTimeout(()=>resolve(true), 8000))
    ]);
    clearTimeout(slowHintTimer);

    if(TICKETS.length === 0){
      TICKETS = buildSeedTickets();
      seedHolidayAbsences();
      await Promise.race([
        persistTickets(),
        new Promise(resolve => setTimeout(resolve, 4000))
      ]);
    } else {
      // 시작일이 되었거나 지난 '예정' 티켓은 자동으로 '작업중'으로 전환 (완료 처리는 계속 수기로)
      const advanced = autoAdvanceStatuses();
      const holidaysAdded = seedHolidayAbsences();
      const duplicateRemoved = removeDuplicateAutumnHolidaySeed();
      if(advanced || holidaysAdded || duplicateRemoved){
        await Promise.race([
          persistTickets(),
          new Promise(resolve => setTimeout(resolve, 4000))
        ]);
      }
    }

    if(unlocked) return; // 하드 타임아웃이 이미 처리한 경우 중복 실행 방지
    unlocked = true;
    clearTimeout(hardTimeout);

    document.getElementById('loadingVeil').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    if(!persistenceAvailable() || timedOut){
      document.getElementById('storageWarningBanner').style.display = 'flex';
      if(timedOut){
        document.getElementById('storageWarningBanner').innerHTML =
          '<span>⚠️ 저장소 응답이 너무 느려 잠시 후 다시 시도해주세요. Firestore Database가 아직 생성되지 않았거나, 보안 규칙이 막혀 있을 수 있습니다. (Firebase 콘솔 → Firestore Database → 규칙 탭을 확인해주세요.)</span>';
      }
    }
    renderApp();
    openTicketFromSharedUrl();
  }catch(e){
    if(unlocked) return;
    unlocked = true;
    clearTimeout(hardTimeout);
    clearTimeout(slowHintTimer);
    const msg = (e && e.message) ? e.message : String(e);
    forceReveal(`<span>⚠️ 초기화 중 오류가 발생했습니다: <code>${escapeHtml(msg)}</code> — 새로고침해보시고, 계속되면 이 메시지를 그대로 알려주세요.</span>`);
  }
})();
</script>
