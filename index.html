<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작업 스케줄 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root{
    --bg:#F4F5F7;
    --panel:#FFFFFF;
    --border:#E3E6EB;
    --border-strong:#C7CCD6;
    --text:#181B22;
    --text-dim:#6B7280;
    --text-faint:#9AA1AC;
    --accent:#0F6E63;
    --accent-dark:#0B5951;
    --accent-soft:#E1F3F0;
    --danger:#C43E3E;
    --danger-soft:#FBE7E7;
    --weekend-bg:#EEF0F3;
    --today-bg:#DCEEEB;
    --today-line:#0F6E63;
    --lane-h:38px;
    --shadow: 0 1px 2px rgba(20,22,26,.04), 0 4px 14px rgba(20,22,26,.06);
  }
  /* OS/브라우저가 다크모드여도 항상 화이트(라이트) 테마로 고정 */
  html{color-scheme:light;}
  :root{color-scheme:light;}
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#F4F5F7;
      --panel:#FFFFFF;
      --border:#E3E6EB;
      --border-strong:#C7CCD6;
      --text:#181B22;
      --text-dim:#6B7280;
      --text-faint:#9AA1AC;
      --accent:#0F6E63;
      --accent-dark:#0B5951;
      --accent-soft:#E1F3F0;
      --danger:#C43E3E;
      --danger-soft:#FBE7E7;
      --weekend-bg:#EEF0F3;
      --today-bg:#DCEEEB;
      --today-line:#0F6E63;
      --shadow: 0 1px 2px rgba(20,22,26,.04), 0 4px 14px rgba(20,22,26,.06);
    }
    html, body{background:var(--bg); color:var(--text);}
    input, select, textarea, button{color-scheme:light;}
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:212px; flex:none; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 14px; gap:18px;
  }
  .brand{padding:2px 6px 10px;}
  .brand-title{font-size:16px; font-weight:700; letter-spacing:-.2px;}
  .brand-sub{font-size:12px; color:var(--text-faint); margin-top:3px; line-height:1.4;}
  .new-ticket-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:#fff; border:none; border-radius:9px;
    padding:10px 12px; font-size:13.5px; font-weight:600; cursor:pointer;
    transition:background .15s ease;
  }
  .new-ticket-btn:hover{background:var(--accent-dark);}
  .new-ticket-btn.secondary{background:#fff; color:var(--text-dim); border:1px solid var(--border);}
  .new-ticket-btn.secondary:hover{background:var(--bg); color:var(--text);}
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px;
    color:var(--text-dim); font-weight:500; cursor:pointer; user-select:none; font-size:13.5px;
  }
  .nav-item:hover{background:var(--bg);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent-dark); font-weight:700;}
  .nav-icon{width:16px; text-align:center; font-size:14px;}
  .sidebar-footer{margin-top:auto; padding:10px 6px; font-size:11px; color:var(--text-faint); line-height:1.6; border-top:1px solid var(--border); padding-top:12px;}

  /* ---------- Main ---------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px 26px; border-bottom:1px solid var(--border); background:var(--panel);
  }
  .topbar-left{display:flex; align-items:center; gap:14px;}
  .topbar-actions{display:flex; align-items:center; gap:8px;}
  .topbar-actions .new-ticket-btn{padding:8px 14px; font-size:12.5px;}
  .subbar{
    display:flex; align-items:center; padding:12px 26px; border-bottom:1px solid var(--border); background:var(--panel);
  }
  .view-title{font-size:17px; font-weight:700;}
  .range-nav{display:flex; align-items:center; gap:8px;}
  .range-btn{
    width:30px; height:30px; border-radius:7px; border:1px solid var(--accent);
    background:var(--accent); cursor:pointer; font-size:14px; color:#fff; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 3px rgba(15,110,99,.3);
  }
  .range-btn:hover{background:var(--accent-dark); border-color:var(--accent-dark);}
  .range-label{font-size:13.5px; font-weight:600; color:var(--text); min-width:190px; text-align:center;}
  .today-btn{
    border:1px solid var(--border); background:#fff; border-radius:7px; padding:6px 12px;
    font-size:12.5px; font-weight:600; color:var(--text-dim); cursor:pointer;
  }
  .today-btn:hover{background:var(--bg);}
  .today-label-text{font-size:12.5px; color:var(--text-dim); margin-left:6px; white-space:nowrap;}
  .content{flex:1; overflow:auto; padding:22px 26px 60px;}

  /* ---------- Legend ---------- */
  .legend{display:flex; flex-wrap:wrap; gap:10px 16px; margin-bottom:16px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim);}
  .legend-swatch{width:11px; height:11px; border-radius:3px; flex:none;}
  .legend-chip{
    display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:20px;
    font-size:12px; font-weight:700; color:#2A2E35;
  }
  .legend-chip.filterable{cursor:pointer; user-select:none; transition:box-shadow .12s ease, opacity .12s ease;}
  .legend-chip.filterable:hover{box-shadow:0 0 0 2px rgba(20,22,26,.18) inset;}
  .legend-chip.filterable.active{box-shadow:0 0 0 2px rgba(20,22,26,.55) inset;}
  .legend-chip.reset-chip{background:#fff; border:1.5px dashed var(--border-strong); color:var(--text-faint); cursor:pointer;}
  .worker-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; flex:none; box-shadow:0 0 0 1px rgba(20,22,26,.15) inset;}

  /* ---------- Board ---------- */
  .board{background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); overflow:hidden;}
  .board-head{display:grid; grid-template-columns:132px repeat(14,1fr); border-bottom:1px solid var(--border);}
  .board-head-corner{padding:10px 12px; font-size:11.5px; color:var(--text-faint); font-weight:600; border-right:1px solid var(--border);}
  .day-col-head{
    padding:8px 4px; text-align:center; border-right:1px solid var(--border);
    font-size:11.5px; color:var(--text-dim);
  }
  .day-col-head:last-child{border-right:none;}
  .day-col-head.weekend{background:var(--weekend-bg);}
  .day-col-head.today{background:var(--accent); color:#fff;}
  .day-col-head.today .dow{color:rgba(255,255,255,.85);}
  .day-col-head.today .dnum{color:#fff;}
  .day-col-head .dow{font-size:10px; color:var(--text-faint); margin-bottom:2px;}
  .day-col-head .dnum{font-weight:700; font-size:13px;}
  .week-split{border-left:2px solid var(--border-strong) !important;}

  /* ---------- 월간 캘린더 뷰 ---------- */
  .mode-toggle{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-right:14px; flex:none;}
  .mode-btn{border:none; background:#fff; padding:7px 15px; font-size:12.5px; font-weight:700; color:var(--text-dim); cursor:pointer;}
  .mode-btn:not(:last-child){border-right:1px solid var(--border);}
  .mode-btn.active{background:var(--accent); color:#fff;}
  .mode-btn:hover:not(.active){background:var(--bg);}
  .month-head{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--border);}
  .month-head-cell{padding:9px 4px; text-align:center; font-size:11.5px; font-weight:600; color:var(--text-dim); border-right:1px solid var(--border);}
  .month-head-cell:last-child{border-right:none;}
  .month-head-cell.weekend-label{color:#C0392B;}
  .month-week{position:relative; display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--border);}
  .month-week:last-child{border-bottom:none;}
  .month-day-bg{border-right:1px solid var(--border); position:relative;}
  .month-day-bg:last-child{border-right:none;}
  .month-day-bg.weekend{background:var(--weekend-bg);}
  .month-day-bg.today{background:var(--today-bg); box-shadow:inset 1px 0 0 var(--today-line), inset -1px 0 0 var(--today-line);}
  .month-day-bg.out-month{opacity:.4;}
  .month-daynum{position:absolute; top:3px; left:6px; font-size:11px; font-weight:700; color:var(--text-dim);}
  .month-day-bg.today .month-daynum{color:var(--accent-dark);}
  .today-badge{
    display:inline-block; margin-left:4px; background:#C43E3E; color:#fff; font-size:8.5px; font-weight:800;
    padding:1.5px 6px; border-radius:20px; vertical-align:middle; line-height:1.4;
  }
  .ticket-bar.month-bar{margin:2px 2px;}
  .ticket-bar.month-bar.thin{margin:1px 2px;}
  .ticket-bar.month-bar.thin .seg-main{padding:0 5px;}
  .ticket-bar.month-bar.thin .seg-label{font-size:10px; line-height:1.2;}
  .ticket-bar.month-bar.thin .chain-badge{width:11px; height:11px; font-size:7px; top:-4px; right:-3px;}
  .month-bar-assignee{opacity:.75; font-weight:500;}
  .worker-filter-pill{
    display:inline-flex; align-items:center; padding:5px 13px; border-radius:20px; font-size:12px; font-weight:700;
    border:1.5px solid var(--border); background:#fff; color:var(--text-dim); cursor:pointer;
  }
  .worker-filter-pill:hover{background:var(--bg);}
  .worker-filter-pill.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark);}
  .worker-filter-pill.reset{border-style:dashed; color:var(--text-faint);}

  .board-row{display:grid; grid-template-columns:132px 1fr; border-bottom:1px solid var(--border);}
  .board-row:last-child{border-bottom:none;}
  .worker-cell{
    padding:10px 12px; border-right:1px solid var(--border); display:flex; flex-direction:column; justify-content:center; gap:2px;
    background:#FBFBFC;
  }
  .worker-name{font-weight:700; font-size:13.5px;}
  .worker-meta{font-size:10.5px; color:var(--text-faint);}
  .worker-grid{
    position:relative; display:grid; grid-template-columns:repeat(14,1fr);
    grid-auto-rows:var(--lane-h);
  }
  .day-bg{border-right:1px solid var(--border);}
  .day-bg:last-child{border-right:none;}
  .day-bg.weekend{background:var(--weekend-bg);}
  .day-bg.today{background:var(--today-bg); box-shadow:inset 1px 0 0 var(--today-line), inset -1px 0 0 var(--today-line);}

  .ticket-bar{
    margin:3px 3px; border-radius:7px; display:flex; overflow:hidden; cursor:pointer;
    box-shadow:0 1px 1px rgba(0,0,0,.06); position:relative; align-self:stretch;
  }
  .ticket-bar:hover{outline:2.5px solid var(--accent); outline-offset:1px;}
  .ticket-bar.tb-done:hover{opacity:.92;}
  .resize-handle{
    position:absolute; top:0; bottom:0; width:10px; z-index:4;
    cursor:col-resize; touch-action:none;
  }
  .resize-handle.left{left:0;}
  .resize-handle.right{right:0;}
  .resize-handle.left::before, .resize-handle.right::before{
    content:''; position:absolute; top:0; bottom:0; width:2px;
    background:rgba(20,22,26,.30); opacity:0; transition:opacity .12s ease;
  }
  .resize-handle.left::before{left:1px;}
  .resize-handle.right::before{right:1px;}
  .ticket-bar:hover .resize-handle.left::before,
  .ticket-bar:hover .resize-handle.right::before,
  .resize-handle:active::before{opacity:1;}
  .ticket-bar.resizing{opacity:.4;}
  .new-ticket-modal{border:2.5px solid var(--danger); box-shadow:0 0 0 4px rgba(224,79,95,.18), 0 20px 60px rgba(0,0,0,.25);}
  .required-field label{color:var(--danger); font-weight:800;}
  .required-field input, .required-field select{border:2px solid var(--danger) !important;}
  .new-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%;
    background:var(--danger); color:#fff;
    font-size:12px; font-weight:800; letter-spacing:.5px;
    box-shadow:0 2px 6px rgba(224,79,95,.5);
    margin-left:10px; vertical-align:middle;
  }
  .seg{display:flex; align-items:center; min-width:0; height:100%; position:relative;}
  .seg-main{padding:0 7px; color:#2A2E35;}
  .seg-label{font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:relative; z-index:1;}
  .edge-date{font-size:9.5px; font-weight:800; color:#2A2E35; opacity:.75;}
  .edge-date.start-edge{position:absolute; left:5px; top:1px;}
  .edge-date.end-edge{position:absolute; right:5px; top:1px;}
  .chain-badge{
    position:absolute; top:-6px; right:-4px; background:#fff; border:1.5px solid var(--text);
    border-radius:50%; width:15px; height:15px; font-size:9px; display:flex; align-items:center; justify-content:center;
  }
  .absence-bar{
    background-image:repeating-linear-gradient(-45deg, rgba(255,255,255,.38) 0 6px, rgba(255,255,255,.08) 6px 12px) !important;
  }

  /* ---------- Cards / dashboard ---------- */
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media(max-width:980px){.grid-2{grid-template-columns:1fr;}}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px;}
  .card-title{font-size:14px; font-weight:700; margin:0 0 3px;}
  .card-sub{font-size:11.5px; color:var(--text-faint); margin:0 0 14px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-name{width:64px; flex:none; font-size:12.5px; font-weight:600;}
  .bar-track{flex:1; background:var(--bg); border-radius:6px; height:20px; overflow:hidden; position:relative;}
  .bar-fill{height:100%; border-radius:6px; background:var(--accent);}
  .bar-val{width:56px; flex:none; text-align:right; font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums;}

  table.simple{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.compact-matrix{width:auto; min-width:0;}
  table.compact-matrix th, table.compact-matrix td{padding:6px 14px; text-align:center; white-space:nowrap;}
  table.compact-matrix th:first-child, table.compact-matrix td:first-child{text-align:left; padding-left:8px; padding-right:20px;}
  table.simple th{text-align:left; color:var(--text-faint); font-weight:600; font-size:11.5px; padding:6px 8px; border-bottom:1px solid var(--border);}
  table.simple td{padding:8px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
  table.simple tr:last-child td{border-bottom:none;}
  table.simple th.sortable-th{cursor:pointer; user-select:none; white-space:nowrap; background:rgba(15,110,99,.06); border-radius:4px 4px 0 0;}
  table.simple th.sortable-th:hover{color:var(--text-dim); background:rgba(15,110,99,.12);}
  table.simple th.sortable-th .sort-arrow{color:var(--accent-dark); margin-left:3px; font-size:10px;}
  table.simple th.sortable-th .sort-arrow.inactive{color:var(--accent); opacity:.5;}
  table.simple td.cb-cell, table.simple th.cb-cell{width:34px; padding-left:10px; padding-right:0;}
  .ticket-select-cb, #searchSelectAll{width:15px; height:15px; cursor:pointer; margin:0;}
  .tr-absence{background:#FFF3C4;}
  .tr-absence:hover{background:#FFEBA8;}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .table-scroll table{width:100%;}
  .search-results-toolbar{display:flex; align-items:center; justify-content:space-between; margin:14px 0 8px; gap:10px; flex-wrap:wrap;}
  .csv-download-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 13px; font-size:12px;}
  .csv-download-btn:disabled{opacity:.45; cursor:not-allowed;}
  .absence-alert-item{display:flex; align-items:center; gap:8px; font-size:14.5px; padding:12px 15px; border-radius:10px; background:var(--bg); margin-bottom:9px;}
  .absence-alert-item:last-child{margin-bottom:0;}
  .absence-alert-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  @media(max-width:820px){.absence-alert-grid{grid-template-columns:1fr;}}
  .absence-alert-heading{font-size:14px; font-weight:800; color:var(--text-dim); margin:0 0 10px;}
  .dday-badge{display:inline-flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent-dark); font-size:12px; font-weight:800; padding:3px 9px; border-radius:20px; flex:none;}
  .proj-chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:20px; color:#fff; white-space:nowrap;}
  .status-chip{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;}
  .status-progress{background:var(--accent-soft); color:var(--accent-dark);}
  .status-upcoming{background:#EAECF0; color:var(--text-dim);}
  .status-done{background:#F1F2F4; color:var(--text-faint);}
  .status-hold{background:#FBEBD3; color:#8A5518;}
  .empty-note{color:var(--text-faint); font-size:12.5px; padding:18px 4px; text-align:center;}
  .deadline-danger{color:var(--danger); font-weight:800;}
  .qty-badge{display:inline-block; font-size:10.5px; font-weight:800; color:var(--accent-dark); background:var(--accent-soft); padding:1px 6px; border-radius:8px; vertical-align:middle;}
  .resource-flag-badge{display:inline-flex; align-items:center; gap:3px; background:var(--accent); color:#fff; font-size:10px; font-weight:800; padding:2px 7px; border-radius:20px; margin-right:6px; white-space:nowrap; vertical-align:middle;}
  tr.tr-resource-alert td{background:var(--accent-soft);}
  .ticket-bar.tb-done{opacity:.5;}
  .ticket-bar.tb-hold{box-shadow:0 0 0 2px var(--border-strong) inset; opacity:.85;}
  @keyframes ticketJumpFlash{
    0%, 100% { box-shadow:0 0 0 0 rgba(232,169,52,0); filter:brightness(1); }
    15% { box-shadow:0 0 0 5px rgba(232,169,52,.95); filter:brightness(1.3); }
    35% { box-shadow:0 0 0 1px rgba(232,169,52,.35); filter:brightness(1.05); }
    55% { box-shadow:0 0 0 5px rgba(232,169,52,.95); filter:brightness(1.3); }
    75% { box-shadow:0 0 0 1px rgba(232,169,52,.3); filter:brightness(1.05); }
  }
  .ticket-jump-highlight{ animation:ticketJumpFlash 1.7s ease-in-out 1; z-index:6; }
  .board-summary{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px;}
  .board-summary .card{min-width:0;}
  .board-summary table.simple{width:100%;}
  .board-summary table.simple th, .board-summary table.simple td{word-break:break-word;}
  @media(max-width:980px){.board-summary{grid-template-columns:1fr;}}
  .mini-legend{display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:var(--text-faint); margin-bottom:14px;}
  .mini-legend span b{color:var(--text-dim); font-weight:700;}

  /* ---------- Ticket list view ---------- */
  .list-toolbar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .list-toolbar select, .list-toolbar input{
    border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:12.5px; font-family:inherit; background:#fff;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,22,26,.42); display:none; align-items:flex-start; justify-content:center;
    padding:5vh 16px; z-index:50; overflow:auto;
  }
  .overlay.open{display:flex;}
  .modal{background:#fff; width:100%; max-width:520px; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.25); overflow:hidden;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
  .modal-head h3{margin:0; font-size:15.5px; font-weight:700;}
  .modal-close{border:none; background:none; font-size:18px; color:var(--text-faint); cursor:pointer; line-height:1;}
  .modal-body{padding:20px 22px; max-height:66vh; overflow:auto;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:7px; color:var(--text);}
  .field .hint{font-weight:400; color:var(--text-faint); font-size:11px; margin-left:4px;}
  .field input[type=text], .field input[type=date], .field textarea{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:13px; font-family:inherit;
  }
  .field input:focus, .field textarea:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:60px;}
  .pill-group{display:flex; flex-wrap:wrap; gap:7px;}
  .pill{
    border:1.5px solid var(--border); background:#fff; border-radius:20px; padding:6px 13px;
    font-size:12.5px; font-weight:600; cursor:pointer; color:var(--text-dim);
  }
  .pill.selected{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark);}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .select-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field select{width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 34px 9px 11px; font-size:13px; font-family:inherit; background:#fff; color:var(--text); cursor:pointer;}
  .field select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}
  .repeat-field-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px;}
  .repeat-field-head label{margin-bottom:0;}
  .add-link-btn{width:26px; height:26px; flex:none; border:1px solid var(--border); border-radius:7px; background:#fff; color:var(--accent-dark); font-size:18px; line-height:1; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .add-link-btn:hover{background:var(--accent-soft); border-color:var(--accent);}
  .copy-drive-btn{
    border:1px solid var(--border); background:#fff; border-radius:6px; padding:3px 9px; font-size:11px; font-weight:700;
    color:var(--accent-dark); cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  .copy-drive-btn:hover{background:var(--accent-soft); border-color:var(--accent);}
  .repeat-input-row{display:flex; gap:6px; margin-bottom:7px;}
  .repeat-input-row:last-child{margin-bottom:0;}
  .repeat-input-row input{flex:1; min-width:0;}
  .remove-link-btn{width:34px; flex:none; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text-faint); cursor:pointer; font-size:15px;}
  .remove-link-btn:hover{background:var(--danger-soft); color:var(--danger); border-color:#F3C6C6;}
  .computed-days{
    display:flex; align-items:center; gap:8px; background:var(--bg); border-radius:8px; padding:10px 12px; font-size:12.5px; color:var(--text-dim);
  }
  .computed-days b{color:var(--text); font-size:14px;}
  .form-error{color:var(--danger); font-size:12px; margin-top:8px; display:none;}
  .footer-error{color:var(--danger); font-size:12.5px; font-weight:700; max-width:280px; text-align:right; line-height:1.4;}
  .modal-foot{display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-top:1px solid var(--border); background:#FAFAFB;}
  .btn{border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:none; color:var(--text-dim); border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--bg);}
  .btn-danger{background:var(--danger-soft); color:var(--danger);}
  .btn-danger:hover{background:#F6D3D3;}
  .btn-jump{background:var(--accent); color:#fff;}
  .btn-jump:hover{background:var(--accent-dark);}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff;
    padding:10px 18px; border-radius:8px; font-size:13px; z-index:10000; opacity:0; pointer-events:none; transition:opacity .2s ease;
    max-width:min(620px, 92vw); line-height:1.55; text-align:center;
  }
  .toast.show{opacity:1;}

  .loading-veil{position:fixed; inset:0; background:var(--bg); z-index:200; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:13px;}
  .storage-warning{
    background:#FDECEC; color:#8A2020; border-bottom:1px solid #F3C6C6; padding:10px 20px; font-size:12.5px;
    line-height:1.5; align-items:center; justify-content:center; text-align:center; position:sticky; top:0; z-index:60;
  }

  /* ---------- 저장 상태 표시 (PC: 상단 가운데 / 모바일: 전체화면 버튼 왼쪽) ---------- */
  /* 기본값은 어느 슬롯에도 못 붙었을 때의 안전한 위치(상단 가운데 고정) */
  .save-status{
    position:fixed; top:10px; left:50%; transform:translateX(-50%);
    z-index:9998; display:flex; flex-direction:column; align-items:center;
  }
  .topbar-center .save-status,
  .mobile-save-slot .save-status{position:relative; top:auto; left:auto; transform:none;}
  .mobile-save-slot{display:flex; align-items:center;}

  .save-status-pill{
    position:relative; display:flex; align-items:center; gap:10px;
    background:#fff; border:1.5px solid var(--border-strong); border-radius:12px;
    padding:7px 15px 7px 12px; box-shadow:var(--shadow); cursor:pointer;
    font-family:inherit; text-align:left; min-width:190px;
  }
  .save-status-pill:hover{filter:brightness(.985);}
  .save-status-icon{font-size:17px; line-height:1; flex:none;}
  .save-status-texts{display:flex; flex-direction:column; gap:0; min-width:0;}
  /* ★ 마지막 저장 시점(방금 전 / 3분 전 / 어제)이 주인공 - 가장 크고 진하게 */
  .save-status-hero{
    font-size:16px; font-weight:900; letter-spacing:-.4px; line-height:1.15;
    color:var(--text); white-space:nowrap;
  }
  .save-status-meta{
    font-size:10.5px; font-weight:700; color:var(--text-dim); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:255px; margin-top:1px;
  }
  .save-status-meta-short{display:none;}
  .save-status-badge{
    display:none; align-items:center; justify-content:center; min-width:20px; height:20px;
    padding:0 5px; border-radius:10px; background:#B8790F; color:#fff;
    font-size:11px; font-weight:900; flex:none;
  }
  .save-status-badge.is-conflict{background:var(--danger);}

  .save-status.is-ok .save-status-pill{border-color:#8FCFC2; background:#F1FAF8;}
  .save-status.is-ok .save-status-hero{color:var(--accent-dark);}
  .save-status.is-sync .save-status-pill{border-color:#B9C7DE; background:#F4F7FD;}
  .save-status.is-sync .save-status-hero{color:#2E4A7D;}
  .save-status.is-warn .save-status-pill{border-color:#E0B252; background:#FFF6E2;}
  .save-status.is-warn .save-status-hero{color:#8A5B00;}
  .save-status.is-err .save-status-pill{border-color:#E39A9A; background:#FDEAEA;}
  .save-status.is-err .save-status-hero{color:#8A2020;}
  .save-status.has-pending .save-status-pill{animation:savePulse 1.9s ease-in-out infinite;}
  .save-status.has-conflict .save-status-pill{border-color:var(--danger); background:#FDEAEA;}
  .save-status.has-conflict .save-status-meta{color:var(--danger); font-weight:800;}
  .save-status.flash .save-status-pill{animation:saveFlash .45s ease-in-out 4;}
  @keyframes savePulse{0%,100%{box-shadow:0 0 0 0 rgba(184,121,15,.4);} 50%{box-shadow:0 0 0 8px rgba(184,121,15,0);}}
  @keyframes saveFlash{0%,100%{transform:scale(1);} 50%{transform:scale(1.05);}}

  .save-panel{
    display:none; position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%);
    width:min(400px, 92vw); background:#fff; border:1px solid var(--border);
    border-radius:12px; box-shadow:0 16px 44px rgba(20,22,26,.2); padding:14px; cursor:default;
    z-index:9999; max-height:min(560px, 78vh); overflow-y:auto;
  }
  .save-status.open .save-panel{display:block;}
  .save-panel-hero{
    background:var(--bg); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; margin-bottom:12px;
  }
  .save-panel-hero-label{font-size:10.5px; font-weight:900; color:var(--text-faint); letter-spacing:.3px; margin-bottom:3px;}
  .save-panel-hero-rel{font-size:22px; font-weight:900; letter-spacing:-.6px; line-height:1.15;}
  .save-panel-hero-meta{font-size:11px; font-weight:700; color:var(--text-dim); margin-top:3px;}
  .save-panel-hero-ticket{
    font-size:11.5px; font-weight:800; margin-top:6px; padding:4px 7px; border-radius:6px;
    background:#fff; border:1px solid var(--border); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .save-panel-hero-state{font-size:11px; font-weight:800; line-height:1.5; margin-top:7px; padding:6px 8px; border-radius:6px;}
  .save-panel-hero-state.is-ok{background:#EAF6F3; color:var(--accent-dark);}
  .save-panel-hero-state.is-pending{background:#FFF1D6; color:#8A5B00;}
  .save-panel-title{font-size:11px; font-weight:900; color:var(--text-faint); letter-spacing:.3px; margin-bottom:5px;}
  .save-panel-big{font-size:15.5px; font-weight:900; letter-spacing:-.3px; margin-bottom:4px;}
  .save-panel-big span{font-size:11px; font-weight:700; color:var(--text-dim); margin-left:5px; letter-spacing:0;}
  /* 저장 단계 2단 카드: 기기 → 클라우드 */
  .save-steps{display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:stretch; margin-bottom:12px;}
  .save-steps-arrow{display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:900; color:var(--text-faint);}
  .save-step{
    border:1.5px solid var(--border); border-radius:10px; padding:9px 10px; background:#fff; min-width:0;
  }
  .save-step-head{font-size:10.5px; font-weight:900; color:var(--text-dim); margin-bottom:5px; white-space:nowrap;}
  .save-step-state{font-size:15px; font-weight:900; letter-spacing:-.3px; line-height:1.2;}
  .save-step-label{font-size:11.5px; font-weight:800; margin-top:3px; line-height:1.35;}
  .save-step-detail{font-size:10.5px; font-weight:700; color:var(--text-dim); margin-top:3px; line-height:1.4; word-break:keep-all;}
  .save-step-note{font-size:9.5px; font-weight:700; color:var(--text-faint); margin-top:4px; line-height:1.4;}
  .save-step.is-done{border-color:#8FCFC2; background:#F1FAF8;}
  .save-step.is-done .save-step-state{color:var(--accent-dark);}
  .save-step.is-busy{border-color:#B9C7DE; background:#F4F7FD;}
  .save-step.is-busy .save-step-state{color:#2E4A7D;}
  .save-step.is-warn{border-color:#E0B252; background:#FFF6E2;}
  .save-step.is-warn .save-step-state{color:#8A5B00;}
  .save-step.is-fail{border-color:#E39A9A; background:#FDEAEA;}
  .save-step.is-fail .save-step-state{color:var(--danger);}
  .save-step.is-idle{background:var(--bg);}
  .save-step.is-idle .save-step-state{color:var(--text-faint);}

  .save-panel-table{width:100%; border-collapse:collapse; font-size:11.5px;}
  .save-panel-table th{
    text-align:left; font-weight:700; color:var(--text-dim); padding:3px 8px 3px 0;
    white-space:nowrap; vertical-align:top; width:92px;
  }
  .save-panel-table td{padding:3px 0; color:var(--text); word-break:break-all;}
  .save-panel-conflict{
    margin-top:11px; padding:9px 10px; background:var(--danger-soft); color:#8A2020;
    border-radius:8px; font-size:11.5px; line-height:1.6; border:1px solid #F0C4C4;
  }
  .save-panel-err{
    margin-top:9px; padding:7px 9px; background:var(--danger-soft); color:#8A2020;
    border-radius:7px; font-size:10.5px; line-height:1.5; word-break:break-all;
  }
  .save-panel-note{
    margin-top:9px; padding:7px 9px; background:#FFF8E8; color:#8A5B00;
    border-radius:7px; font-size:10.5px; line-height:1.55;
  }
  .save-panel-actions{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px;}
  .save-panel-btn{
    flex:1 1 calc(50% - 3px); padding:8px; border-radius:7px; border:1px solid var(--border-strong);
    background:#fff; font-size:11px; font-weight:800; cursor:pointer; color:var(--text); font-family:inherit;
  }
  .save-panel-btn:hover{background:var(--bg);}
  .save-panel-btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .save-panel-btn.primary:hover{background:var(--accent-dark);}
  .save-panel-btn.danger{flex:1 1 100%; background:var(--danger); border-color:var(--danger); color:#fff;}
  .save-panel-btn.danger:hover{background:#A93030;}

  /* ---------- 모바일: 전체화면 버튼과 같은 크기의 텍스트 버튼 ---------- */
  .save-status.as-mobile .save-status-pill{
    min-width:0; height:34px; padding:0 9px; gap:5px; border-radius:9px; border-width:1px;
  }
  .save-status.as-mobile .save-status-icon{font-size:12px;}
  .save-status.as-mobile .save-status-hero{font-size:12px; font-weight:900; line-height:1.2; max-width:82px; overflow:hidden; text-overflow:ellipsis;}
  .save-status.as-mobile .save-status-meta{display:none;}
  .save-status.as-mobile .save-status-meta-short{
    display:block; font-size:8.5px; font-weight:800; line-height:1.2; color:var(--text-dim);
    max-width:82px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .save-status.as-mobile.is-ok .save-status-meta-short{color:var(--accent-dark);}
  .save-status.as-mobile.is-warn .save-status-meta-short{color:#8A5B00;}
  .save-status.as-mobile.is-err .save-status-meta-short,
  .save-status.as-mobile.has-conflict .save-status-meta-short{color:var(--danger);}
  .save-status.as-mobile .save-status-badge{min-width:16px; height:16px; font-size:9.5px; padding:0 4px;}
  .save-status.as-mobile .save-panel{left:auto; right:0; transform:none; width:min(320px, 84vw);}

  /* ---------- 저장 진행 팝업 ---------- */
  .save-progress-backdrop{
    position:fixed; inset:0; z-index:20000; background:rgba(20,22,26,.5);
    display:flex; align-items:center; justify-content:center; padding:20px;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  }
  .save-progress{
    width:min(340px, 92vw); background:#fff; border-radius:16px; padding:22px 20px 18px;
    box-shadow:0 20px 60px rgba(0,0,0,.35); text-align:center;
    border:2px solid var(--accent); animation:spPop .18s ease-out;
  }
  .save-progress.is-done{border-color:var(--accent);}
  .save-progress.is-fail{border-color:var(--danger);}
  @keyframes spPop{from{transform:scale(.94); opacity:0;} to{transform:scale(1); opacity:1;}}
  .sp-spinner{
    width:38px; height:38px; margin:0 auto 12px; border-radius:50%;
    border:4px solid var(--accent-soft); border-top-color:var(--accent);
    animation:spSpin .8s linear infinite;
  }
  @keyframes spSpin{to{transform:rotate(360deg);}}
  .sp-check{width:38px; height:38px; margin:0 auto 12px; border-radius:50%; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; font-size:21px;}
  .sp-check::after{content:'✅';}
  .sp-warn{width:38px; height:38px; margin:0 auto 12px; border-radius:50%; background:var(--danger-soft);
    display:flex; align-items:center; justify-content:center; font-size:21px;}
  .sp-warn::after{content:'⚠️';}
  .sp-title{font-size:16.5px; font-weight:900; letter-spacing:-.4px; margin-bottom:12px;}
  .save-progress.is-fail .sp-title{color:var(--danger);}
  .sp-steps{display:flex; align-items:stretch; justify-content:center; gap:6px; margin-bottom:11px;}
  .sp-step{
    flex:1 1 0; border:1.5px solid var(--border); border-radius:9px; padding:7px 6px; background:var(--bg);
    display:flex; flex-direction:column; gap:3px; min-width:0;
  }
  .sp-step span{font-size:10.5px; font-weight:800; color:var(--text-dim); white-space:nowrap;}
  .sp-step b{font-size:11.5px; font-weight:900; white-space:nowrap;}
  .sp-step.is-done{border-color:#8FCFC2; background:#F1FAF8;}
  .sp-step.is-done b{color:var(--accent-dark);}
  .sp-step.is-busy{border-color:#B9C7DE; background:#F4F7FD;}
  .sp-step.is-busy b{color:#2E4A7D;}
  .sp-step.is-fail{border-color:#E39A9A; background:#FDEAEA;}
  .sp-step.is-fail b{color:var(--danger);}
  .sp-arrow{display:flex; align-items:center; font-size:14px; font-weight:900; color:var(--text-faint);}
  .sp-note{font-size:11.5px; line-height:1.6; color:var(--text-dim); word-break:keep-all;}
  .sp-actions{display:flex; flex-direction:column; gap:6px; margin-top:12px;}
  .sp-actions:empty{display:none;}
  .sp-btn{
    padding:10px; border-radius:9px; border:1px solid var(--border-strong); background:#fff;
    font-size:12.5px; font-weight:800; cursor:pointer; color:var(--text); font-family:inherit;
  }
  .sp-btn:hover{background:var(--bg);}
  .sp-btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .sp-btn.primary:hover{background:var(--accent-dark);}
  .sp-btn:disabled{opacity:.6; cursor:default;}

  /* ---------- 충돌 내역 모달 ---------- */
  .cf-item{border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--panel);}
  .cf-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .cf-title{font-size:13.5px; font-weight:900;}
  .cf-when{font-size:10.5px; color:var(--text-faint); font-weight:700; white-space:nowrap;}
  .cf-note{font-size:12px; line-height:1.6; color:var(--text-dim); background:var(--bg); padding:8px 10px; border-radius:7px;}
  .cf-table{width:100%; border-collapse:collapse; font-size:11.5px;}
  .cf-table th{
    text-align:left; font-weight:800; color:var(--text-dim); padding:4px 8px 4px 0; vertical-align:top;
    white-space:nowrap; border-bottom:1px solid var(--border);
  }
  .cf-table td{padding:4px 8px 4px 0; vertical-align:top; border-bottom:1px solid var(--border); word-break:break-all;}
  .cf-table tr:first-child th{color:var(--text); font-size:11px;}
  .cf-mine{background:#FFF8E8; color:#8A5B00; font-weight:700;}
  .cf-theirs{background:#F1FAF8; color:var(--accent-dark); font-weight:700;}
  .cf-actions{display:flex; gap:7px; justify-content:flex-end; margin-top:10px;}
  .cf-btn{padding:7px 12px; font-size:11.5px;}

  /* 상단바: 좌(제목) - 중앙(저장 상태) - 우(부재 등록/새 티켓) */
  .topbar-left{flex:1 1 0; min-width:0;}
  .topbar-center{flex:0 0 auto; display:flex; justify-content:center;}
  .topbar-actions{flex:1 1 0; justify-content:flex-end;}
  @media (max-width:1180px){
    .save-status-pill{min-width:0; padding:6px 11px 6px 10px;}
    .save-status-hero{font-size:14px;}
    .save-status-meta{max-width:150px;}
  }
  @media (max-width:900px){
    .save-status-meta{display:none;}
  }

  /* ---------- PC/모바일 전환 토글 ---------- */
  .device-mode-toggle{
    position:fixed; top:10px; left:10px; z-index:9999;
    display:flex; gap:3px; background:#fff; border:1px solid var(--border); border-radius:20px; padding:3px;
    box-shadow:var(--shadow);
  }
  .device-mode-btn{
    border:none; background:none; padding:6px 12px; border-radius:16px; font-size:11.5px; font-weight:700;
    cursor:pointer; color:var(--text-dim); white-space:nowrap;
  }
  .device-mode-btn.active{background:var(--accent); color:#fff;}

  /* ---------- 모바일 미리보기(9:16 프레임) ---------- */
  body.mobile-preview{background:#1B1D22;}
  body.mobile-preview #app{
    display:flex !important; align-items:center; justify-content:center; min-height:100vh; padding:32px 12px;
  }
  .mobile-frame{
    width:min(430px, 92vw);
    aspect-ratio:9/16;
    max-height:92vh;
    background:var(--bg);
    border-radius:30px;
    border:8px solid #111318;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
  }
  /* ---------- 모바일 전체화면(몰입) 모드: 여백/테두리/PC·모바일 전환 버튼 없이 화면에 딱 맞춤 ---------- */
  body.mobile-immersive{overflow:hidden; position:fixed; inset:0; width:100%; height:100%;}
  body.mobile-immersive .device-mode-toggle{display:none;}
  body.mobile-immersive #app{padding:0 !important;}
  .mobile-frame.immersive{
    width:100vw; height:100vh; max-height:none; aspect-ratio:auto;
    border-radius:0; border:none; box-shadow:none;
  }
  .mobile-topbar{
    flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:12px 12px 10px; background:var(--panel); border-bottom:1px solid var(--border);
  }
  .mobile-topbar-right{flex:none; display:flex; align-items:center; gap:6px;}
  .mobile-date-nav{display:flex; align-items:center; gap:8px;}
  .mobile-nav-btn{
    width:28px; height:28px; border-radius:8px; border:none; background:var(--accent); color:#fff;

<script>
/* ============================= 상수 ============================= */

const PROJECTS = ['공통','부재','서든어택','TFD','오버워치','CSO','TF','ARC','낙원','SAZ'];

const WORKER_COLORS = {

  '임기백':'#F0E29A',

const STORAGE_KEY = 'tickets_v1';

/* =====================================================================
   깃허브(GitHub Pages) 등 Claude 밖에서 이 파일을 독립적으로 호스팅할 경우
   여기에 자신의 Firebase 프로젝트 설정을 채워 넣으면, 팀원 전체가 실시간으로
   같은 데이터를 보고 쓸 수 있는 온라인 저장소가 연결됩니다.

   설정 방법:
   1) https://console.firebase.google.com 에서 새 프로젝트 생성 (무료)
   2) 왼쪽 메뉴에서 Firestore Database 만들기 (테스트 모드로 시작해도 무방)
   3) 프로젝트 설정 > 내 앱 > 웹 앱 추가 후 아래 형식의 설정 객체를 복사해서
      FIREBASE_CONFIG 자리에 그대로 붙여넣기
   4) 이 파일(schedule.html)을 index.html 이름으로 깃허브 저장소에 올리고
      Settings > Pages 에서 배포하면 끝

   예시:
   const FIREBASE_CONFIG = {
     apiKey: "AIza....",
     authDomain: "my-team-scheduler.firebaseapp.com",
     projectId: "my-team-scheduler",
     storageBucket: "my-team-scheduler.appspot.com",
     messagingSenderId: "1234567890",
     appId: "1:1234567890:web:abcdef123456"
   };

   비워두면(null) 지금처럼 Claude 아티팩트 안에서 열었을 때만 저장됩니다.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyByMKPuh0s2tgf5e2YDX0XJqpJCzDIA4d4",
  authDomain: "pdcalender-ed915.firebaseapp.com",
  projectId: "pdcalender-ed915",
  storageBucket: "pdcalender-ed915.firebasestorage.app",
  messagingSenderId: "357047902824",
  appId: "1:357047902824:web:0a2495b0cbace871b851dd",
  measurementId: "G-JWQE6HSCXP"
};
/* =====================================================================
   저장 엔진 v2  ("저장했는데 롤백" 문제 해결용)

   [기존 구조의 문제]
   1) 모든 티켓을 문서 1개(tickets_v1)에 통짜 JSON으로 저장 → 두 사람(또는 두 탭)이
      비슷한 시각에 저장하면 나중 저장이 앞 저장을 통째로 덮어씀 = 내 티켓이 사라짐.
   2) 불러오기가 타임아웃되면 TICKETS=[] 이 되고, 그 상태에서 "데이터 없음"으로 판단해
      샘플 시드 데이터를 서버에 그대로 덮어써버림 = 전체 롤백.
   3) 서버 저장 실패 시 로컬에 아무것도 남기지 않아 새로고침하면 변경분이 소멸.
   4) 실시간 동기화가 없어 오래 열어둔 탭이 항상 옛 데이터를 들고 저장 = 롤백.

   [새 구조]
   - 티켓 1건 = 문서 1개 (tickets 컬렉션). 바뀐 티켓만 저장하므로 서로 덮어쓰지 않음.
   - 저장 전 트랜잭션으로 서버 updatedAt을 확인 → 서버가 더 최신이면 내 덮어쓰기를 포기하고
     서버 내용을 받아옴(조용한 데이터 손실 방지, 사용자에게 알림).
   - 모든 변경은 먼저 localStorage에 즉시 기록(로컬 저널). 서버 저장이 실패/지연되어도
     새로고침·브라우저 종료 후에도 변경분이 살아있고 자동으로 재시도해서 올림.
   - 서버에서 못 읽었을 땐 절대 아무것도 쓰지 않음(시드/자동정리 포함) → 롤백 원천 차단.
   - onSnapshot 실시간 반영으로 다른 사람 변경을 즉시 받아옴.
   - 화면 우측 상단에 저장 상태/마지막 저장 시각을 항상 표시.
   ===================================================================== */
const FIREBASE_COLLECTION = 'schedule_board';  // 구버전 통짜 문서가 있던 컬렉션
const LEGACY_DOC_ID  = 'tickets_v1';           // 구버전 통짜 문서 (마이그레이션 원본)
const BACKUP_DOC_ID  = 'backup_v2';            // 안전용 전체 스냅샷 백업 문서
const TICKETS_COLL   = 'tickets';              // 신규: 티켓 1건 = 문서 1개
const LS_CACHE_KEY   = 'schedule_cache_v2';    // 로컬 저널/캐시
const ARTIFACT_KEY_V2 = 'tickets_v2';          // Claude 아티팩트 저장소용 키

/* ---------- 로컬 저장소(브라우저) ---------- */
let localStorageOk = true;
function lsGet(k){
  try{ return window.localStorage.getItem(k); }catch(e){ localStorageOk = false; return null; }
}
function lsSet(k, v){
  try{ window.localStorage.setItem(k, v); return true; }catch(e){ localStorageOk = false; return false; }
}

/* ---------- 동기화 상태 ---------- */
let SYNCED = Object.create(null);          // id -> {h:내용해시, u:updatedAt, rev:서버 리비전}  (서버에 확실히 반영된 상태)
let PENDING_DELETES = Object.create(null); // id -> {u:updatedAt, rev:기준 리비전}  (삭제 요청했지만 서버 미반영)
let SRV_META = Object.create(null);        // id -> {rev, srvAt}  서버가 기록한 리비전/시각 (PC 시계와 무관)
let LAST_EDIT = null;                      // 진짜 마지막으로 수정/저장된 티켓 1건 {id, title, at, by}
let CONFLICTS = [];                        // 남의 수정과 부딪혀 반영되지 못한 내 수정 보관함
const CONFLICT_MAX = 60;
const SAVE = {
  state: 'init',            // init | syncing | saving | saved | pending | offline | localonly | readfail
  pending: 0,               // 서버 미반영 변경 건수
  lastServerSaveAt: null,   // 서버 저장 성공 시각(ms)
  lastServerReadAt: null,   // 서버에서 마지막으로 읽어온 시각(ms)
  lastLocalSaveAt: null,    // 로컬(브라우저)에 기록한 시각(ms)
  lastError: '',
  backendKind: 'none'       // firestore | artifact | local
};

function hash32(s){
  let h = 5381;
  for(let i=0;i<s.length;i++){ h = ((h<<5) + h + s.charCodeAt(i)) | 0; }
  return (h>>>0).toString(36) + '-' + s.length.toString(36);
}
const HASH_IGNORE = {_deleted:1, _serverAt:1, _rev:1, _srvAt:1};
function cleanTicket(t){
  // undefined 제거 + 내부 필드 제거 (서버 왕복 후에도 내용 해시가 동일하게 유지되도록 정규화)
  const out = {};
  Object.keys(t).sort().forEach(k=>{
    if(HASH_IGNORE[k]) return;
    if(t[k] === undefined) return;
    out[k] = t[k];
  });
  return out;
}
function ticketHash(t){
  const c = cleanTicket(t);
  let s = '';
  Object.keys(c).forEach(k=>{ s += k + ':' + JSON.stringify(c[k]) + '|'; });
  return hash32(s);
}
function normalizeTicket(raw){
  const t = cleanTicket(raw || {});
  if(!Array.isArray(t.assignees)) t.assignees = t.assignee ? [t.assignee] : [];
  if(!t.updatedAt) t.updatedAt = t.createdAt || new Date(0).toISOString();
  return t;
}

/* ---------- 로컬 캐시(저널) 읽기/쓰기 ---------- */
function saveLocalCache(){
  const payload = {
    v: 2,
    savedAt: Date.now(),
    tickets: TICKETS.map(cleanTicket),
    synced: SYNCED,
    pendingDeletes: PENDING_DELETES,
    srvMeta: SRV_META,
    conflicts: CONFLICTS,
    lastEdit: LAST_EDIT
  };
  const ok = lsSet(LS_CACHE_KEY, JSON.stringify(payload));
  if(ok) SAVE.lastLocalSaveAt = payload.savedAt;
  return ok;
}
function loadLocalCache(){
  const raw = lsGet(LS_CACHE_KEY);
  if(!raw) return false;
  try{
    const p = JSON.parse(raw);
    if(!p || !Array.isArray(p.tickets)) return false;
    TICKETS = p.tickets.map(normalizeTicket);
    SYNCED = p.synced || Object.create(null);
    PENDING_DELETES = p.pendingDeletes || Object.create(null);
    SRV_META = p.srvMeta || Object.create(null);
    CONFLICTS = Array.isArray(p.conflicts) ? p.conflicts : [];
    LAST_EDIT = p.lastEdit || null;
    // 구버전 캐시 호환: 삭제 대기 값이 문자열(updatedAt)이던 형식을 객체로 승격
    Object.keys(PENDING_DELETES).forEach(id=>{
      if(typeof PENDING_DELETES[id] === 'string') PENDING_DELETES[id] = {u:PENDING_DELETES[id], rev:(SYNCED[id]&&SYNCED[id].rev)||0};
    });
    SAVE.lastLocalSaveAt = p.savedAt || null;
    return TICKETS.length > 0;
  }catch(e){ return false; }
}

/* ---------- 유틸 ---------- */
function withTimeout(promise, ms){
  return new Promise(resolve=>{
    let done = false;
    const timer = setTimeout(()=>{ if(!done){ done = true; resolve({__timeout:true}); } }, ms);
    Promise.resolve(promise).then(
      v=>{ if(!done){ done = true; clearTimeout(timer); resolve({value:v}); } },
      e=>{ if(!done){ done = true; clearTimeout(timer); resolve({error:e}); } }
    );
  });
}
function loadScriptWithTimeout(src, timeoutMs){
  return new Promise(resolve=>{
    let done = false;
    const finish = ok => { if(done) return; done = true; resolve(ok); };
    const el = document.createElement('script');
    el.src = src;
    el.onload = ()=>finish(true);
    el.onerror = ()=>finish(false);
    document.head.appendChild(el);
    setTimeout(()=>finish(false), timeoutMs);
  });
}
function srvMillis(v){
  // Firestore Timestamp | Date | number | null → ms
  if(!v) return null;
  try{
    if(typeof v.toMillis === 'function') return v.toMillis();
    if(typeof v.seconds === 'number') return v.seconds * 1000;
    if(v instanceof Date) return v.getTime();
    if(typeof v === 'number') return v;
  }catch(e){}
  return null;
}
function errMsg(e){
  if(!e) return '알 수 없는 오류';
  if(e.__timeout) return '응답 시간 초과';
  return (e.code ? e.code + ' / ' : '') + (e.message || String(e));
}

/* =====================================================================
   백엔드 (1) Firestore : 티켓 1건 = 문서 1개 + 실시간 구독
   ===================================================================== */
let firestoreDb = null;
const FirestoreBackend = {
  kind: 'firestore',
  ready: false,
  realtime: true,
  async init(){
    if(!FIREBASE_CONFIG) return false;
    try{
      if(typeof firebase === 'undefined' || !firebase.firestore){
        const ok1 = await loadScriptWithTimeout('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js', 6000);
        if(!ok1 || typeof firebase === 'undefined') throw new Error('Firebase SDK 로딩 실패');
        const ok2 = await loadScriptWithTimeout('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js', 6000);
        if(!ok2 || !firebase.firestore) throw new Error('Firestore SDK 로딩 실패');
      }
      if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      firestoreDb = firebase.firestore();
      try{ firestoreDb.settings({ignoreUndefinedProperties:true}); }catch(e){}
      this.ready = true;
      return true;
    }catch(e){
      SAVE.lastError = errMsg(e);
      firestoreDb = null;
      this.ready = false;
      return false;
    }
  },
  async readAll(){
    if(!firestoreDb) return {ok:false, error:'미연결'};
    const r = await withTimeout(firestoreDb.collection(TICKETS_COLL).get(), 15000);
    if(!('value' in r)) return {ok:false, error:errMsg(r.error || r)};
    const tickets = [], tombstones = Object.create(null), metas = Object.create(null);
    r.value.forEach(doc=>{
      const d = doc.data() || {};
      metas[doc.id] = {rev: d._rev || 0, srvAt: srvMillis(d._srvAt)};
      if(d._deleted){ tombstones[doc.id] = {rev: d._rev || 0, u: d.updatedAt || ''}; return; }
      tickets.push(normalizeTicket({...d, id: doc.id}));
    });
    // 신규 컬렉션이 비어 있으면 구버전 통짜 문서를 찾아 1회 이관
    if(!tickets.length && !Object.keys(tombstones).length){
      const legacy = await withTimeout(
        firestoreDb.collection(FIREBASE_COLLECTION).doc(LEGACY_DOC_ID).get(), 12000);
      if('value' in legacy && legacy.value && legacy.value.exists){
        try{
          const arr = JSON.parse(legacy.value.data().value || '[]');
          if(Array.isArray(arr) && arr.length){
            return {ok:true, tickets: arr.map(normalizeTicket), tombstones, metas, migrateFromLegacy:true};
          }
        }catch(e){}
      }
    }
    return {ok:true, tickets, tombstones, metas};
  },
  // changes: [{id, baseRev, deleted:false, ticket}] | [{id, baseRev, deleted:true, updatedAt}]
  // 리비전(_rev) 기반 낙관적 잠금: "내가 마지막으로 본 리비전"과 서버 리비전이 다르면
  // 그 사이 누군가 이 티켓을 고친 것이므로 절대 덮어쓰지 않고 충돌로 돌려준다.
  // PC 시계에 의존하지 않으므로 시계가 틀어진 사람이 있어도 판정이 어긋나지 않는다.
  async writeChanges(changes){
    if(!firestoreDb) return {ok:false, error:'미연결', done:[], conflicts:[]};
    const done = [], conflicts = [];
    for(const ch of changes){
      const ref = firestoreDb.collection(TICKETS_COLL).doc(ch.id);
      const r = await withTimeout(firestoreDb.runTransaction(async tx=>{
        const snap = await tx.get(ref);
        const srv = snap.exists ? (snap.data() || {}) : null;
        const srvRev = srv ? (srv._rev || 0) : 0;
        const baseRev = ch.baseRev || 0;
        if(srvRev !== baseRev){
          return {conflict:true, server: srv ? {...srv, id: ch.id} : null, srvRev};
        }
        const nextRev = srvRev + 1;
        const body = ch.deleted
          ? {_deleted:true, updatedAt: ch.updatedAt || new Date().toISOString(), _rev: nextRev}
          : {...cleanTicket(ch.ticket), _deleted:false, _rev: nextRev};
        try{ body._srvAt = firebase.firestore.FieldValue.serverTimestamp(); }catch(e){}
        tx.set(ref, body, {merge:false});
        return {rev: nextRev};
      }), 15000);
      if(!('value' in r)){
        return {ok:false, error:errMsg(r.error || r), done, conflicts};
      }
      if(r.value && r.value.conflict) conflicts.push({change:ch, server:r.value.server, rev:r.value.srvRev});
      else done.push({...ch, rev:(r.value && r.value.rev) || 0});
    }
    return {ok:true, done, conflicts};
  },
  subscribe(onChange, onError){
    if(!firestoreDb) return;
    try{
      firestoreDb.collection(TICKETS_COLL).onSnapshot(snap=>{
        SAVE.lastServerReadAt = Date.now();
        snap.docChanges().forEach(c=>{
          if(c.doc.metadata.hasPendingWrites) return; // 내 로컬 쓰기의 반향은 무시
          const d = c.doc.data() || {};
          onChange({
            id: c.doc.id,
            removed: (c.type === 'removed') || !!d._deleted,
            rev: d._rev || 0,
            srvAt: srvMillis(d._srvAt),
            ticket: normalizeTicket({...d, id: c.doc.id})
          });
        });
      }, err=>{ if(onError) onError(err); });
    }catch(e){ if(onError) onError(e); }
  },
  async writeBackup(tickets){
    if(!firestoreDb) return;
    try{
      await withTimeout(firestoreDb.collection(FIREBASE_COLLECTION).doc(BACKUP_DOC_ID).set({
        value: JSON.stringify(tickets.map(cleanTicket)),
        revs: JSON.stringify(SRV_META),
        count: tickets.length,
        updatedAt: new Date().toISOString()
      }), 12000);
    }catch(e){}
  }
};

/* =====================================================================
   백엔드 (2) Claude 아티팩트 저장소 : 키 1개 + 읽고-병합-쓰기 (덮어쓰기 방지)
   ===================================================================== */
function artifactStorageAvailable(){
  return !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function');
}
const ArtifactBackend = {
  kind: 'artifact',
  ready: false,
  realtime: false,
  async init(){ this.ready = artifactStorageAvailable(); return this.ready; },
  async _raw(key){
    const r = await withTimeout(window.storage.get(key, true), 12000);
    if(!('value' in r)) return {ok:false, error:errMsg(r.error || r)};
    return {ok:true, value: r.value ? r.value.value : null};
  },
  async readAll(){
    const cur = await this._raw(ARTIFACT_KEY_V2);
    if(!cur.ok) return {ok:false, error:cur.error};
    if(cur.value){
      try{
        const p = JSON.parse(cur.value);
        const arr = Array.isArray(p) ? p : (p.tickets || []);
        const metas = Object.create(null);
        arr.forEach(t=>{ if(t && t.id) metas[t.id] = {rev: t._rev || 0, srvAt: t._srvAt || null}; });
        return {ok:true, tickets: arr.map(normalizeTicket), tombstones: (p && p.tombstones) || Object.create(null), metas, _rawArr: arr};
      }catch(e){ return {ok:false, error:'저장 데이터 파싱 실패'}; }
    }
    const legacy = await this._raw(LEGACY_DOC_ID);
    if(legacy.ok && legacy.value){
      try{
        const arr = JSON.parse(legacy.value);
        if(Array.isArray(arr) && arr.length){
          return {ok:true, tickets: arr.map(normalizeTicket), tombstones:Object.create(null), metas:Object.create(null), migrateFromLegacy:true};
        }
      }catch(e){}
    }
    return {ok:true, tickets:[], tombstones:Object.create(null), metas:Object.create(null)};
  },
  async writeChanges(changes){
    // 통짜 키 1개이므로: 최신 서버 값을 읽고 → 리비전 확인 후 변경분만 병합 → 다시 쓴다
    const cur = await this.readAll();
    if(!cur.ok) return {ok:false, error:cur.error, done:[], conflicts:[]};
    const map = new Map((cur._rawArr || cur.tickets).map(t=>[t.id, t]));
    const tombs = cur.tombstones || Object.create(null);
    const metas = cur.metas || Object.create(null);
    const done = [], conflicts = [];
    changes.forEach(ch=>{
      const srvRaw = map.get(ch.id);
      const tomb = tombs[ch.id];
      const srvRev = srvRaw ? (srvRaw._rev || 0) : (tomb && typeof tomb === 'object' ? (tomb.rev || 0) : 0);
      const baseRev = ch.baseRev || 0;
      if(srvRev !== baseRev){
        conflicts.push({change:ch, server: srvRaw ? {...srvRaw} : null, rev:srvRev});
        return;
      }
      const nextRev = srvRev + 1;
      if(ch.deleted){
        map.delete(ch.id);
        tombs[ch.id] = {rev:nextRev, u: ch.updatedAt || new Date().toISOString()};
        done.push({...ch, rev:nextRev});
        return;
      }
      delete tombs[ch.id];
      map.set(ch.id, {...cleanTicket(ch.ticket), _rev:nextRev, _srvAt:Date.now()});
      done.push({...ch, rev:nextRev});
    });
    const body = JSON.stringify({v:2, tickets:[...map.values()], tombstones:tombs, savedAt:Date.now()});
    const w = await withTimeout(window.storage.set(ARTIFACT_KEY_V2, body, true), 12000);
    if(!('value' in w) || w.value === null) return {ok:false, error:errMsg(w.error || w), done:[], conflicts:[]};
    return {ok:true, done, conflicts};
  },
  subscribe(){ /* 실시간 없음 → 주기 폴링으로 대체 */ },
  async writeBackup(){}
};

/* ============================= 날짜 유틸 ============================= */
function parseISO(s){ return new Date(s+'T00:00:00'); }
function toISO(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function isWeekend(d){ const wd=d.getDay(); return wd===0||wd===6; }
function mondayOf(d){ const wd=d.getDay(); const diff=(wd===0?-6:1-wd); return addDays(d,diff); }
function businessDaysBetween(s,e){
  if(!s||!e) return 0;
  let sd=parseISO(s), ed=parseISO(e);
  if(ed<sd) return 0;
  let c=0, cur=new Date(sd);
  while(cur<=ed){ if(!isWeekend(cur)) c++; cur=addDays(cur,1); }
  return c;
}
function calendarDaysBetween(s,e){
  if(!s||!e) return 0;
  let sd=parseISO(s), ed=parseISO(e);
  if(ed<sd) return 0;
  return Math.round((ed-sd)/86400000)+1;
}
// 오프라인 촬영/라이브는 주말에도 실제로 진행되는 경우가 있어, 이런 유형은 주말도 영업일로 계산
const WEEKEND_WORK_TYPES = ['오프라인 촬영','라이브'];
// 특정 날짜(d)가 이 티켓 기준으로 '업무일'인지 판단.
// - 평일이면 항상 업무일
// - 오프라인 촬영/라이브 유형이면 주말도 항상 업무일
// - 그 외에는 티켓에서 체크한 '토요일 출근'/'일요일 출근' 여부에 따라 그 요일만 업무일로 처리
//   (weekendWork는 과거 단일 체크박스였던 데이터와의 하위 호환을 위해 함께 확인)
function isWorkingDayForTicket(d, t){
  const wd = d.getDay();
  if(wd!==0 && wd!==6) return true;
  if(WEEKEND_WORK_TYPES.includes(t.workType)) return true;
  if(wd===6) return !!(t.weekendSat || t.weekendWork);
  if(wd===0) return !!(t.weekendSun || t.weekendWork);
  return false;
}
// 영업일 '계산'에서 하루 단위로 셀 때 쓰는 기준 (시각적 바 이어보이기 판단용인 isWorkingDayForTicket과는 다름).
// 평일은 항상 포함, 촬영/라이브 유형은 주말도 매일 포함하되, '토요일 출근'/'일요일 출근' 체크로 인한 주말은
// 여기서 세지 않고 countWorkingDaysForTicket 마지막에 체크당 +1일만 별도로 더한다.
// (그렇게 안 하면 체크한 요일이 실제로 그 기간에 있을 때 이중으로 계산되어 버림)
function isCountableDayForTicket(d, t){
  const wd = d.getDay();
  if(wd!==0 && wd!==6) return true;
  return WEEKEND_WORK_TYPES.includes(t.workType);
}
// 영업일 계산: 라이브/오프라인 촬영은 주말도 업무일로 치고, 그 외 유형은 평일만 기본 업무일로 본다.
// 하루 단위로 세면서, 같은 날 같은 담당자가 동시에 진행 중인 티켓이 N개면(자기 자신 포함) 그 날은 1일이 아니라 1/N일로 계산한다.
// (2개 겹치면 각각 0.5일, 3개 겹치면 각각 1/3일 ...)
// '토요일 출근'/'일요일 출근' 체크는 기간과 무관하게 체크당 +1일만 추가한다 (겹침 보정과는 별개, 특정 날짜에 묶이지 않는 값이라 겹침 계산 대상 아님).
// 같은 날 같은 담당자가 동시에 진행 중인 티켓(자기 자신 포함)이 몇 개인지 센다.
// 부재는 '작업'이 아니므로 계산에서 제외한다.
function concurrentTicketCountForDay(iso, t){
  if(t.project === '부재' || !t.assignees || !t.assignees.length) return 1;
  let count = 1; // 자기 자신
  TICKETS.forEach(other=>{
    if(other.id === t.id || other.project === '부재') return;
    if(!other.assignees.some(a=> t.assignees.includes(a))) return;
    if(iso >= other.startDate && iso <= other.endDate) count++;
  });
  return count;
}
// 특정 날짜에 해당 담당자가 등록된 부재(휴가) 중인지 확인
function isAssigneeOnLeave(iso, assignee){
  return TICKETS.some(o=> o.project==='부재' && o.assignees.includes(assignee) && iso>=o.startDate && iso<=o.endDate);
}
// 티켓의 담당자 전원이 그 날 부재 중이면(일할 사람이 아무도 없으면) 그 날은 업무일에서 제외한다.
// (담당자가 여럿인 티켓에서 일부만 부재라면, 남은 담당자가 진행할 수 있으므로 그대로 계산한다)
function isTicketBlockedByAbsence(iso, t){
  if(t.project === '부재' || !t.assignees || !t.assignees.length) return false;
  return t.assignees.every(a=> isAssigneeOnLeave(iso, a));
}
// 티켓 기간 [s,e] 안에 특정 요일(targetDow: 0=일,6=토)이 한 번이라도 있는지 확인
function rangeIncludesWeekday(s, e, targetDow){
  let sd=parseISO(s), ed=parseISO(e);
  if(ed<sd) return false;
  let cur = new Date(sd);
  while(cur<=ed){
    if(cur.getDay()===targetDow) return true;
    cur = addDays(cur,1);
  }
  return false;
}
function countWorkingDaysForTicket(s,e,t){
  if(!s||!e) return 0;
  let sd=parseISO(s), ed=parseISO(e);
  if(ed<sd) return 0;
  let days = 0, cur = new Date(sd);
  while(cur<=ed){
    const iso = toISO(cur);
    if(isCountableDayForTicket(cur, t) && !isTicketBlockedByAbsence(iso, t)){
      days += 1 / concurrentTicketCountForDay(iso, t);
    }
    cur = addDays(cur,1);
  }
  // '토요일 출근'/'일요일 출근' 체크는 그 요일이 실제로 이 기간 안에 있을 때만 +1일 적용
  // (기간에 아예 없는 요일을 체크해도 날짜가 늘어나지 않도록)
  if(!WEEKEND_WORK_TYPES.includes(t.workType)){
    if((t.weekendSat || t.weekendWork) && rangeIncludesWeekday(s,e,6)) days += 1;
    if((t.weekendSun || t.weekendWork) && rangeIncludesWeekday(s,e,0)) days += 1;
  }
  return days;
}
function nextBusinessDay(iso){ let d=addDays(parseISO(iso),1); while(isWeekend(d)) d=addDays(d,1); return toISO(d); }
function overlapBD(startISO,endISO,rs,re){
  const s = startISO > rs ? startISO : rs;
  const e = endISO < re ? endISO : re;
  if(s>e) return 0;
  return businessDaysBetween(s,e);
}
function clipRange(s,e,rs,re){
  const cs = s<rs ? rs : s;
  const ce = e>re ? re : e;
  if(cs>ce) return null;
  return [cs,ce];
}
// 티켓 기준으로 '업무일이 아닌 날(쉬는 토/일)'에는 바를 끊어서, 이어지는 업무일 구간별로 나눠 반환한다.
// alwaysContinuous가 true이면(부재) 나누지 않고 통째로 이어서 반환한다.
function splitSegmentsByWorkDays(startISO, endISO, t, alwaysContinuous){
  if(alwaysContinuous) return [[startISO, endISO]];
  const segments = [];
  let curStart = null, prevIso = null;
  let d = parseISO(startISO);
  const end = parseISO(endISO);
  while(d <= end){
    const iso = toISO(d);
    if(isWorkingDayForTicket(d, t)){
      if(curStart === null) curStart = iso;
    } else if(curStart !== null){
      segments.push([curStart, prevIso]); curStart = null;
    }
    prevIso = iso;
    d = addDays(d,1);
  }
  if(curStart !== null) segments.push([curStart, prevIso]);
  // 극단적으로 티켓 기간 전체가 쉬는 날로만 이루어진 경우, 표시가 아예 사라지지 않도록 원래 구간을 그대로 반환
  return segments.length ? segments : [[startISO, endISO]];
}
function monthRange(offset){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+offset;
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  return [toISO(first), toISO(last)];
}
function quarterRange(q, year){
  const startMonth = (q-1)*3;
  const first = new Date(year, startMonth, 1);
  const last = new Date(year, startMonth+3, 0);
  return [toISO(first), toISO(last)];
}
function fmtShort(iso){ const d=parseISO(iso); return `${d.getMonth()+1}/${d.getDate()}`; }
function fmtFull(iso){ const d=parseISO(iso); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }
function todayISO(){ return toISO(new Date()); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= 한글 조사 처리 (분기 피드백 텍스트용) ============================= */
function hasBatchim(str){
  if(!str) return false;
  const ch = str[str.length-1];
  const code = ch.charCodeAt(0);
  if(code < 0xAC00 || code > 0xD7A3) return false;
  return (code - 0xAC00) % 28 !== 0;
}
function josa(word, withBatchim, withoutBatchim){
  return hasBatchim(word) ? withBatchim : withoutBatchim;
}

/* ============================= 담당자 분기 피드백 텍스트 생성 ============================= */
function buildQuarterFeedbackText(worker, tickets, start, end){
  const lines = [];
  const header = `[${worker} 작업 내역] ${fmtFull(start)} ~ ${fmtFull(end)}`;
  lines.push(header, '');

  if(!tickets.length){
    lines.push(`해당 기간 동안 ${worker}${josa(worker,'은','는')} 등록된 작업 티켓이 없습니다.`);
    return lines.join('\n');
  }

  // 티켓 1건의 수량(qty)을 건수에 그대로 반영 (예: 숏폼 1티켓에 3종이 묶여있으면 3건으로 집계)
  const qtyOf = t => t.qty || 1;

  // 프로젝트별로 묶기 (등장 순서 유지)
  const projectOrder = [];
  const byProject = {};
  tickets.forEach(t=>{
    if(!byProject[t.project]){ byProject[t.project] = []; projectOrder.push(t.project); }
    byProject[t.project].push(t);
  });

  const projectNameList = projectOrder.join(', ');
  lines.push(`${worker}${josa(worker,'은','는')} 이번 기간 동안 ${projectNameList} 업무를 진행하였습니다.`);
  lines.push('');

  // ---- 프로젝트별 단락 ----
  projectOrder.forEach(project=>{
    const projTickets = byProject[project];
    const projectQtyTotal = projTickets.reduce((sum,t)=> sum+qtyOf(t), 0);

    // 업무 유형별로 묶기 (등장 순서 유지)
    const typeOrder = [];
    const byType = {};
    projTickets.forEach(t=>{
      const wt = t.workType || '기타';
      if(!byType[wt]){ byType[wt] = []; typeOrder.push(wt); }
      byType[wt].push(t);
    });

    lines.push(`■ ${project} (총 ${projectQtyTotal}건)`);
    typeOrder.forEach(wt=>{
      const ts = byType[wt];
      const qty = ts.reduce((sum,t)=> sum+qtyOf(t), 0);
      const titleList = ts.map(t=> `'${t.title}'${qtyOf(t)>1?`(${qtyOf(t)}종)`:''}`).join(', ');
      lines.push(`  - ${wt} ${qty}건: ${titleList}`);
    });
    lines.push('');
  });

  // ---- 기간 내 작업 유형별 평균 소요 영업일 ----
  const typeOrderAll = [];
  const byTypeAll = {};
  tickets.forEach(t=>{
    const wt = t.workType || '기타';
    if(!byTypeAll[wt]){ byTypeAll[wt] = []; typeOrderAll.push(wt); }
    byTypeAll[wt].push(t);
  });

  lines.push(`[이 기간 작업 유형별 평균 소요 영업일]`);
  typeOrderAll.forEach(wt=>{
    const ts = byTypeAll[wt];
    const totalQty = ts.reduce((sum,t)=> sum+qtyOf(t), 0);
    const expAvg = totalQty ? ts.reduce((sum,t)=> sum+expectedWorkDays(t), 0) / totalQty : 0;
    // 실제 소요 평균은 완료(actualEndDate 설정)된 티켓만 집계
    const doneTs = ts.filter(t=> t.actualEndDate);
    const doneQty = doneTs.reduce((sum,t)=> sum+qtyOf(t), 0);
    const actAvg = doneQty ? doneTs.reduce((sum,t)=> sum+actualBusinessDays(t), 0) / doneQty : null;
    const actStr = actAvg===null ? '-' : fmtDays(actAvg);
    lines.push(`  - ${wt}: 예상 평균 ${fmtDays(expAvg)}영업일 / 실제 평균 ${actStr}영업일 (총 ${totalQty}건${doneQty?`, 완료 ${doneQty}건`:''})`);
  });

  return lines.join('\n');
}
function qtyBadge(t){
  const q = t.qty || 1;
  return q > 1 ? ` <span class="qty-badge">X${q}</span>` : '';
}
// 영업일 표시는 소수점 첫째 자리까지만 (정수면 소수점 없이 표시)
function fmtDays(n){
  if(n===null || n===undefined || isNaN(n)) return '-';
  const rounded = Math.round(n*10)/10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }

const STATUS_LIST = ['예정','작업중','완료','보류'];
const STATUS_COLORS = { '예정':'#6B7280', '작업중':'#0F6E63', '완료':'#9AA1AC', '보류':'#B8790F' };
const STATUS_CHIP_CLASS = { '예정':'status-upcoming', '작업중':'status-progress', '완료':'status-done', '보류':'status-hold' };

function ticketStatus(t){
  if(t.status) return t.status;
  // 하위 호환: 상태값이 없는 과거 티켓은 날짜 기준으로 추정
  const today = todayISO();
  if(today < t.startDate) return '예정';
  if(today > t.endDate) return '완료';
  return '작업중';
}
/* 시작일이 지난 '예정' 티켓은 '작업중', 마감일이 지난 부재는 '완료'로 자동 전환한다.
   ★ 이것은 날짜만 보면 누구나 똑같이 계산할 수 있는 '표시용' 전환이므로
      - 티켓의 수정 시각(updatedAt)을 건드리지 않고
      - 서버에도 쓰지 않는다 (SYNCED 해시만 맞춰 '변경 없음'으로 취급)
      → 그래서 새로고침만 해도 "방금 저장함"으로 표시되거나 서버 쓰기가 발생하지 않는다.
      사람이 그 티켓을 실제로 저장하는 순간 전환된 상태가 함께 서버에 올라간다. */
function autoAdvanceStatuses(){
  const today = todayISO();
  const touched = [];
  TICKETS.forEach(t=>{
    let changed = false;
    if(t.status === '예정' && t.startDate <= today){ t.status = '작업중'; changed = true; }
    if(t.project === '부재' && t.status !== '완료' && t.endDate < today){ t.status = '완료'; changed = true; }
    if(changed) touched.push(t);
  });
  // 서버에 반영된 티켓이었다면, 자동 전환분은 '변경 없음'으로 간주해 업로드하지 않는다
  touched.forEach(t=>{
    if(SYNCED[t.id]) SYNCED[t.id] = {...SYNCED[t.id], h: ticketHash(t)};
  });
  return false;   // 저장을 유발하지 않는다
}
function statusChipHtml(status){
  return `<span class="status-chip ${STATUS_CHIP_CLASS[status]||'status-upcoming'}">${status}</span>`;
}
function actualBusinessDays(t){
  // 완료 상태의 실제 소요는 '겹치는 일정을 나눠 계산한 영업일'로 산출한다.
  // 완료일(actualEndDate)이 없어도 완료 상태이면 마감일을 완료일로 사용해 계산한다.
  // 단, 마감일보다 늦게 저장된 actualEndDate도 마감일로 클램프한다 (실제 소요일이 마감일을 초과해 늘어나면 안 됨).
  if(!t.startDate || !t.endDate) return null;
  const stored = t.actualEndDate || (ticketStatus(t)==='완료' ? t.endDate : null);
  if(!stored) return null;
  const end = stored < t.endDate ? stored : t.endDate;
  return countWorkingDaysForTicket(t.startDate, end, t);
}
// 모달·검색에서 동일한 값을 보장하도록 draft 버전 헬퍼
function actualBusinessDaysForDraft(draft){
  if(!draft.startDate || !draft.endDate) return null;
  const stored = draft.actualEndDate || (ticketStatus(draft)==='완료' ? draft.endDate : null);
  if(!stored) return null;
  const end = stored < draft.endDate ? stored : draft.endDate;
  return countWorkingDaysForTicket(draft.startDate, end, draft);
}
function expectedWorkDays(t){
  // 예상 작업일수는 '주말을 뺀 월~금 순수 작업일'을 기본으로 계산한다 (겹침/부재 보정 없음).
  // '토요일/일요일 근무' 체크가 있면 해당 주말이 실제 기간에 있을 때 +1일 반영한다.
  // 리소스 마감일이 있으면, 리소스가 준비된 다음 영업일부터 실제 제작이 시작되는 것으로 계산
  let rangeStart = t.resourceDeadline ? nextBusinessDay(t.resourceDeadline) : t.startDate;
  // 리소스 마감일 다음 영업일이 마감일보다 늦으면(0일 방지) 시작일부터 계산
  if(rangeStart > t.endDate) rangeStart = t.startDate;
  let days = businessDaysBetween(rangeStart, t.endDate);
  if((t.weekendSat || t.weekendWork) && rangeIncludesWeekday(rangeStart, t.endDate, 6)) days += 1;
  if((t.weekendSun || t.weekendWork) && rangeIncludesWeekday(rangeStart, t.endDate, 0)) days += 1;
  return days;
}
function isDrivePathLike(val){
  // http(s) 링크가 아니면서 백슬래시가 포함된 경우 사내 드라이브/네트워크 경로로 간주
  return !/^https?:\/\//i.test(val) && /\\/.test(val);
}
function renderResourceField(val, label){
  label = label || '리소스';
  if(Array.isArray(val)){
    const vals = val.filter(Boolean);
    if(!vals.length) return '-';
    return vals.map((v,i)=> renderResourceField(v, vals.length>1 ? `${label}${i+1}` : label)).join('<br>');
  }
  if(!val) return '-';
  const trimmed = val.trim();
  if(/^https?:\/\//i.test(trimmed)){
    return `<a href="${escapeHtml(trimmed)}" target="_blank" rel="noopener" style="color:var(--accent-dark); font-weight:700; text-decoration:none;">🔗 ${escapeHtml(label)}</a>`;
  }
  if(isDrivePathLike(trimmed)){
    return `<button type="button" class="copy-drive-btn" data-copy="${escapeHtml(trimmed)}" title="${escapeHtml(trimmed)}">📁 드라이브 주소 복사</button>`;
  }
  return escapeHtml(trimmed);
}
function renderResourceCell(t){
  const link = renderResourceField((t.resourceLinks&&t.resourceLinks.length)?t.resourceLinks:t.memo);
  const deadlineHtml = t.resourceDeadline
    ? `<div style="font-size:10.5px; color:var(--text-faint); margin-top:2px; white-space:nowrap;">마감 ~${fmtShort(t.resourceDeadline)}</div>`
    : '';
  return `${link}${deadlineHtml}`;
}

/* ============================= CSV 내보내기 ============================= */
function csvEscape(val){
  const s = String(val ?? '');
  if(/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function downloadCSV(filename, headers, rows){
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(r=> lines.push(r.map(csvEscape).join(',')));
  // 엑셀에서 한글이 깨지지 않도록 BOM 추가
  const csvContent = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}
function plainField(val){
  if(Array.isArray(val)) return val.filter(Boolean).join(' | ');
  return val || '';
}
const CSV_HEADERS = ['제목','프로젝트','업무 유형','담당자','시작일','마감일','예상 작업일수','실 작업일수','상태','리소스','레퍼런스','SB·기획','사이즈·포맷'];
function ticketToCSVRow(t){
  const status = ticketStatus(t);
  const days = expectedWorkDays(t);
  const actual = actualBusinessDays(t);
  return [
    t.title || '',
    t.project || '',
    t.workType || '',
    (t.assignees||[]).join(', '),
    t.startDate || '',
    t.endDate || '',
    fmtDays(days),
    (actual===null?'':fmtDays(actual)+'일'),
    status || '',
    plainField((t.resourceLinks&&t.resourceLinks.length)?t.resourceLinks:t.memo),
    plainField((t.referenceLinks&&t.referenceLinks.length)?t.referenceLinks:t.referenceLink),
    t.sb || '',
    t.spec || ''

/* ============================= 저장소 (v2) ============================= */
/* 변경분 계산: 로컬 TICKETS 와 "서버에 반영된 상태(SYNCED)" 를 비교 */
function baseRevOf(id){
  if(SYNCED[id] && typeof SYNCED[id].rev === 'number') return SYNCED[id].rev;
  if(SRV_META[id] && typeof SRV_META[id].rev === 'number') return SRV_META[id].rev;
  return 0;
}
function collectChanges(){
  const changes = [];
  TICKETS.forEach(t=>{
    const h = ticketHash(t);
    const s = SYNCED[t.id];
    if(!s || s.h !== h) changes.push({id:t.id, deleted:false, ticket:t, baseRev:baseRevOf(t.id)});
  });
  Object.keys(PENDING_DELETES).forEach(id=>{
    const pd = PENDING_DELETES[id];
    const u = (pd && typeof pd === 'object') ? pd.u : pd;
    const rev = (pd && typeof pd === 'object' && typeof pd.rev === 'number') ? pd.rev : baseRevOf(id);
    changes.push({id, deleted:true, updatedAt:u, baseRev:rev});
  });
  return changes;
}
function recomputePending(){
  SAVE.pending = collectChanges().length;
  return SAVE.pending;
}
/* 내용이 바뀐 티켓인데 updatedAt 이 그대로면 최신 시각으로 도장을 찍어준다
   (충돌 판정 기준이 updatedAt 이므로 반드시 필요) */
function stampDirtyUpdatedAt(){
  const now = new Date().toISOString();
  TICKETS.forEach(t=>{
    const s = SYNCED[t.id];
    if(!s) return;                       // 신규 티켓은 이미 updatedAt 있음
    if(s.h === ticketHash(t)) return;     // 변경 없음
    if((t.updatedAt || '') <= (s.u || '')) t.updatedAt = now;
  });
}
/* 삭제 감지: 이전엔 있었는데 지금 TICKETS 에 없는 id = 삭제 요청 */
function detectDeletions(prevIds){
  const nowIds = new Set(TICKETS.map(t=>t.id));
  const now = new Date().toISOString();
  prevIds.forEach(id=>{
    if(!nowIds.has(id) && !PENDING_DELETES[id]){
      PENDING_DELETES[id] = {u:now, rev:baseRevOf(id), title:(DELETED_TITLES[id] || '')};
      noteLastEdit(id, '(삭제) ' + (DELETED_TITLES[id] || '제목 없음'), Date.now(), 'me');
    }
  });
}

/* =====================================================================
   충돌 보관함
   내가 저장하려던 수정이, 그 사이 남이 먼저 고쳐서(서버 리비전 불일치) 반영되지
   못했을 때 그 내용을 버리지 않고 여기에 쌓아둔다. 사용자는 우측 상단 저장 상태 →
   "충돌 내역"에서 무엇이 달랐는지 보고, 원하면 내 수정으로 다시 덮어쓸 수 있다.
   ===================================================================== */
const FIELD_LABELS = {
  title:'제목', project:'프로젝트', assignees:'담당자', workType:'업무 유형', status:'상태',
  startDate:'시작일', endDate:'마감일', actualEndDate:'완료일', memo:'리소스 링크',
  resourceLinks:'리소스 링크', sb:'SB·기획', resourceDeadline:'리소스 마감일',
  resourceCheckNeeded:'리소스 확인 필요', spec:'사이즈·포맷', referenceLink:'참고 링크',
  referenceLinks:'참고 링크', weekendSat:'토요일 작업', weekendSun:'일요일 작업', qty:'수량'
};
const DIFF_SKIP = {id:1, createdAt:1, updatedAt:1, weekendWork:1, assignee:1};
function fieldText(v){
  if(v === undefined || v === null || v === '') return '(없음)';
  if(Array.isArray(v)) return v.length ? v.join(', ') : '(없음)';
  if(typeof v === 'boolean') return v ? '예' : '아니오';
  return String(v);
}
function diffTickets(mine, theirs){
  const out = [];
  const keys = new Set([...Object.keys(mine||{}), ...Object.keys(theirs||{})]);
  keys.forEach(k=>{
    if(DIFF_SKIP[k] || HASH_IGNORE[k]) return;
    const a = mine ? mine[k] : undefined;
    const b = theirs ? theirs[k] : undefined;
    if(JSON.stringify(a ?? null) === JSON.stringify(b ?? null)) return;
    out.push({key:k, label:FIELD_LABELS[k] || k, mine:fieldText(a), theirs:fieldText(b)});
  });
  return out;
}
/* 충돌 1건 처리: 내 수정을 보관함에 넣고, 화면/로컬은 서버(확정된) 내용으로 정정 */
function archiveConflict(change, serverData, srvRev, source){
  const mine = change.deleted ? null : cleanTicket(change.ticket);
  const theirs = (serverData && !serverData._deleted) ? normalizeTicket(serverData) : null;
  const entry = {
    cid: uid(),
    id: change.id,
    title: (mine && mine.title) || (theirs && theirs.title) || '(제목 없음)',
    at: Date.now(),
    source: source || '',
    myDelete: !!change.deleted,
    theirDelete: !theirs,
    mine, theirs,
    theirRev: srvRev || 0,
    diff: diffTickets(mine, theirs)
  };
  CONFLICTS.unshift(entry);
  if(CONFLICTS.length > CONFLICT_MAX) CONFLICTS.length = CONFLICT_MAX;

  const i = TICKETS.findIndex(t=>t.id===change.id);
  if(theirs){
    if(i>-1) TICKETS[i] = theirs; else TICKETS.push(theirs);
    SYNCED[change.id] = {h:ticketHash(theirs), u:theirs.updatedAt||'', rev:srvRev||0};
  } else {
    if(i>-1) TICKETS.splice(i,1);
    delete SYNCED[change.id];
  }
  SRV_META[change.id] = {rev:srvRev||0, srvAt:(SRV_META[change.id]||{}).srvAt||null};
  if(change.deleted) delete PENDING_DELETES[change.id];
  return entry;
}
function notifyConflicts(n){
  if(!n) return;
  showToast(`⚠ 다른 사람이 먼저 수정해서 내 수정 ${n}건이 반영되지 않았습니다. 내용은 버리지 않고 보관했습니다 — 상단 저장 상태 → 충돌 내역에서 확인/되살리기 하세요.`, 8000);
  const root = document.getElementById('saveStatus');
  if(root){ root.classList.add('flash'); setTimeout(()=>root.classList.remove('flash'), 2600); }
}
async function reapplyConflict(cid){
  const c = CONFLICTS.find(x=>x.cid===cid);
  if(!c) return;
  if(!confirm(`"${c.title}" 을(를) 내 수정 내용으로 다시 덮어씁니다.\n(지금 서버에 있는 다른 사람의 수정 내용은 이 티켓에서 사라집니다.)\n계속할까요?`)) return;
  if(c.myDelete){
    TICKETS = TICKETS.filter(t=>t.id!==c.id);
  } else {
    const t = {...c.mine, updatedAt:new Date().toISOString()};
    const i = TICKETS.findIndex(x=>x.id===c.id);
    if(i>-1) TICKETS[i] = t; else TICKETS.push(t);
  }
  CONFLICTS = CONFLICTS.filter(x=>x.cid!==cid);
  const ok = await persistTickets(true);
  renderApp();
  if(document.getElementById('conflictOverlay')) openConflictModal();
  showToast(ok ? '내 수정 내용으로 다시 저장했습니다.' : '로컬에 보관했고 서버 저장은 재시도 중입니다.');
}
function dropConflict(cid){
  CONFLICTS = CONFLICTS.filter(x=>x.cid!==cid);
  saveLocalCache();
  updateSaveStatusUI();
  if(document.getElementById('conflictOverlay')) openConflictModal();
}
function openConflictModal(){
