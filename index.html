    } else if(!c.diff.length){
      bodyHtml = `<div class="cf-note">내용 차이는 없었습니다(같은 값으로 저장 시도). 그냥 버려도 됩니다.</div>`;
    } else {
      bodyHtml = `<table class="cf-table">
        <tr><th>항목</th><th>내 수정 (반영 안 됨)</th><th>현재 서버 (다른 사람)</th></tr>
        ${c.diff.map(d=>`<tr><th>${escapeHtml(d.label)}</th><td class="cf-mine">${escapeHtml(d.mine)}</td><td class="cf-theirs">${escapeHtml(d.theirs)}</td></tr>`).join('')}
      </table>`;
    }
    return `
      <div class="cf-item">
        <div class="cf-head">
          <div class="cf-title">${escapeHtml(c.title)}</div>
          <div class="cf-when">${escapeHtml(when)}${c.source?' · '+escapeHtml(c.source):''}</div>
        </div>
        ${bodyHtml}
        <div class="cf-actions">
          ${c.theirDelete && !c.mine ? '' : `<button type="button" class="btn btn-primary cf-btn" data-reapply="${c.cid}">내 수정으로 다시 덮어쓰기</button>`}
          <button type="button" class="btn btn-ghost cf-btn" data-drop="${c.cid}">버리기</button>
        </div>
      </div>`;
  }).join('');
  overlay.innerHTML = `
    <div class="modal" style="max-width:720px;">
      <div class="modal-head"><h3>충돌 내역 (${CONFLICTS.length}건)</h3><button type="button" class="modal-close" id="cfClose">✕</button></div>
      <div class="modal-body">
        <p style="margin:0 0 12px; font-size:12.5px; line-height:1.6; color:var(--text-dim);">
          내가 저장하려던 순간에 다른 사람이 같은 티켓을 먼저 고쳐서, 아래 수정들은 서버에 반영되지 않았습니다.
          데이터를 잃지 않도록 내용을 그대로 보관해 두었습니다. 확인 후 <b>다시 덮어쓰기</b> 또는 <b>버리기</b>를 선택해주세요.
        </p>
        ${CONFLICTS.length ? items : '<div class="empty-note">보관된 충돌 내역이 없습니다.</div>'}
      </div>
      <div class="modal-foot">
        <div>${CONFLICTS.length ? '<button type="button" class="btn btn-ghost" id="cfDropAll">전체 버리기</button>' : ''}</div>
        <div><button type="button" class="btn btn-primary" id="cfOk">닫기</button></div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=>overlay.remove();
  overlay.querySelector('#cfClose').onclick = close;
  overlay.querySelector('#cfOk').onclick = close;
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) close(); });
  const dropAll = overlay.querySelector('#cfDropAll');
  if(dropAll) dropAll.onclick = ()=>{
    if(!confirm('보관된 충돌 내역을 모두 버릴까요? 되돌릴 수 없습니다.')) return;
    CONFLICTS = [];
    saveLocalCache();
    updateSaveStatusUI();
    close();
  };
  overlay.querySelectorAll('[data-reapply]').forEach(b=> b.onclick = ()=>reapplyConflict(b.dataset.reapply));
  overlay.querySelectorAll('[data-drop]').forEach(b=> b.onclick = ()=>dropConflict(b.dataset.drop));
}
let KNOWN_IDS = new Set();
let DELETED_TITLES = Object.create(null);   // 삭제 감지 시 제목을 알려주기 위한 보조 테이블
function refreshKnownIds(){
  KNOWN_IDS = new Set(TICKETS.map(t=>t.id));
  DELETED_TITLES = Object.create(null);
  TICKETS.forEach(t=>{ DELETED_TITLES[t.id] = t.title || ''; });
}

/* ---------- 서버에서 전체 읽어와 로컬과 병합 ---------- */
async function loadFromServer(){
  const res = await Backend.readAll();
  if(!res.ok){
    SAVE.lastError = res.error || '읽기 실패';
    return {ok:false, error:SAVE.lastError};
  }
  SAVE.lastServerReadAt = Date.now();
  const serverTickets = res.tickets || [];
  const tombs = res.tombstones || Object.create(null);
  const metas = res.metas || Object.create(null);
  // ★ 비교 기준(= 내가 마지막으로 본 서버 리비전)을 먼저 확보한다.
  //   SRV_META 를 먼저 갱신해버리면 기준이 현재 서버값과 같아져 충돌을 못 잡는다.
  const prevMeta = SRV_META;
  const prevBaseOf = id =>
    (SYNCED[id] && typeof SYNCED[id].rev === 'number') ? SYNCED[id].rev
    : ((prevMeta[id] && typeof prevMeta[id].rev === 'number') ? prevMeta[id].rev : 0);

  const localMap = new Map(TICKETS.map(t=>[t.id, t]));
  const merged = [];
  const seen = new Set();
  const pendingConflicts = [];
  const hadLocalData = localMap.size > 0;      // 첫 로딩(전부 '새 티켓')은 수정으로 보지 않는다
  let serverChange = null;
  const noteServerChange = (id, title, at)=>{
    const ms = at || Date.now();
    if(!serverChange || ms >= serverChange.at) serverChange = {id, title: title || '(제목 없음)', at: ms};
  };

  serverTickets.forEach(srv=>{
    seen.add(srv.id);
    const srvRev = (metas[srv.id] && metas[srv.id].rev) || 0;
    if(PENDING_DELETES[srv.id]){
      const pd = PENDING_DELETES[srv.id];
      const baseRev = (pd && typeof pd === 'object' && typeof pd.rev === 'number') ? pd.rev : prevBaseOf(srv.id);
      if(srvRev !== baseRev){
        // 내가 삭제를 요청한 사이 남이 이 티켓을 고쳤다 → 삭제를 보류하고 보관함에 남긴다
        pendingConflicts.push({change:{id:srv.id, deleted:true}, server:srv, rev:srvRev});
        merged.push(srv);
      }
      return;
    }
    const loc = localMap.get(srv.id);
    if(!loc){
      merged.push(srv);
      SYNCED[srv.id] = {h:ticketHash(srv), u:srv.updatedAt||'', rev:srvRev};
      // 내가 모르던 티켓이 새로 생겼다 = 다른 사람이 만든 것
      if(hadLocalData) noteServerChange(srv.id, srv.title, (metas[srv.id]||{}).srvAt);
      return;
    }
    const dirty = !SYNCED[srv.id] || SYNCED[srv.id].h !== ticketHash(loc);
    if(!dirty){
      // 내용이 실제로 달라졌을 때만 '다른 사람이 수정함'으로 본다
      if(ticketHash(loc) !== ticketHash(srv)) noteServerChange(srv.id, srv.title, (metas[srv.id]||{}).srvAt);
      merged.push(srv);
      SYNCED[srv.id] = {h:ticketHash(srv), u:srv.updatedAt||'', rev:srvRev};
      return;
    }
    // 로컬에 아직 못 올린 수정이 있다 → 내가 본 리비전과 서버 리비전을 비교
    const baseRev = prevBaseOf(srv.id);
    if(srvRev !== baseRev){
      // 그 사이 남이 고쳤다 → 확정된 서버 내용을 채택하고 내 수정은 보관함으로
      pendingConflicts.push({change:{id:srv.id, deleted:false, ticket:loc}, server:srv, rev:srvRev});
      merged.push(srv);
      SYNCED[srv.id] = {h:ticketHash(srv), u:srv.updatedAt||'', rev:srvRev};
    } else {
      merged.push(loc);   // 아무도 안 고쳤다 → 내 수정 유지 (곧 업로드)
    }
  });

  localMap.forEach((loc, id)=>{
    if(seen.has(id)) return;
    if(PENDING_DELETES[id]) return;
    if(tombs[id]){
      // 서버에서 삭제된 티켓
      if(hadLocalData) noteServerChange(id, '(삭제) ' + (loc.title || '제목 없음'), (SRV_META[id]||{}).srvAt);
      const tombRev = (typeof tombs[id] === 'object' ? (tombs[id].rev||0) : 0);
      const dirty = !SYNCED[id] || SYNCED[id].h !== ticketHash(loc);
      if(dirty){
        // 내 미저장 수정이 있었다면 버리지 않고 보관함에 남긴다
        pendingConflicts.push({change:{id, deleted:false, ticket:loc}, server:null, rev:tombRev});
      }
      delete SYNCED[id];
      return;
    }
    // 서버에 없는 티켓: 아직 못 올렸거나, 구버전이 통짜 문서만 쓰던 흔적.
    // 데이터를 잃는 것보다 다시 올리는 편이 안전하므로 미저장(pending)으로 되살린다.
    delete SYNCED[id];
    merged.push(loc);
  });

  TICKETS = merged;
  Object.keys(metas).forEach(id=>{ SRV_META[id] = metas[id]; });   // 비교가 끝난 뒤 갱신
  if(res.migrateFromLegacy){
    // 구버전 통짜 문서 → 티켓별 문서로 1회 이관: 전부 미저장 상태로 만들어 업로드시킨다
    SYNCED = Object.create(null);
    SRV_META = Object.create(null);
  }
  pendingConflicts.forEach(c=> archiveConflict(c.change, c.server, c.rev, '서버 동기화 중'));
  refreshKnownIds();
  // 이번 읽기에서 '실제로 내용이 달라진 티켓'만 마지막 수정으로 기록한다.
  // (전체에서 최댓값을 다시 고르면, 같은 시각에 저장된 티켓들 사이에서 표시가 계속 바뀐다)
  if(serverChange && (!LAST_EDIT || serverChange.at >= LAST_EDIT.at)){
    LAST_EDIT = {id:serverChange.id, title:serverChange.title, at:serverChange.at, by:'other'};
  }
  saveLocalCache();
  recomputePending();
  if(pendingConflicts.length) notifyConflicts(pendingConflicts.length);
  return {ok:true, conflicts:pendingConflicts.length, migrated: !!res.migrateFromLegacy};
}
async function loadTickets(){ return loadFromServer(); }

/* ---------- 저장(플러시) ---------- */
let flushChain = Promise.resolve(true);
let retryTimer = null;
let retryStep = 0;
let lastBackupAt = 0;

function scheduleRetry(){
  if(retryTimer) return;
  const delays = [3000, 6000, 12000, 25000, 45000, 60000];
  const wait = delays[Math.min(retryStep, delays.length-1)];
  retryStep++;
  retryTimer = setTimeout(()=>{ retryTimer = null; flushNow(); }, wait);
}
function clearRetry(){
  if(retryTimer){ clearTimeout(retryTimer); retryTimer = null; }
  retryStep = 0;
}
function flushNow(){
  flushChain = flushChain.then(()=>doFlush(), ()=>doFlush());
  return flushChain;
}
async function doFlush(){
  recomputePending();
  if(SAVE.pending === 0){
    if(SAVE.state !== 'readfail'){ setSaveState(Backend.kind === 'local' ? 'localonly' : 'saved'); }
    clearRetry();
    return true;
  }
  if(!Backend.ready){
    setSaveState('offline');
    scheduleRetry();
    return false;
  }
  if(Backend.kind === 'local'){
    // 서버가 없는 환경 - 로컬 기록만으로 "저장 완료"로 취급하되 계속 경고를 띄운다
    const changes = collectChanges();
    const ok = saveLocalCache();
    if(ok){
      changes.forEach(ch=>{
        if(ch.deleted){ delete PENDING_DELETES[ch.id]; delete SYNCED[ch.id]; }
        else SYNCED[ch.id] = {h:ticketHash(ch.ticket), u:ch.ticket.updatedAt||'', rev:0};
      });
      saveLocalCache();
      recomputePending();
      setSaveState('localonly');
      return false; // 서버 저장은 아니므로 '완전 성공'으로 보고하지 않는다
    }
    setSaveState('offline');
    return false;
  }

  setSaveState('saving');
  const changes = collectChanges();
  const res = await Backend.writeChanges(changes);

  (res.done || []).forEach(ch=>{
    if(ch.deleted){
      delete PENDING_DELETES[ch.id];
      delete SYNCED[ch.id];
      SRV_META[ch.id] = {rev:ch.rev||0, srvAt:Date.now()};
    } else {
      SYNCED[ch.id] = {h:ticketHash(ch.ticket), u:ch.ticket.updatedAt||'', rev:ch.rev||0};
      SRV_META[ch.id] = {rev:ch.rev||0, srvAt:Date.now()};
    }
  });
  // 저장 직전 남이 먼저 고쳐서 반영하지 못한 건들 → 내 수정을 보관함에 넣고 서버 내용 채택
  const conflicted = (res.conflicts || []).length;
  (res.conflicts || []).forEach(c=> archiveConflict(c.change, c.server, c.rev, '저장 시도 중'));
  saveLocalCache();
  recomputePending();

  if(res.ok && SAVE.pending === 0){
    SAVE.lastServerSaveAt = Date.now();
    SAVE.lastError = '';
    clearRetry();
    setSaveState('saved');
    if(conflicted){
      notifyConflicts(conflicted);
      scheduleRemoteRender();
    }
    // 안전용 전체 스냅샷 백업(최대 1분에 1번)
    if(Date.now() - lastBackupAt > 60000){
      lastBackupAt = Date.now();
      Backend.writeBackup(TICKETS);
    }
    return true;
  }
  if(res.ok){
    // 일부만 처리됨 → 남은 건 재시도
    SAVE.lastServerSaveAt = Date.now();
    if(conflicted){ notifyConflicts(conflicted); scheduleRemoteRender(); }
    setSaveState('pending');
    scheduleRetry();
    return false;
  }
  SAVE.lastError = res.error || '저장 실패';
  setSaveState('pending');
  scheduleRetry();
  return false;
}

/* 기존 코드 호환용 진입점.
   반환값 true = 서버까지 확실히 저장됨 / false = 로컬에는 보관됐지만 서버 미반영(자동 재시도) */
async function persistTickets(immediate){
  detectDeletions(KNOWN_IDS);
  stampDirtyUpdatedAt();
  // 실제로 내용이 바뀐 티켓이 있을 때만 '마지막 수정'으로 기록한다
  {
    let newest = null;
    TICKETS.forEach(t=>{
      const sy = SYNCED[t.id];
      if(sy && sy.h === ticketHash(t)) return;          // 변경 없음
      const ms = t.updatedAt ? new Date(t.updatedAt).getTime() : Date.now();
      if(!newest || ms >= newest.ms) newest = {ms, t};
    });
    if(newest) noteLastEdit(newest.t.id, newest.t.title, Date.now(), 'me');
  }
  saveLocalCache();          // ★ 무엇보다 먼저 로컬에 기록 → 새로고침해도 변경분이 사라지지 않음
  refreshKnownIds();
  recomputePending();
  updateSaveStatusUI();
  return await flushNow();
}

/* ---------- 실시간 반영 ---------- */
let remoteRenderTimer = null;
function scheduleRemoteRender(){
  if(remoteRenderTimer) clearTimeout(remoteRenderTimer);
  remoteRenderTimer = setTimeout(()=>{
    remoteRenderTimer = null;
    if(document.querySelector('.overlay.open')){ scheduleRemoteRender(); return; } // 모달 열려있으면 나중에
    try{ renderApp(); }catch(e){}
  }, 1500);
}
function applyRemoteChange(c){
  let changed = false;
  let conflicts = 0;
  const rev = c.rev || 0;
  const prevBase = baseRevOf(c.id);                 // 갱신 전에 기준을 먼저 확보
  SRV_META[c.id] = {rev, srvAt: c.srvAt || Date.now()};
  if(c.removed){
    const i = TICKETS.findIndex(t=>t.id===c.id);
    const loc = i>-1 ? TICKETS[i] : null;
    const dirty = loc && (!SYNCED[c.id] || SYNCED[c.id].h !== ticketHash(loc));
    if(dirty){
      // 내가 수정 중이던 티켓을 남이 삭제 → 삭제가 확정이지만 내 수정 내용은 보관
      archiveConflict({id:c.id, deleted:false, ticket:loc}, null, rev, '실시간 수신');
      conflicts++;
      changed = true;
    } else if(loc){
      noteLastEdit(c.id, '(삭제) ' + (loc.title || '제목 없음'), c.srvAt || Date.now(), 'other');
      TICKETS.splice(i,1);
      changed = true;
    }
    if(PENDING_DELETES[c.id]) delete PENDING_DELETES[c.id];
    delete SYNCED[c.id];
  } else {
    const srv = c.ticket;
    const i = TICKETS.findIndex(t=>t.id===srv.id);
    const loc = i>-1 ? TICKETS[i] : null;
    const dirty = loc && (!SYNCED[srv.id] || SYNCED[srv.id].h !== ticketHash(loc));
    if(dirty){
      if(rev === prevBase) return;   // 남이 고친 게 아님(내 쓰기의 반향 등) → 내 수정 유지
      if(ticketHash(loc) === ticketHash(srv)){
        SYNCED[srv.id] = {h:ticketHash(srv), u:srv.updatedAt||'', rev};
        return;                     // 결과가 같으면 충돌 아님
      }
      archiveConflict({id:srv.id, deleted:false, ticket:loc}, srv, rev, '실시간 수신');
      conflicts++;
      changed = true;
    } else {
      if(loc && ticketHash(loc) === ticketHash(srv)){
        SYNCED[srv.id] = {h:ticketHash(srv), u:srv.updatedAt||'', rev};
        return;
      }
      if(loc) TICKETS[i] = srv; else TICKETS.push(srv);
      SYNCED[srv.id] = {h:ticketHash(srv), u:srv.updatedAt||'', rev};
      noteLastEdit(srv.id, srv.title, c.srvAt || Date.now(), 'other');
      changed = true;
    }
  }
  if(changed){
    refreshKnownIds();
    saveLocalCache();
    recomputePending();
    updateSaveStatusUI();
    scheduleRemoteRender();
  }
  if(conflicts) notifyConflicts(conflicts);
}
function startRealtime(){
  if(Backend.realtime){
    Backend.subscribe(applyRemoteChange, err=>{
      SAVE.lastError = errMsg(err);
      updateSaveStatusUI();
    });
  } else if(Backend.kind !== 'local'){
    // 실시간이 없는 백엔드는 주기적으로 다시 읽어온다
    setInterval(async ()=>{
      if(document.hidden || SAVE.pending > 0) return;
      const r = await loadFromServer();
      if(r.ok){ updateSaveStatusUI(); scheduleRemoteRender(); }
    }, 20000);
  }
}

/* ---------- 저장 상태 표시 (화면 우측 상단 고정) ---------- */
const SAVE_STATE_UI = {
  init:      {cls:'is-sync',    icon:'⏳', label:'연결 확인 중…'},
  syncing:   {cls:'is-sync',    icon:'⏳', label:'서버와 동기화 중…'},
  saving:    {cls:'is-sync',    icon:'⏳', label:'저장 중…'},
  saved:     {cls:'is-ok',      icon:'✅', label:'저장 완료'},
  pending:   {cls:'is-warn',    icon:'⚠️', label:'서버 저장 실패 – 재시도 중'},
  offline:   {cls:'is-warn',    icon:'📴', label:'서버 연결 끊김 – 로컬 보관'},
  localonly: {cls:'is-warn',    icon:'💾', label:'이 기기에만 저장됨'},
  readfail:  {cls:'is-err',     icon:'⛔', label:'서버에서 불러오기 실패'}
};
function setSaveState(s){
  SAVE.state = s;
  updateSaveStatusUI();
}
function fmtClock(ms){
  if(!ms) return '--:--:--';
  const d = new Date(ms);
  const p = n=>String(n).padStart(2,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function dayDiff(ms){
  const a = new Date(ms); a.setHours(0,0,0,0);
  const b = new Date();   b.setHours(0,0,0,0);
  return Math.round((b - a)/86400000);
}
function fmtAgo(ms){
  if(!ms) return '기록 없음';
  const sec = Math.floor((Date.now() - ms)/1000);
  if(sec < 0) return '방금 전';
  if(sec < 15) return '방금 전';
  if(sec < 60) return `${sec}초 전`;
  if(sec < 3600) return `${Math.floor(sec/60)}분 전`;
  const d = dayDiff(ms);
  if(d === 0) return `${Math.floor(sec/3600)}시간 전`;
  if(d === 1) return '어제';
  if(d === 2) return '그제';
  if(d < 8) return `${d}일 전`;
  const dt = new Date(ms);
  return `${dt.getMonth()+1}월 ${dt.getDate()}일`;
}
function fmtWhen(ms){
  if(!ms) return '--:--';
  const d = new Date(ms), p = n=>String(n).padStart(2,'0');
  const dd = dayDiff(ms);
  if(dd === 0) return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  if(dd === 1) return `어제 ${p(d.getHours())}:${p(d.getMinutes())}`;
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtAgoFull(ms){
  if(!ms) return '기록 없음';
  const dt = new Date(ms);
  const p = n=>String(n).padStart(2,'0');
  const d = dayDiff(ms);
  const day = d === 0 ? '오늘' : (d === 1 ? '어제' : `${dt.getMonth()+1}/${dt.getDate()}`);
  return `${fmtAgo(ms)} · ${day} ${p(dt.getHours())}:${p(dt.getMinutes())}:${p(dt.getSeconds())}`;
}
function backendLabel(){

  if(SAVE.backendKind === 'artifact')  return 'Claude 아티팩트 저장소 · 공유';
  return '이 브라우저(localStorage) 전용 · 공유 안 됨';

/* ★ "마지막으로 티켓을 수정한 시점"
   - 서버에 반영된 티켓은 서버가 기록한 시각(_srvAt)을 사용 → PC 시계가 틀어져도 정확
   - 아직 서버에 못 올린 티켓은 로컬 수정 시각(updatedAt)을 사용
   - 삭제된 티켓(툼스톤)도 '수정'으로 본다
   서버 응답 확인/백업 같은 동작은 여기 포함되지 않으므로, 이 값이 올라갔다면
   실제로 누군가 티켓을 고친 것이고 그게 저장까지 됐는지 상태와 함께 확인할 수 있다. */
/* '진짜 수정'이 일어난 순간에만 호출해서 마지막 1건을 기록한다.
   (자동 상태 전환·서버 읽기·백업 같은 동작은 여기 기록되지 않는다) */
function noteLastEdit(id, title, at, by){
  const who = by || 'me';
  const ms = at || Date.now();
  // 내가 방금 한 동작은 항상 최신으로 기록한다.
  // (서버 시계가 조금 앞서 있어서 남의 기록 시각이 미래로 찍혀 있어도 내 수정이 밀리지 않도록)
  if(who !== 'me' && LAST_EDIT && LAST_EDIT.at > ms) return;
  LAST_EDIT = {id, title: title || '(제목 없음)', at: ms, by: who};
}
/* 기록이 아예 없을 때(설치 직후 등)만 쓰는 추정치.
   시드/마이그레이션처럼 여러 티켓이 같은 밀리초에 저장되면 '가장 최근'이 동률이 되는데,
   그때 배열 순서로 승자가 갈리면 표시가 계속 바뀐다. 그래서 동률은 id 순으로 못박아
   항상 같은 티켓이 나오게 한다. */
function computeLastEditFallback(){
  let at = null, id = null;
  TICKETS.forEach(t=>{
    const sy = SYNCED[t.id];
    const clean = sy && sy.h === ticketHash(t);
    const meta = SRV_META[t.id];
    const ms = (clean && meta && meta.srvAt) ? meta.srvAt : (t.updatedAt ? new Date(t.updatedAt).getTime() : null);
    if(!ms) return;
    if(at === null || ms > at || (ms === at && String(t.id) > String(id))){ at = ms; id = t.id; }
  });
  Object.keys(PENDING_DELETES).forEach(pid=>{
    const pd = PENDING_DELETES[pid];
    const u = (pd && typeof pd === 'object') ? pd.u : pd;
    const ms = u ? new Date(u).getTime() : null;
    if(ms && (at === null || ms > at)){ at = ms; id = pid; }
  });
  if(at === null) return null;
  const t = TICKETS.find(x=>x.id===id);
  const pd = PENDING_DELETES[id];
  return {
    id, at, by: '',
    title: t ? (t.title || '(제목 없음)')
             : ('(삭제) ' + (((pd && pd.title) || '') || '제목 없음'))
  };
}
/* ★ 한 번 정해진 '마지막 수정 티켓'은 실제로 수정이 일어나기 전까지 바뀌지 않는다.
   (내 저장 / 다른 사람 저장 수신 / 삭제 — 이 세 가지 경우에만 갱신된다) */
function lastTicketEdit(){
  if(!LAST_EDIT){
    const f = computeLastEditFallback();
    if(!f) return {id:null, at:null, title:'', pendingEdit:false, by:''};
    LAST_EDIT = f;
  }
  const t = TICKETS.find(x=>x.id===LAST_EDIT.id);
  const pendingEdit = t
    ? !(SYNCED[t.id] && SYNCED[t.id].h === ticketHash(t))
    : !!PENDING_DELETES[LAST_EDIT.id];
  return {
    id: LAST_EDIT.id,
    at: LAST_EDIT.at,
    title: t ? (t.title || '(제목 없음)') : LAST_EDIT.title,
    pendingEdit,
    by: LAST_EDIT.by
  };
}

   완료 / 진행중 / 안 됨 으로 한눈에 보여주기 위한 상태 판정 */
const STEP_ICON = {done:'✅', busy:'⏳', fail:'❌', warn:'⚠️', idle:'➖'};
const STEP_WORD = {done:'완료', busy:'진행 중', fail:'안 됨', warn:'확인 필요', idle:'없음'};
function localSaveStep(){
  const edit = lastTicketEdit();
  if(!localStorageOk) return {kind:'fail', label:'브라우저 저장소 사용 불가', detail:'시크릿 모드이거나 저장이 차단된 상태'};
  if(!SAVE.lastLocalSaveAt) return {kind:'idle', detail:'아직 이 기기에 저장한 내용이 없습니다'};
  return {kind:'done',
          detail: edit.at ? `${fmtWhen(edit.at)} 수정분까지 기록` : '기록할 변경 없음',
          note:'수정하면 즉시 이 기기에 먼저 기록'};
}
function cloudSaveStep(){
  if(Backend.kind === 'local'){
    return {kind:'fail', label:'서버 미연결', detail:'서버에 저장되지 않는 상태', note:'다른 사람에게 아직 안 보임'};
  }
  if(SAVE.state === 'saving') return {kind:'busy', detail:'서버로 전송하는 중…'};
  if(SAVE.state === 'init' || SAVE.state === 'syncing') return {kind:'busy', detail:'서버와 데이터 맞추는 중…'};
  if(SAVE.pending > 0){
    return {kind:'fail', detail:`미저장 ${SAVE.pending}건 · 자동 재시도 중`,
            note:`마지막 성공 ${fmtAgo(SAVE.lastServerSaveAt)}`};
  }
  if(SAVE.state === 'offline') return {kind:'fail', label:'연결 끊김', detail:'연결되면 자동으로 올립니다'};
  if(SAVE.state === 'readfail') return {kind:'warn', label:'불러오기 실패', detail:'로컬 사본 표시 중 · 재연결 시도'};
  if(CONFLICTS.length) return {kind:'warn', label:'충돌 확인 필요', detail:`저장은 됐지만 반영 안 된 내 수정 ${CONFLICTS.length}건`};
  const edit = lastTicketEdit();
  return {kind:'done',
          detail: edit.at ? `${fmtWhen(edit.at)} 수정분까지 저장` : '저장할 변경 없음',
          note:'팀원 전원이 같은 데이터를 봄'};
}

function downloadJSONBackup(){
  const payload = {
    exportedAt: new Date().toISOString(),
    count: TICKETS.length,
    tickets: TICKETS.map(cleanTicket)
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `schedule_backup_${csvFilenameTimestamp()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
async function restoreFromBackupFile(file){
  try{
    const text = await file.text();
    const p = JSON.parse(text);
    const arr = Array.isArray(p) ? p : (p.tickets || []);
    if(!Array.isArray(arr) || !arr.length){ showToast('백업 파일에서 티켓을 찾지 못했습니다.'); return; }
    if(!confirm(`백업 파일의 티켓 ${arr.length}건을 현재 데이터에 병합합니다.\n(같은 티켓은 수정 시각이 더 최신인 쪽을 사용합니다. 기존 티켓이 삭제되지는 않습니다.)\n계속할까요?`)) return;
    let add = 0, upd = 0;
    arr.map(normalizeTicket).forEach(b=>{
      const i = TICKETS.findIndex(t=>t.id===b.id);
      if(i<0){ TICKETS.push(b); add++; return; }
      if((b.updatedAt||'') > (TICKETS[i].updatedAt||'')){ TICKETS[i] = b; upd++; }
    });
    refreshKnownIds();
    const ok = await persistTickets(true);
    renderApp();
    showToast(ok ? `복원 완료: 추가 ${add}건, 갱신 ${upd}건` : `복원 내용을 로컬에 보관했습니다(추가 ${add}건). 서버 저장은 재시도 중입니다.`);
  }catch(e){
    showToast('백업 파일을 읽지 못했습니다: ' + errMsg(e));
  }
}

function wireSaveStatus(){

  if(pill) pill.onclick = ()=>toggleSavePanel();
  ['mousedown','touchstart'].forEach(evt=>{

    }, {passive:true});
  });

  window.addEventListener('offline', ()=>{ if(SAVE.pending) setSaveState('offline'); });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && SAVE.pending) flushNow(); });
  setInterval(()=>{ if(SAVE.pending > 0 && !retryTimer) flushNow(); }, 20000);
  window.addEventListener('beforeunload', e=>{
    if(SAVE.pending > 0){
      e.preventDefault();

    }
  });
}

async function copyTextToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ document.execCommand('copy'); ok = true; }catch(e2){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
}

/* ============================= 연속 작업(체인) 계산 ============================= */
function computeChains(){
  const chainOf = {}; // ticketId -> {chainId, index, size}
  WORKERS.forEach(w=>{
    const ts = TICKETS.filter(t=>t.assignees.includes(w)).slice().sort((a,b)=>a.startDate<b.startDate?-1:1);
    let chainId = 0, chainMembers = [];
    function flush(){
      if(chainMembers.length>1){
        chainMembers.forEach((t,i)=>{ chainOf[t.id] = {index:i+1, size:chainMembers.length}; });
      }
      chainMembers = [];
    }
    let prev = null;
    ts.forEach(t=>{
      if(prev && t.startDate === nextBusinessDay(prev.endDate)){
        chainMembers.push(t);
      } else {
        flush();
        chainMembers = [t];
      }
      prev = t;
    });
    flush();
  });
  return chainOf;
}

/* ============================= 레인 배치(겹침 방지) ============================= */
function assignLanes(ticketsForWorker, rangeStartISO, rangeEndISO){
  // range of each ticket (사전 작업 기간 제거됨: 시작일~마감일만 사용)
  const items = ticketsForWorker
    .map(t=>({t, rs:t.startDate, re:t.endDate}))
    .filter(x=> x.re>=rangeStartISO && x.rs<=rangeEndISO)
    .sort((a,b)=> a.rs<b.rs?-1:1);
  const lanes = []; // lane end date
  const result = [];
  items.forEach(item=>{
    let laneIdx = lanes.findIndex(end => end < item.rs);
    if(laneIdx === -1){ laneIdx = lanes.length; lanes.push(item.re); }
    else { lanes[laneIdx] = item.re; }
    result.push({...item, lane:laneIdx});
  });
  const maxLanes = Math.max(1, lanes.length);
  return {items:result, maxLanes};
}

function mobileWorkerFullDayAbsenceOnDate(worker, iso){
  return TICKETS.some(t=> t.project==='부재' && t.assignees.includes(worker) && t.startDate<=iso && t.endDate>=iso && !isHalfDayAbsenceTitle(t.title));
}
// hex 색상을 밝게(+percent) 또는 어둡게(-percent) 조정
function shadeHexColor(hex, percent){
  const num = parseInt(hex.slice(1), 16);
  let r = (num>>16)&0xFF, g=(num>>8)&0xFF, b=num&0xFF;
  if(percent >= 0){
    r = r + (255-r)*percent/100;
    g = g + (255-g)*percent/100;
    b = b + (255-b)*percent/100;
  } else {
    const p = -percent;
    r = r*(1-p/100);
    g = g*(1-p/100);
    b = b*(1-p/100);
  }
  const clamp = v=> Math.max(0, Math.min(255, Math.round(v)));
  return `#${clamp(r).toString(16).padStart(2,'0')}${clamp(g).toString(16).padStart(2,'0')}${clamp(b).toString(16).padStart(2,'0')}`;
}
// 겹치는 티켓 수에 따라 담당자 기본색의 톤을 달리한다 (1개=연한 톤, 2개=기본 톤, 3개 이상=진한 톤)
function mobileOverlapShade(baseColor, count){
  if(count <= 1) return shadeHexColor(baseColor, 45);
  if(count === 2) return baseColor;
  return shadeHexColor(baseColor, -35);
}

function renderMobileMonthGrid(){
  if(!mobileMonthAnchor) mobileMonthAnchor = new Date();
  const year = mobileMonthAnchor.getFullYear(), month = mobileMonthAnchor.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOfGrid = addDays(firstOfMonth, -firstOfMonth.getDay());
  const today = todayISO();

  const weeks = [];
  let cur = startOfGrid;
  for(let w=0; w<6; w++){
    const week = [];
    for(let d=0; d<7; d++){ week.push(cur); cur = addDays(cur, 1); }
    weeks.push(week);
  }

  const weeksHtml = weeks.map(week=>{
    // 날짜별 배경 셀 (탭하면 그 날짜의 일별 일정 팝업이 뜸)
    const bgCells = week.map((d,i)=>{
      const iso = toISO(d);
      const inMonth = d.getMonth()===month;
      const cls = ['mmw-bg'];
      if(!inMonth) cls.push('out-month');
      if(iso===today) cls.push('today');
      return `<div class="${cls.join(' ')}" data-date="${iso}" style="grid-column:${i+1}; grid-row:1 / span 5;"></div>`;
    }).join('');

    const numCells = week.map((d,i)=>{
      const iso = toISO(d);
      return `<div class="mmw-num ${iso===today?'today':''}" style="grid-column:${i+1}; grid-row:1;">${d.getDate()}</div>`;
    }).join('');

    // 전체 휴가(공휴일, 담당자 전원)는 큰 야자수 아이콘 하나로 모든 레인을 덮어 표시
    const holidayCells = week.map((d,i)=>{
      const iso = toISO(d);
      if(!mobileIsCompanyWideHoliday(iso)) return '';
      return `<div class="mmw-holiday" style="grid-column:${i+1}; grid-row:2 / span 4;" title="공휴일">🌴</div>`;
    }).join('');

    // 개인 부재(반차 제외, 공통휴가 제외): 1일이면 🌙 아이콘, 2일 이상 이어지면 검은 바 + '병가' 라벨로 표시
    const personalAbsenceCells = [];
    WORKERS.forEach((w, wi)=>{
      let runStart = null;
      const isPersonalFullDayOff = (i)=>{
        const d = week[i];
        if(!d) return false;
        const iso = toISO(d);
        if(mobileIsCompanyWideHoliday(iso)) return false;
        return mobileWorkerFullDayAbsenceOnDate(w, iso);
      };
      for(let i=0;i<=7;i++){
        const active = i<7 && isPersonalFullDayOff(i);
        if(active){
          if(runStart===null) runStart = i;
        } else if(runStart!==null){
          const len = i - runStart;
          if(len >= 2){
            personalAbsenceCells.push(`<div class="mmw-sick-bar" style="grid-column:${runStart+1} / ${i+1}; grid-row:${2+wi};" title="${escapeHtml(w)} 장기 휴가/병가"><span class="mmw-sick-bar-label">병가</span></div>`);
          } else {
            personalAbsenceCells.push(`<div class="mmw-holiday mmw-holiday-lane" style="grid-column:${runStart+1}; grid-row:${2+wi};" title="${escapeHtml(w)} 휴가">🌙</div>`);
          }
          runStart = null;
        }
      }
    });

    // 담당자별로, 실제 티켓의 시작일·마감일 경계에서 바를 끊는다.
    // 겹치는 티켓 구성(집합)이 전날과 완전히 같을 때만 이어붙이고, 하나라도 시작/종료되면(전일 개인 휴가로 막히는 경우 포함) 새 구간으로 분리한다.
    const bars = [];
    WORKERS.forEach((w, wi)=>{
      let segStart = null, segKey = null, segCount = 0;
      const flush = (endIdx)=>{
        if(segStart===null) return;
        bars.push({wi, start:segStart, end:endIdx-1, count:segCount});
        segStart = null; segKey = null; segCount = 0;
      };
      for(let i=0;i<=7;i++){
        const d = i<7 ? week[i] : null;
        const iso = d ? toISO(d) : null;
        const blocked = d ? (mobileIsCompanyWideHoliday(iso) || mobileWorkerFullDayAbsenceOnDate(w, iso)) : true;
        const ids = (d && !blocked) ? mobileWorkerTicketIdsOnDate(w, iso, d) : [];
        const key = ids.length ? ids.slice().sort().join(',') : null;
        if(key===null){
          flush(i);
        } else if(segKey===null){
          segStart = i; segKey = key; segCount = ids.length;
        } else if(key!==segKey){
          flush(i);
          segStart = i; segKey = key; segCount = ids.length;
        }
        // key===segKey인 경우: 같은 티켓 구성이 계속 이어지는 중이므로 구간을 그대로 유지
      }
    });
    const barsHtml = bars.map(r=>{
      const base = WORKER_COLORS[WORKERS[r.wi]] || '#999';
      const color = mobileOverlapShade(base, r.count);
      return `<div class="mmw-bar" style="grid-column:${r.start+1} / ${r.end+2}; grid-row:${2+r.wi}; background:${color};" title="${r.count}건 겹침"></div>`;
    }).join('');

    return `<div class="mobile-month-week">${bgCells}${barsHtml}${personalAbsenceCells.join('')}${holidayCells}${numCells}</div>`;
  }).join('');

  return `
    <div class="mobile-month-header">
      <button type="button" class="mobile-nav-btn" id="mPrevMonth">‹</button>
      <div class="mobile-date-label">${year}.${String(month+1).padStart(2,'0')}</div>
      <button type="button" class="mobile-nav-btn" id="mNextMonth">›</button>
      <button type="button" class="mobile-today-goto-btn" id="mobileThisMonthBtn">이번달</button>
    </div>
    <div class="mobile-month-legend">
      ${WORKERS.map(w=>`<span class="mobile-month-legend-item">${workerDot(w)}${w}</span>`).join('')}
      <span class="mobile-month-legend-item">🌴 공휴일</span>
      <span class="mobile-month-legend-item">🌙 개인 휴가</span>
      <span class="mobile-month-legend-item"><span style="display:inline-block; width:9px; height:9px; border-radius:2px; background:#5A5F68;"></span> 병가/장기휴가</span>
    </div>
    <div class="mobile-month-dow-row">${DOW_LABEL.map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="mobile-month-weeks">${weeksHtml}</div>
  `;
}

function renderMobileTicketCards(list){
  if(!list.length) return `<div class="empty-note">해당하는 티켓이 없습니다.</div>`;
  return list.map(t=>{
    const status = ticketStatus(t);
    const needsResourceCheck = !!t.resourceCheckNeeded && (status==='작업중' || status==='예정');
    return `<div class="mobile-ticket-card ${needsResourceCheck?'tr-resource-alert-card':''}" data-id="${t.id}">
      <div class="mobile-ticket-card-top">
        ${needsResourceCheck?'<span class="resource-flag-badge">❗ 리소스 확인</span>':''}
        <span class="proj-chip" style="background:${PROJECT_COLORS[t.project]}">${t.project}</span>
        ${statusChipHtml(status)}
      </div>
      <div class="mobile-ticket-card-title">${t.workType?`${WORK_TYPE_ICONS[t.workType]} ${t.workType} · `:''}${escapeHtml(t.title)}${qtyBadge(t)}</div>
      <div class="mobile-ticket-card-meta">${t.assignees.join(', ')} · ${fmtShort(t.startDate)}~${fmtShort(t.endDate)}</div>
    </div>`;
  }).join('');
}

// 진행중인 티켓: 오늘 마감인 티켓은 리소스 확인처럼 눈에 띄게 강조해서 완료 처리를 놓치지 않도록 함
function renderMobileInProgressCards(list){
  const today = todayISO();
  const todayLabel = `${new Date().getMonth()+1}월 ${new Date().getDate()}일 ${DOW_LABEL[new Date().getDay()]}요일`;
  const header = `<p class="mobile-inprogress-today">📅 오늘: ${todayLabel}</p>`;
  if(!list.length) return `${header}<div class="empty-note">현재 진행 중인 티켓이 없습니다.</div>`;
  const cards = list.map(t=>{
    const status = ticketStatus(t);
    const needsResourceCheck = !!t.resourceCheckNeeded && (status==='작업중' || status==='예정');
    const dueToday = t.endDate === today;
    const cls = [needsResourceCheck?'tr-resource-alert-card':'', dueToday?'tr-due-today-card':''].filter(Boolean).join(' ');
    const isAbsence = t.project === '부재';
    const dateMeta = (isAbsence && t.startDate === t.endDate) ? mobileAbsenceDateRangeText(t) : `${fmtShort(t.startDate)}~${fmtShort(t.endDate)}`;
    return `<div class="mobile-ticket-card ${cls}" data-id="${t.id}">
      <div class="mobile-ticket-card-top">
        ${dueToday?'<span class="due-today-badge">⏰ 오늘 마감</span>':''}
        ${needsResourceCheck?'<span class="resource-flag-badge">❗ 리소스 확인</span>':''}
        <span class="proj-chip" style="background:${PROJECT_COLORS[t.project]}">${t.project}</span>
        ${statusChipHtml(status)}
      </div>
      <div class="mobile-ticket-card-title">${t.workType?`${WORK_TYPE_ICONS[t.workType]} ${t.workType} · `:''}${escapeHtml(t.title)}${qtyBadge(t)}</div>
      <div class="mobile-ticket-card-meta">${t.assignees.join(', ')} · ${dateMeta}</div>
    </div>`;
  }).join('');
  return header + cards;
}

// 진행 예정인 티켓: 시작일이 가장 먼저 눈에 띄고, 그다음 담당자가 강조되도록 별도 레이아웃 사용
function renderMobileUpcomingCards(list){
  if(!list.length) return `<div class="empty-note">진행 예정인 티켓이 없습니다.</div>`;
  const today = todayISO();
  return list.map(t=>{
    const dday = Math.max(businessDaysBetween(today, t.startDate) - 1, 0);
    const needsResourceCheck = !!t.resourceCheckNeeded;
    return `<div class="mobile-ticket-card mobile-upcoming-card ${needsResourceCheck?'tr-resource-alert-card':''}" data-id="${t.id}">
      <div class="mobile-upcoming-top">
        <span class="mobile-upcoming-date">${fmtShort(t.startDate)} <span class="mobile-upcoming-dday">D-${dday}</span></span>
        ${needsResourceCheck?'<span class="resource-flag-badge">❗</span>':''}
      </div>
      <div class="mobile-upcoming-workers">${t.assignees.map(a=>workerDot(a)+escapeHtml(a)).join(' ')}</div>
      <div class="mobile-ticket-card-meta">${t.workType?`${WORK_TYPE_ICONS[t.workType]} ${t.workType} · `:''}<span class="proj-chip" style="background:${PROJECT_COLORS[t.project]}">${t.project}</span> ${escapeHtml(t.title)}${qtyBadge(t)}</div>
    </div>`;
  }).join('');
}

function wireMobileTicketCardClicks(scope){
  scope.querySelectorAll('.mobile-ticket-card[data-id], .mobile-ticket-chip[data-id]').forEach(el=>{
    el.onclick = ()=> openModal(el.dataset.id);
  });
}

function getFilteredMobileSearchTickets(){
  const q = mobileSearchText.trim().toLowerCase();
  return TICKETS.filter(t=>{
    if(t.project === '부재') return false;
    if(mobileSearchWorkerFilter && !t.assignees.includes(mobileSearchWorkerFilter)) return false;
    if(mobileSearchStatusFilter && ticketStatus(t) !== mobileSearchStatusFilter) return false;
    if(mobileSearchProjectFilter && t.project !== mobileSearchProjectFilter) return false;
    if(mobileSearchTypeFilter && t.workType !== mobileSearchTypeFilter) return false;
    if(q){
      const hay = [t.title, t.project, ...(t.assignees||[])].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(mobileSearchStartFilter && t.endDate < mobileSearchStartFilter) return false;
    if(mobileSearchEndFilter && t.startDate > mobileSearchEndFilter) return false;
    return true;
  }).sort((a,b)=> a.startDate<b.startDate?-1:1);
}

function renderMobileSearchResultsOnly(){
  const container = document.getElementById('mobileSearchResultsArea');
  if(!container) return;
  const filtered = getFilteredMobileSearchTickets();
  container.innerHTML = `
    <p style="font-size:12px; color:var(--text-dim); margin:0 0 8px;">총 ${filtered.length}건</p>
    ${renderMobileTicketCards(filtered)}
  `;
  wireMobileTicketCardClicks(container);
}

function mobileAbsenceAssigneeLabel(t){
  if(!mobileAbsenceWorkerFilter) return (t.assignees||[]).join(', ');
  if(t.assignees && t.assignees.length === WORKERS.length) return '공통휴가';
  if(t.assignees && t.assignees.length === 1) return '개인휴가';
  return (t.assignees||[]).join(', ');
}

function renderMobileAbsenceView(){
  const today = todayISO();
  const weekEnd = toISO(addDays(new Date(), 7));
  const todaysAbsences = TICKETS.filter(t=> t.project==='부재' && t.startDate<=today && t.endDate>=today)
    .sort((a,b)=> a.startDate<b.startDate?-1:1);
  const upcomingAbsences = TICKETS.filter(t=> t.project==='부재' && t.startDate>today && t.startDate<=weekEnd)
    .sort((a,b)=> a.startDate<b.startDate?-1:1);
  const filtered = TICKETS.filter(t=>{
    if(t.project !== '부재') return false;
    if(mobileAbsenceHideShared && t.assignees && t.assignees.length === WORKERS.length) return false;
    if(mobileAbsenceWorkerFilter && !t.assignees.includes(mobileAbsenceWorkerFilter)) return false;
    return true;
  }).sort((a,b)=> absenceSortComparator(a,b));

  return `
    <div class="card" style="margin-bottom:14px;">
      <p class="absence-alert-heading">📍 오늘 부재</p>
      ${todaysAbsences.length ? todaysAbsences.map(t=>`<div class="absence-alert-item">${t.assignees.map(a=>workerDot(a)+escapeHtml(a)).join(', ')} <span style="color:var(--text-faint);">· ${escapeHtml(t.title)}</span></div>`).join('') : `<div class="empty-note" style="margin:0;">오늘 부재 인원이 없습니다.</div>`}
      <p class="absence-alert-heading" style="margin-top:14px;">📅 부재 예정 (7일 이내)</p>
      ${upcomingAbsences.length ? upcomingAbsences.map(t=>{
        const dDay = Math.round((parseISO(t.startDate)-parseISO(today))/86400000);
        return `<div class="absence-alert-item"><span class="dday-badge">D-${dDay}</span> ${t.assignees.map(a=>workerDot(a)+escapeHtml(a)).join(', ')} <span style="color:var(--text-faint);">· ${absenceDateRangeShort(t)} · ${escapeHtml(t.title)}</span></div>`;
      }).join('') : `<div class="empty-note" style="margin:0;">일주일 이내 예정된 부재가 없습니다.</div>`}
    </div>
    <div class="pill-group" id="mobileAbsenceWorkerPills" style="margin-bottom:10px;">
      ${WORKERS.map(w=>`<div class="pill ${mobileAbsenceWorkerFilter===w?'selected':''}" data-worker="${w}">${workerDot(w)}${w}</div>`).join('')}
      ${mobileAbsenceWorkerFilter ? `<div class="pill" id="mobileResetAbsenceWorker" style="border-style:dashed; color:var(--text-faint);">전체 보기</div>` : ''}
    </div>
    <label style="display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:12px; cursor:pointer;">
      <input type="checkbox" id="mobileHideSharedCb" ${mobileAbsenceHideShared?'checked':''} style="width:15px; height:15px; margin:0;">
      공통휴가(전 직원 부재) 숨기기
    </label>
    <p style="font-size:12px; color:var(--text-dim); margin:0 0 8px;">총 ${filtered.length}건</p>
    ${filtered.length ? filtered.map(t=>`
      <div class="mobile-ticket-card" data-id="${t.id}">
        <div class="mobile-ticket-card-title">${escapeHtml(t.title)}</div>
        <div class="mobile-ticket-card-meta">${escapeHtml(mobileAbsenceAssigneeLabel(t))} · ${mobileAbsenceDateRangeText(t)}</div>
      </div>`).join('') : `<div class="empty-note">등록된 부재가 없습니다.</div>`}
  `;
}

const MOBILE_VIEW_TITLES = { day:'일별 일정', month:'월별 일정', inprogress:'진행중인 티켓', upcoming:'진행 예정인 티켓', search:'티켓 검색', absence:'부재 관리' };

function renderMobileTopbarLeft(){
  if(mobileView === 'day'){
    return `
      <div class="mobile-date-nav">
        <button type="button" class="mobile-nav-btn" id="mPrevDay">‹</button>
        <div class="mobile-date-label">${mobileDateLabelHtml()}</div>
        <button type="button" class="mobile-nav-btn" id="mNextDay">›</button>
        <button type="button" class="mobile-today-goto-btn" id="mobileTodayBtn">오늘로</button>
      </div>`;
  }
  return `<div class="mobile-date-label">${MOBILE_VIEW_TITLES[mobileView] || ''}</div>`;
}

function renderMobileMainArea(){
  if(mobileView === 'day'){
    return `<div class="mobile-board" id="mobileBoardArea">${renderMobileBoardRows()}</div>`;
  }
  if(mobileView === 'month'){
    return `<div class="mobile-board" id="mobileBoardArea">${renderMobileMonthGrid()}</div>`;
  }
  let body = '';
  if(mobileView === 'inprogress'){
    const list = TICKETS.filter(t=> ticketStatus(t)==='작업중').sort((a,b)=> a.endDate<b.endDate?-1:1);
    body = renderMobileInProgressCards(list);
  } else if(mobileView === 'upcoming'){
    const list = TICKETS.filter(t=> ticketStatus(t)==='예정').sort((a,b)=> a.startDate<b.startDate?-1:1);
    body = renderMobileUpcomingCards(list);
  } else if(mobileView === 'search'){
    body = renderMobileSearchView();
  } else if(mobileView === 'absence'){
    body = renderMobileAbsenceView();
  }
  return `<div class="mobile-subview-body" id="mobileSubviewBody">${body}</div>`;
}

function wireMobileApp(){
  const app = document.getElementById('app');

  const prevBtn = app.querySelector('#mPrevDay');
  if(prevBtn) prevBtn.onclick = ()=>{ mobileBoardDate = toISO(addDays(parseISO(mobileBoardDate), -1)); renderApp(); };
  const nextBtn = app.querySelector('#mNextDay');
  if(nextBtn) nextBtn.onclick = ()=>{ mobileBoardDate = toISO(addDays(parseISO(mobileBoardDate), 1)); renderApp(); };
  const todayBtn = app.querySelector('#mobileTodayBtn');
  if(todayBtn) todayBtn.onclick = ()=>{ mobileBoardDate = todayISO(); renderApp(); };

  const prevMonthBtn = app.querySelector('#mPrevMonth');
  if(prevMonthBtn) prevMonthBtn.onclick = ()=>{
    const a = mobileMonthAnchor || new Date();
    mobileMonthAnchor = new Date(a.getFullYear(), a.getMonth()-1, 1);
    renderApp();
  };
  const nextMonthBtn = app.querySelector('#mNextMonth');
  if(nextMonthBtn) nextMonthBtn.onclick = ()=>{
    const a = mobileMonthAnchor || new Date();
    mobileMonthAnchor = new Date(a.getFullYear(), a.getMonth()+1, 1);
    renderApp();
  };
  const thisMonthBtn = app.querySelector('#mobileThisMonthBtn');
  if(thisMonthBtn) thisMonthBtn.onclick = ()=>{ mobileMonthAnchor = new Date(); renderApp(); };
  app.querySelectorAll('.mmw-bg[data-date]').forEach(cell=>{
    cell.onclick = ()=>{
      mobileDayPopupDate = cell.dataset.date;
      renderApp();
    };
  });
  const popupBackdrop = app.querySelector('#mobileDayPopupBackdrop');
  if(popupBackdrop){
    popupBackdrop.addEventListener('mousedown', (e)=>{ if(e.target===popupBackdrop){ mobileDayPopupDate = null; renderApp(); } });
  }
  const popupClose = app.querySelector('#mobileDayPopupClose');
  if(popupClose) popupClose.onclick = ()=>{ mobileDayPopupDate = null; renderApp(); };

  wireMobileTicketCardClicks(app);

  const addTicketBtn = app.querySelector('#mobileAddTicketBtn');
  if(addTicketBtn) addTicketBtn.onclick = ()=>{ mobileMenuOpen = false; openModal(null); };
  const addAbsenceBtn = app.querySelector('#mobileAddAbsenceBtn');
  if(addAbsenceBtn) addAbsenceBtn.onclick = ()=>{ mobileMenuOpen = false; openModal(null, '부재'); };

  const expandBtn = app.querySelector('#mobileExpandBtn');
  if(expandBtn) expandBtn.onclick = ()=>{ setMobileImmersive(!mobileImmersive); renderApp(); };

  const menuBtn = app.querySelector('#mobileMenuBtn');
  if(menuBtn) menuBtn.onclick = ()=>{ mobileMenuOpen = true; renderApp(); };
  const menuOverlay = app.querySelector('#mobileMenuOverlay');
  if(menuOverlay){
    menuOverlay.addEventListener('mousedown', (e)=>{ if(e.target===menuOverlay){ mobileMenuOpen = false; renderApp(); } });
  }
  const menuCancel = app.querySelector('#mobileMenuCancel');
  if(menuCancel) menuCancel.onclick = ()=>{ mobileMenuOpen = false; renderApp(); };
  app.querySelectorAll('.mobile-menu-item[data-view]').forEach(el=>{
    el.onclick = ()=>{
      mobileView = el.dataset.view;
      mobileMenuOpen = false;
      renderApp();
    };
  });

  // 티켓 검색 서브뷰
  const mSearchInput = app.querySelector('#mobileSearchInput');
  if(mSearchInput){
    mSearchInput.oninput = (e)=>{
      mobileSearchText = e.target.value;
      renderMobileSearchResultsOnly(); // 입력 포커스를 유지하기 위해 결과 영역만 갱신
    };
    renderMobileSearchResultsOnly();
  }
  const mSearchStart = app.querySelector('#mobileSearchStartInput');
  if(mSearchStart) mSearchStart.onchange = (e)=>{ mobileSearchStartFilter = e.target.value || ''; renderMobileSearchResultsOnly(); };
  const mSearchEnd = app.querySelector('#mobileSearchEndInput');
  if(mSearchEnd) mSearchEnd.onchange = (e)=>{ mobileSearchEndFilter = e.target.value || ''; renderMobileSearchResultsOnly(); };
  const mSearchStatusSelect = app.querySelector('#mobileSearchStatusSelect');
  if(mSearchStatusSelect){
    mSearchStatusSelect.onchange = (e)=>{
      mobileSearchStatusFilter = e.target.value || null;
      renderMobileSearchResultsOnly();
    };
  }
  const mSearchProjectSelect = app.querySelector('#mobileSearchProjectSelect');
  if(mSearchProjectSelect){
    mSearchProjectSelect.onchange = (e)=>{
      mobileSearchProjectFilter = e.target.value || null;
      renderMobileSearchResultsOnly();
    };
  }
  const mSearchTypeSelect = app.querySelector('#mobileSearchTypeSelect');
  if(mSearchTypeSelect){
    mSearchTypeSelect.onchange = (e)=>{
      mobileSearchTypeFilter = e.target.value || null;
      renderMobileSearchResultsOnly();
    };
  }
  app.querySelectorAll('#mobileSearchWorkerPills [data-worker]').forEach(el=>{
    el.onclick = ()=>{
      const w = el.dataset.worker;
      mobileSearchWorkerFilter = (mobileSearchWorkerFilter===w) ? null : w;
      renderApp();
    };
  });
  const resetMobileSearchWorker = app.querySelector('#mobileResetSearchWorker');
  if(resetMobileSearchWorker) resetMobileSearchWorker.onclick = ()=>{ mobileSearchWorkerFilter = null; renderApp(); };

  // 부재 관리 서브뷰
  app.querySelectorAll('#mobileAbsenceWorkerPills [data-worker]').forEach(el=>{
    el.onclick = ()=>{
      const w = el.dataset.worker;
      mobileAbsenceWorkerFilter = (mobileAbsenceWorkerFilter===w) ? null : w;
      renderApp();
    };
  });
  const resetMobileAbsenceWorker = app.querySelector('#mobileResetAbsenceWorker');
  if(resetMobileAbsenceWorker) resetMobileAbsenceWorker.onclick = ()=>{ mobileAbsenceWorkerFilter = null; renderApp(); };
  const hideSharedCb = app.querySelector('#mobileHideSharedCb');
  if(hideSharedCb){
    hideSharedCb.onchange = ()=>{
      mobileAbsenceHideShared = hideSharedCb.checked;
      renderApp();
    };
  }
}

/* ============================= 보드(Gantt) ============================= */
function boardLegendHtml(showTypeColors){
  if(showTypeColors === undefined) showTypeColors = true;
  const chipStyle = wt => showTypeColors
    ? `background:${WORK_TYPE_COLORS[wt]};`
    : `background:#fff; border:1.5px solid var(--border); color:var(--text-dim);`;
  const noTypeStyle = showTypeColors
    ? `background:${NO_TYPE_COLOR};`
    : `background:#fff; border:1.5px solid var(--border); color:var(--text-dim);`;
  return `<div class="legend" id="boardTypeLegend">${WORK_TYPES.map(wt=>`
      <span class="legend-chip filterable ${boardTypeFilters.includes(wt)?'active':''}" data-type="${wt}" style="${chipStyle(wt)}">${WORK_TYPE_ICONS[wt]} ${wt}</span>`).join('')}
      <span class="legend-chip filterable ${boardTypeFilters.includes(ABSENCE_FILTER_KEY)?'active':''}" data-type="${ABSENCE_FILTER_KEY}" style="${noTypeStyle}">부재</span>
      ${boardTypeFilters.length ? `<span class="legend-chip reset-chip" id="resetBoardTypeFilter">전체 보기</span>` : ''}
    </div>`;
}
function wireBoardTypeFilter(){
  const legend = document.getElementById('boardTypeLegend');
  if(!legend) return; // 보드 화면이 아닐 때는 존재하지 않음
  legend.querySelectorAll('.legend-chip[data-type]').forEach(el=>{
    el.onclick = ()=>{
      const wt = el.dataset.type;
      const idx = boardTypeFilters.indexOf(wt);
      if(idx>-1) boardTypeFilters.splice(idx,1); // 이미 선택된 유형을 다시 누르면 해제
      else boardTypeFilters.push(wt); // 연달아 누르면 추가로 선택되어 함께 표시됨
      renderContent();
    };
  });
  const resetBtn = document.getElementById('resetBoardTypeFilter');
  if(resetBtn) resetBtn.onclick = ()=>{ boardTypeFilters = []; renderContent(); };
}

function renderBoard(){
  return boardMode==='month' ? renderMonthBoard() : renderTwoWeekBoard();
}

function renderTwoWeekBoard(){
  const days = Array.from({length:14}, (_,i)=> addDays(anchorMonday,i));
  const rangeStart = toISO(days[0]), rangeEnd = toISO(days[13]);
  const today = todayISO();
  const chains = computeChains();

  const legend = boardLegendHtml();

  const head = `
    <div class="board-head">
      <div class="board-head-corner">작업자</div>
      ${days.map((d,i)=>{
        const iso = toISO(d);
        const cls = ['day-col-head'];
        if(isWeekend(d)) cls.push('weekend');
        if(iso===today) cls.push('today');
        if(i===7) cls.push('week-split');
        return `<div class="${cls.join(' ')}"><div class="dow">${DOW_LABEL[d.getDay()]}</div><div class="dnum">${d.getMonth()+1}/${d.getDate()}</div></div>`;
      }).join('')}
    </div>`;

  const rows = WORKERS.map(w=>{
    const wTickets = TICKETS.filter(t=>t.assignees.includes(w) && matchesBoardTypeFilter(t));
    const {items, maxLanes} = assignLanes(wTickets, rangeStart, rangeEnd);
    const rowHeight = maxLanes * 38 + 6;

    const bgCells = days.map((d,i)=>{
      const iso = toISO(d);
      const cls=['day-bg'];
      if(isWeekend(d)) cls.push('weekend');
      if(iso===today) cls.push('today');
      return `<div class="${cls.join(' ')}" data-date="${iso}" data-worker="${escapeHtml(w)}" style="grid-row:1 / span ${maxLanes}; grid-column:${i+1}"></div>`;
    }).join('');

    const bars = items.map(({t,lane})=>{
      const idxOf = iso => Math.round((parseISO(iso)-parseISO(rangeStart))/86400000);

      const color = t.workType ? (WORK_TYPE_COLORS[t.workType] || '#666') : NO_TYPE_COLOR;
      const chain = chains[t.id];
      const isAbsence = t.project === '부재';
      const status = ticketStatus(t);
      const statusCls = status==='완료' ? 'tb-done' : status==='보류' ? 'tb-hold' : '';
      const days_bd = expectedWorkDays(t);
      const actual = actualBusinessDays(t);

      const title = `${t.title} · ${t.project}${t.workType?' · '+t.workType:''} · ${status} · ${fmtFull(t.startDate)}~${fmtFull(t.endDate)}${isAbsence?'':` (예상 ${fmtDays(days_bd)}영업일${status==='완료'&&actual!==null?`, 실제 ${fmtDays(actual)}영업일`:''})`}${t.resourceDeadline?` · 리소스 마감 ${fmtFull(t.resourceDeadline)}`:''}${t.spec?` · 사양: ${t.spec}`:''}`;

      // 부재를 포함한 모든 티켓은 주말(비근무일)에 바가 끊기고, '주말 출근 필요' 체크가 있을 때만 이어서 표기
      const segments = splitSegmentsByWorkDays(t.startDate, t.endDate, t, false);

      return segments.map((seg, segIdx)=>{
        const clip = clipRange(seg[0], seg[1], rangeStart, rangeEnd);
        if(!clip) return '';
        const totalStartIdx = idxOf(clip[0]);
        const totalEndIdx = idxOf(clip[1]);
        const isFirstSeg = segIdx===0, isLastSeg = segIdx===segments.length-1;
        const showStartBold = isFirstSeg && t.startDate >= rangeStart && t.startDate <= rangeEnd;
        const showEndBold = isLastSeg && t.endDate >= rangeStart && t.endDate <= rangeEnd;

        return `
          <div class="ticket-bar ${statusCls}" data-id="${t.id}" title="${escapeHtml(title)}"
               style="grid-column:${totalStartIdx+1} / ${totalEndIdx+2}; grid-row:${lane+1};">
            <div class="seg seg-main ${isAbsence?'absence-bar':''}" style="flex:1 0 0; background:${color};">
              ${showStartBold ? `<span class="edge-date start-edge">${fmtShort(t.startDate)}</span>` : ''}
              <span class="seg-label" style="margin-top:9px;">${t.workType?WORK_TYPE_ICONS[t.workType]+' ':''}<b>[${escapeHtml(t.project)}]</b> ${(isAbsence && t.assignees && t.assignees.length===1) ? escapeHtml(t.assignees[0])+' ' : ''}${escapeHtml(t.title)}${qtyBadge(t)}</span>
              ${showEndBold ? `<span class="edge-date end-edge">${fmtShort(t.endDate)}</span>` : ''}
            </div>
            ${isFirstSeg ? `<div class="resize-handle left" data-id="${t.id}" data-edge="start" title="시작일 변경(드래그)"></div>` : ''}
            ${isLastSeg ? `<div class="resize-handle right" data-id="${t.id}" data-edge="end" title="마감일 변경(드래그)"></div>` : ''}
            ${(isLastSeg && chain) ? `<span class="chain-badge" title="연속 작업 ${chain.index}/${chain.size}">🔗</span>` : ''}
          </div>`;
      }).join('');
    }).join('');

    return `
      <div class="board-row">
        <div class="worker-cell" style="min-height:${rowHeight}px;">
          <div class="worker-name">${w}</div>
          <div class="worker-meta">${wTickets.length}건 등록</div>
        </div>
        <div class="worker-grid" style="grid-auto-rows:38px; min-height:${rowHeight}px;">
          ${bgCells}
          ${bars}
        </div>
      </div>`;
  }).join('');

  return `${legend}<div class="board">${head}${rows}</div>${renderBoardSummary()}`;
}

function renderMonthBoard(){
  const year = monthAnchor.getFullYear();
  const month = monthAnchor.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const lastOfMonth = new Date(year, month+1, 0);
  const startOfGrid = addDays(firstOfMonth, -firstOfMonth.getDay());
  const totalDays = Math.ceil((Math.round((lastOfMonth - startOfGrid)/86400000) + 1) / 7) * 7;
  const gridDays = Array.from({length: totalDays}, (_,i)=> addDays(startOfGrid, i));
  const weeks = [];
  for(let i=0; i<gridDays.length; i+=7) weeks.push(gridDays.slice(i, i+7));

  const today = todayISO();
  const chains = computeChains();
  const legend = boardLegendHtml(!!monthFilterWorker);
  const ticketPool = TICKETS.filter(t=>
    (!monthFilterWorker || t.assignees.includes(monthFilterWorker)) &&
    matchesBoardTypeFilter(t)
  );
  // 전체보기(작업자 필터 없음)에서 담당자가 2명 이상인 티켓(부재 제외)은, 한 바 안에서 색상을 나누는 대신
  // 담당자별로 완전히 분리된 바(각자 별도의 레인)로 표시되도록 담당자 수만큼 항목을 나눠준다.
  const expandedTicketPool = ticketPool.flatMap(t=>{
    if(!monthFilterWorker && t.project!=='부재' && t.assignees.length>1){
      return t.assignees.map(a=> ({...t, assignees:[a]}));
    }
    return [t];
  });

  // 전체보기(작업자 필터 없음)일 때만 필터 칩 자체에 담당자 바 색상을 입혀서 범례를 대신한다.
  // 특정 작업자를 선택하면 바 색상이 업무 유형 기준으로 바뀌므로, 이때는 필터 칩에서 담당자 색을 빼고
  // 상단 업무 유형 범례(boardLegendHtml)의 색상이 그 역할을 하도록 한다.
  const showWorkerColorOnPills = !monthFilterWorker;
  const workerFilter = `
    <div class="legend" style="margin-top:-4px;">
      <span style="font-size:11.5px; color:var(--text-faint); margin-right:2px;">작업자 필터:</span>
      ${WORKERS.map(w=>{
        const isActive = monthFilterWorker===w;
        const colorStyle = (showWorkerColorOnPills && !isActive) ? `background:${WORKER_COLORS[w]}; border-color:${WORKER_COLORS[w]}; color:#2A2E35;` : '';
        return `<span class="worker-filter-pill ${isActive?'active':''}" data-worker="${w}" style="${colorStyle}">${w}</span>`;
      }).join('')}
      ${monthFilterWorker ? `<span class="worker-filter-pill reset" id="resetWorkerFilter">전체 보기</span>` : ''}
    </div>`;

  const head = `
    <div class="month-head">
      ${DOW_LABEL.map((d,i)=>`<div class="month-head-cell ${i===0||i===6?'weekend-label':''}">${d}</div>`).join('')}
    </div>`;

  const weekRows = weeks.map(week=>{
    const wsISO = toISO(week[0]), weISO = toISO(week[6]);
    const { items, maxLanes } = assignLanes(expandedTicketPool, wsISO, weISO);
    const laneHeight = monthFilterWorker ? 38 : 22;
    const rowTemplate = `24px repeat(${maxLanes}, ${laneHeight}px)`;

    const bgCells = week.map((d,i)=>{
      const iso = toISO(d);
      const inMonth = d.getMonth() === month;
      const cls = ['month-day-bg'];
      if(isWeekend(d)) cls.push('weekend');
      if(iso===today) cls.push('today');
      if(!inMonth) cls.push('out-month');
      return `<div class="${cls.join(' ')}" data-date="${iso}" style="grid-column:${i+1}; grid-row:1 / span ${maxLanes+1};"><span class="month-daynum">${d.getDate()}${iso===today?'<span class="today-badge">오늘</span>':''}</span></div>`;
    }).join('');

    const bars = items.map(({t, lane})=>{
      const idxOf = iso => Math.round((parseISO(iso)-parseISO(wsISO))/86400000);

      const isAbsence = t.project === '부재';
      // 전체보기(작업자 필터 없음)에서는 담당자별 파스텔톤 색상(담당자가 여럿이면 위에서 이미 개별 바로 분리됨),
      // 특정 작업자로 필터링된 경우에는 기존처럼 업무 유형별 색상 사용
      // 단, 부재는 어느 모드에서든 항상 회색(NO_TYPE_COLOR)으로 표시
      const color = isAbsence
        ? NO_TYPE_COLOR
        : (!monthFilterWorker
            ? (WORKER_COLORS[t.assignees[0]] || NO_TYPE_COLOR)
            : (t.workType ? (WORK_TYPE_COLORS[t.workType] || '#666') : NO_TYPE_COLOR));
      const chain = chains[t.id];
      const status = ticketStatus(t);
      const statusCls = status==='완료' ? 'tb-done' : status==='보류' ? 'tb-hold' : '';
      const days_bd = expectedWorkDays(t);
      const actual = actualBusinessDays(t);
      const title = `${t.title} · ${t.project}${t.workType?' · '+t.workType:''} · ${t.assignees.join(',')} · ${status} · ${fmtFull(t.startDate)}~${fmtFull(t.endDate)}${isAbsence?'':` (예상 ${fmtDays(days_bd)}영업일${status==='완료'&&actual!==null?`, 실제 ${fmtDays(actual)}영업일`:''})`}${t.resourceDeadline?` · 리소스 마감 ${fmtFull(t.resourceDeadline)}`:''}${t.spec?` · 사양: ${t.spec}`:''}`;

      // 부재를 포함한 모든 티켓은 주말(비근무일)에 바가 끊기고, '주말 출근 필요' 체크가 있을 때만 이어서 표기
      const segments = splitSegmentsByWorkDays(t.startDate, t.endDate, t, false);

      return segments.map((seg, segIdx)=>{
        const clip = clipRange(seg[0], seg[1], wsISO, weISO);
        if(!clip) return '';
        const s = idxOf(clip[0]), e = idxOf(clip[1]);
        const isLastSeg = segIdx===segments.length-1;

        return `
          <div class="ticket-bar month-bar ${monthFilterWorker?'':'thin'} ${statusCls}" data-id="${t.id}" title="${escapeHtml(title)}"
               style="grid-column:${s+1} / ${e+2}; grid-row:${lane+2};">
            <div class="seg seg-main ${isAbsence?'absence-bar':''}" style="flex:1 0 0; background:${color};">
              <span class="seg-label">${t.workType?WORK_TYPE_ICONS[t.workType]+' ':''}<b>[${escapeHtml(t.project)}]</b> ${escapeHtml(t.title)}${qtyBadge(t)} <span class="month-bar-assignee">· ${escapeHtml(t.assignees.join(','))}</span></span>
            </div>
            ${segIdx===0 ? `<div class="resize-handle left" data-id="${t.id}" data-edge="start" title="시작일 변경(드래그)"></div>` : ''}
            ${isLastSeg ? `<div class="resize-handle right" data-id="${t.id}" data-edge="end" title="마감일 변경(드래그)"></div>` : ''}
            ${(isLastSeg && chain) ? `<span class="chain-badge" title="연속 작업 ${chain.index}/${chain.size}">🔗</span>` : ''}
          </div>`;
      }).join('');
    }).join('');

    return `<div class="month-week" data-ws="${wsISO}" style="grid-template-rows:${rowTemplate};">${bgCells}${bars}</div>`;
  }).join('');

  return `${legend}${workerFilter}<div class="board">${head}${weekRows}</div>${renderBoardSummary()}`;
}

function deadlineRemainHtml(endDate){
  const today = todayISO();
  if(endDate === today){
    return `<span class="deadline-danger">오늘 마감</span>`;
  }
  if(endDate < today){
    const daysPast = calendarDaysBetween(endDate, today) - 1;
    const label = daysPast <= 1 ? '어제 마감' : `${daysPast}일 지남`;
    return `<span class="deadline-danger">${label}</span>`;
  }
  return `${businessDaysBetween(today, endDate)}영업일`;
}
/* ============================= 보드 하단 요약 (진행중 티켓 + 진행 예정 티켓) ============================= */
function renderBoardSummary(){
  const today = todayISO();
  const inProgress = TICKETS.filter(t=> ticketStatus(t)==='작업중')
    .sort((a,b)=> a.endDate<b.endDate?-1:1);
  const upcoming = TICKETS.filter(t=> ticketStatus(t)==='예정')
    .sort((a,b)=> a.startDate<b.startDate?-1:1);

  const progressCard = `
    <div class="card">
      <p class="card-title">진행 중 티켓</p>
      <p class="card-sub">상태가 '작업중'으로 설정된 티켓 · <span class="resource-flag-badge" style="margin-right:0;">❗ 리소스 확인</span> 표시는 리소스 도착 확인이 필요한 티켓입니다</p>
      ${inProgress.length ? `
      <table class="simple">
        <thead><tr><th>제목</th><th>프로젝트</th><th>담당자</th><th>기간</th><th>마감까지</th><th>리소스</th><th>레퍼런스</th></tr></thead>
        <tbody>
          ${inProgress.map(t=>{
            const needsResourceCheck = !!t.resourceCheckNeeded;
            const isAbsenceRow = t.project==='부재';
            return `<tr class="ticket-row ${needsResourceCheck?'tr-resource-alert':''} ${isAbsenceRow?'tr-absence':''}" data-id="${t.id}" style="cursor:pointer;">
              <td>${needsResourceCheck?'<span class="resource-flag-badge" title="리소스 마감일까지 도착 확인이 필요합니다">❗ 리소스 확인</span>':''}${t.workType?WORK_TYPE_ICONS[t.workType]+' ':''}${escapeHtml(t.title)}${qtyBadge(t)}</td>
              <td><span class="proj-chip" style="background:${PROJECT_COLORS[t.project]}">${t.project}</span></td>
              <td>${t.assignees.join(', ')}</td>
              <td>${fmtShort(t.startDate)} ~ ${fmtShort(t.endDate)}</td>
              <td>${deadlineRemainHtml(t.endDate)}</td>
              <td>${renderResourceCell(t)}</td>
              <td>${renderResourceField((t.referenceLinks&&t.referenceLinks.length)?t.referenceLinks:t.referenceLink, '레퍼런스')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : `<div class="empty-note">현재 진행 중인 티켓이 없습니다.</div>`}
    </div>`;

  const upcomingCard = `
    <div class="card">
      <p class="card-title">진행 예정인 티켓</p>
      <p class="card-sub">상태가 '예정'으로 설정된 티켓 · <span class="resource-flag-badge" style="margin-right:0;">❗ 리소스 확인</span> 표시는 리소스 도착 확인이 필요한 티켓입니다</p>
      ${upcoming.length ? `
      <table class="simple">
        <thead><tr><th>제목</th><th>프로젝트</th><th>담당자</th><th>시작까지</th><th>리소스</th><th>레퍼런스</th></tr></thead>
        <tbody>
          ${upcoming.map(t=>{
            const dday = businessDaysBetween(today, t.startDate) - 1;
            const needsResourceCheck = !!t.resourceCheckNeeded;
            const isAbsenceRow = t.project==='부재';
            // 전체 휴가(담당자 전원 부재)는 공간 확보를 위해 담당자를 'ALL'로 표기
            const assigneeLabel = (t.project==='부재' && t.assignees && t.assignees.length===WORKERS.length)
              ? 'ALL'
              : (t.assignees||[]).join(', ');
            return `<tr class="ticket-row ${needsResourceCheck?'tr-resource-alert':''} ${isAbsenceRow?'tr-absence':''}" data-id="${t.id}" style="cursor:pointer;">
              <td>${needsResourceCheck?'<span class="resource-flag-badge" title="리소스 마감일까지 도착 확인이 필요합니다">❗ 리소스 확인</span>':''}${t.workType?WORK_TYPE_ICONS[t.workType]+' ':''}${escapeHtml(t.title)}${qtyBadge(t)}</td>
              <td style="min-width:58px;"><span class="proj-chip" style="background:${PROJECT_COLORS[t.project]}">${t.project}</span></td>
              <td>${escapeHtml(assigneeLabel)}</td>
              <td style="min-width:82px;">${fmtShort(t.startDate)} (D-${Math.max(dday,0)})</td>
              <td>${renderResourceCell(t)}</td>
              <td>${renderResourceField((t.referenceLinks&&t.referenceLinks.length)?t.referenceLinks:t.referenceLink, '레퍼런스')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : `<div class="empty-note">진행 예정인 티켓이 없습니다.</div>`}
    </div>`;

  return `<div class="board-summary">${progressCard}${upcomingCard}</div>`;
}

// 모서리 클릭 시 팝업으로 시작일/마감일을 -1/+1 조정하는 방식

  const overlay = document.createElement('div');

  overlay.innerHTML = `
    <div class="modal" style="max-width:480px;">
      <div class="modal-head"><h3>${label} 수정</h3><button type="button" class="modal-close" id="rpClose">✕</button></div>
      <div class="modal-body">
        <p style="margin:0 0 10px; font-size:13.5px; line-height:1.6;"><b>${escapeHtml(t.title)}</b> <span class="proj-chip" style="background:${PROJECT_COLORS[t.project]}">${escapeHtml(t.project)}</span></p>
        <div style="display:flex; align-items:center; gap:8px; margin:0 0 12px;">

          <span style="font-size:13px; color:var(--text-dim);">현 <b style="color:var(--text);">${fmtFull(edge==='start'?t.startDate:t.endDate)}</b></span>
        </div>
        <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px;">
          <button type="button" class="btn btn-ghost" id="rpMinus" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; width:58px; height:58px; border-radius:10px; font-weight:800; padding:4px 0; line-height:1;">
            <span style="font-size:14px;">◀</span><span style="font-size:12px;">-1</span>
          </button>
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:170px; padding:10px 14px; border:1.5px solid var(--border); border-radius:12px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06);">
            <span style="font-size:10.5px; font-weight:800; color:var(--text-faint); letter-spacing:.5px; text-transform:uppercase; margin-bottom:3px;">${label}</span>
            <span id="rpDow" style="font-size:13px; font-weight:800; color:var(--accent-dark); margin-bottom:2px;"></span>
            <span id="rpDate" style="font-size:20px; font-weight:800; letter-spacing:.3px;"></span>
          </div>
          <button type="button" class="btn btn-ghost" id="rpPlus" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; width:58px; height:58px; border-radius:10px; font-weight:800; padding:4px 0; line-height:1;">
            <span style="font-size:14px;">▶</span><span style="font-size:12px;">+1</span>
          </button>
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label style="font-size:12px; font-weight:700; color:var(--text-dim); display:block; margin-bottom:6px;">주말 근무 필요</label>
          <div style="display:flex; gap:14px;">
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px; font-weight:600;">
              <input type="checkbox" id="rpSat" ${draftSat?'checked':''} style="width:15px; height:15px; margin:0;"> 토요일 근무
            </label>
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px; font-weight:600;">
              <input type="checkbox" id="rpSun" ${draftSun?'checked':''} style="width:15px; height:15px; margin:0;"> 일요일 근무
            </label>
          </div>
        </div>
        <div class="computed-days" id="rpDays" style="justify-content:center;">변경 후 예상 작업일수(영업일): <b>-</b></div>
      </div>
      <div class="modal-foot">
        <div></div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-ghost" id="rpCancel">취소</button>
          <button type="button" class="btn btn-primary" id="rpOk">확인</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  function refresh(){
    const d = parseISO(draftDate);
    overlay.querySelector('#rpDow').textContent = DOW_LABEL[d.getDay()] + '요일';
    overlay.querySelector('#rpDate').textContent = fmtFull(draftDate);
    const newStart = edge==='start' ? draftDate : t.startDate;
    const newEnd = edge==='start' ? t.endDate : draftDate;
    const draft = {...t, startDate:newStart, endDate:newEnd, weekendSat: draftSat, weekendSun: draftSun};
    const exp = expectedWorkDays(draft);
    overlay.querySelector('#rpDays').innerHTML = `변경 후 예상 작업일수(영업일): <b>${fmtDays(exp)}일</b>`;
  }
  overlay.querySelector('#rpMinus').onclick = ()=>{ draftDate = toISO(addDays(parseISO(draftDate), -1)); refresh(); };
  overlay.querySelector('#rpPlus').onclick = ()=>{ draftDate = toISO(addDays(parseISO(draftDate), 1)); refresh(); };
  overlay.querySelector('#rpSat').onchange = (e)=>{ draftSat = e.target.checked; refresh(); };
  overlay.querySelector('#rpSun').onchange = (e)=>{ draftSun = e.target.checked; refresh(); };
  function close(){ overlay.remove(); }
  overlay.querySelector('#rpClose').onclick = close;
  overlay.querySelector('#rpCancel').onclick = close;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#rpOk').onclick = async ()=>{
    const newStart = edge==='start' ? draftDate : t.startDate;

    const idx = TICKETS.findIndex(x=>x.id===t.id);
    if(idx>-1) TICKETS[idx] = {...TICKETS[idx], startDate:newStart, endDate:newEnd, weekendSat: draftSat, weekendSun: draftSun, updatedAt:new Date().toISOString()};
    const ok = await persistWithProgress(false, '일정을 저장하는 중입니다.');
    notifySaveResult(ok, '일정을 수정했습니다.');
    close();
    renderApp();
  };
  refresh();
}

    const ok = await persistWithProgress(false, '일정을 저장하는 중입니다.');

/* ============================= 대시보드 ============================= */
function renderDashboard(){
  const now = new Date();
  const year = now.getFullYear();

  function buildRows(labels, keyFn, ticketsForRows){
    const table = {};
    labels.forEach(l=> table[l] = {});
    ticketsForRows.forEach(t=>{
      const keys = keyFn(t);
      keys.forEach(k=>{
        if(!table[k]) return;
        const wt = t.workType || '기타';
        table[k][wt] = (table[k][wt]||0) + (t.qty||1);
      });
    });
    return labels.map(l=> ({label:l, counts:table[l]}));
  }

  // ---- 작업자별 유형 티켓 수 (좌우 화살표로 월 이동, 기본은 이번달) ----
  const [workerMS, workerME] = monthRange(workerCardMonthOffset);
  const workerMonthDate = new Date(year, now.getMonth()+workerCardMonthOffset, 1);
  const workerMonthLabel = `${workerMonthDate.getFullYear()}년 ${workerMonthDate.getMonth()+1}월`;
  const workerTickets = TICKETS.filter(t=> t.project !== '부재' && t.startDate <= workerME && t.endDate >= workerMS);
  const workerRows = buildRows(WORKERS, t=> t.assignees, workerTickets);

  // ---- 프로젝트별 유형 티켓 수 (전체 프로젝트, 좌우 화살표로 월 이동) ----
  const [projectMS, projectME] = monthRange(projectCardMonthOffset);
  const projectMonthDate = new Date(year, now.getMonth()+projectCardMonthOffset, 1);
  const projectMonthLabel = `${projectMonthDate.getFullYear()}년 ${projectMonthDate.getMonth()+1}월`;
  const projectMonthTickets = TICKETS.filter(t=> t.project !== '부재' && t.startDate <= projectME && t.endDate >= projectMS);
  const allProjectsExceptAbsence = PROJECTS.filter(p=> p!=='부재');
  const projectRows = buildRows(allProjectsExceptAbsence, t=> [t.project], projectMonthTickets);

  // ---- 작업자별 · 유형별 평균 소요 영업일 (전체 기간 기준, 부재 제외, 라이브·오프라인 촬영 제외) ----
  const AVG_DAYS_WORK_TYPES = WORK_TYPES.filter(wt=> wt!=='라이브' && wt!=='오프라인 촬영');
  const avgDaysAllTickets = TICKETS.filter(t=> t.project !== '부재' && t.workType && AVG_DAYS_WORK_TYPES.includes(t.workType));
  function avgDaysRows(){
    return WORKERS.map(w=>{
      const counts = {};
      AVG_DAYS_WORK_TYPES.forEach(wt=>{
        const ts = avgDaysAllTickets.filter(t=> t.workType===wt && t.assignees.includes(w));
        if(ts.length){
          // 티켓 하나에 여러 개(수량)가 묶여 있으면 총 소요일을 수량으로 나눠 '건당' 일수로 환산해 평균에 반영
          // 예: 숏폼 5개를 5영업일 만에 처리했다면 건당 1일로 계산됨
          const totalQty = ts.reduce((sum,t)=> sum+(t.qty||1), 0);
          const expAvg = totalQty ? ts.reduce((sum,t)=> sum+expectedWorkDays(t), 0) / totalQty : 0;
          // 실제 소요 평균: 완료(actualEndDate 설정)된 티켓만 집계
          const doneTs = ts.filter(t=> t.actualEndDate);
          const doneQty = doneTs.reduce((sum,t)=> sum+(t.qty||1), 0);
          const actAvg = doneQty ? doneTs.reduce((sum,t)=> sum+actualBusinessDays(t), 0) / doneQty : null;
          counts[wt] = {exp: expAvg, act: actAvg};
        }
      });
      return {label:w, counts};
    });
  }

  function typeMatrixTable(rows, rowHeader, types){
    types = types || WORK_TYPES;
    return `
    <table class="simple compact-matrix">
      <thead><tr>
        <th>${rowHeader}</th>
        ${types.map(wt=>`<th>${WORK_TYPE_ICONS[wt]} ${wt}</th>`).join('')}
        <th style="background:var(--accent-soft); color:var(--accent-dark); white-space:nowrap;">총 티켓 수</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>{
          const rowTotal = types.reduce((s,wt)=> s + (parseInt(r.counts[wt],10)||0), 0);
          return `
          <tr>
            <td><b>${r.label}</b></td>
            ${types.map(wt=>`<td>${r.counts[wt]||'-'}</td>`).join('')}
            <td style="background:var(--accent-soft); color:var(--accent-dark); font-weight:800; text-align:center;">${rowTotal}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }

  function avgDaysMatrixTable(rows, types){
    return `
    <table class="simple compact-matrix">
      <thead><tr>
        <th>작업자</th>
        ${types.map(wt=>`<th>${WORK_TYPE_ICONS[wt]} ${wt}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            <td><b>${r.label}</b></td>
            ${types.map(wt=>{
              const v = r.counts[wt];
              if(!v) return '<td>-</td>';
              const actStr = v.act===null ? '-' : fmtDays(v.act)+'일';
              return `<td title="예상 / 실제">${fmtDays(v.exp)}일 / ${actStr}</td>`;
            }).join('')}
          </tr>`).join('')}
      </tbody>
    </table>`;
  }

  // ---- 작업자별 기간 조회 (분기 피드백용 상세 내역) ----
  if(!reportWorker) reportWorker = WORKERS[0];
  if(!reportStart) reportStart = quarterRange(Math.floor(now.getMonth()/3)+1, reportYear)[0];
  if(!reportEnd) reportEnd = todayISO();

  const reportTickets = TICKETS
    .filter(t=> t.project!=='부재' && t.assignees.includes(reportWorker) && t.startDate <= reportEnd && t.endDate >= reportStart)
    .sort((a,b)=> a.startDate<b.startDate?-1:1);

  function reportTable(){
    if(!reportTickets.length) return `<div class="empty-note">선택한 기간에 해당하는 티켓이 없습니다.</div>`;
    return `
    <table class="simple">
      <thead><tr><th>제목</th><th>프로젝트</th><th>유형</th><th>기간</th><th>상태</th><th>리소스</th><th>SB·기획</th></tr></thead>
      <tbody>
        ${reportTickets.map(t=>{
          const status = ticketStatus(t);
          return `<tr class="ticket-row" data-id="${t.id}" style="cursor:pointer;">
            <td>${escapeHtml(t.title)}${qtyBadge(t)}</td>
            <td><span class="proj-chip" style="background:${PROJECT_COLORS[t.project]}">${t.project}</span></td>
            <td>${t.workType?`${WORK_TYPE_ICONS[t.workType]} ${t.workType}`:'-'}</td>
            <td>${fmtShort(t.startDate)} ~ ${fmtShort(t.endDate)}</td>
            <td>${statusChipHtml(status)}</td>
            <td>${renderResourceCell(t)}</td>
            <td>${renderResourceField(t.sb)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }

  return `
    <div class="card">
      <div style="display:flex; align-items:center; justify-content:flex-start; gap:10px; margin-bottom:2px;">
        <p class="card-title" style="margin-bottom:0;">작업자별 · 유형별 티켓 수</p>
        <span style="background:var(--accent); color:#fff; font-weight:800; font-size:12.5px; padding:4px 12px; border-radius:16px; white-space:nowrap;">총 ${workerTickets.reduce((s,t)=>s+(t.qty||1),0)}건</span>
        <div class="range-nav" style="gap:4px;">
          <button class="range-btn" id="workerCardPrev">‹</button>
          <div class="range-label" style="min-width:auto; width:auto; font-size:12.5px; white-space:nowrap;">${workerMonthLabel}</div>
          <button class="range-btn" id="workerCardNext">›</button>
        </div>
      </div>
      <p class="card-sub">해당 달과 기간이 겹치는 티켓 수 · 예정된 작업 포함 (부재 제외)</p>
      ${workerRows.some(r=>Object.keys(r.counts).length) ? typeMatrixTable(workerRows, '작업자') : `<div class="empty-note">해당 달에 등록된 작업이 없습니다.</div>`}
    </div>
    <div class="card">
      <div style="display:flex; align-items:center; justify-content:flex-start; gap:10px; margin-bottom:2px;">
        <p class="card-title" style="margin-bottom:0;">프로젝트별 · 유형별 티켓 수</p>
        <span style="background:var(--accent); color:#fff; font-weight:800; font-size:12.5px; padding:4px 12px; border-radius:16px; white-space:nowrap;">총 ${projectMonthTickets.reduce((s,t)=>s+(t.qty||1),0)}건</span>
        <div class="range-nav" style="gap:4px;">
          <button class="range-btn" id="projectCardPrev">‹</button>
          <div class="range-label" style="min-width:auto; width:auto; font-size:12.5px; white-space:nowrap;">${projectMonthLabel}</div>

function wireReportPanel(){
  const workerPillGroup = document.getElementById('reportWorkerPills');
  if(!workerPillGroup) return; // 대시보드가 아닌 화면에서는 존재하지 않음

  workerPillGroup.querySelectorAll('.pill').forEach(p=>{
    p.onclick = ()=>{

      renderContent();
    };
  });
  const yearPillGroup = document.getElementById('reportYearPills');
  if(yearPillGroup) yearPillGroup.querySelectorAll('[data-year]').forEach(el=>{
    el.onclick = ()=>{
      reportYear = parseInt(el.dataset.year,10);
      reportStart = quarterRange(1, reportYear)[0];
      reportEnd = quarterRange(4, reportYear)[1];
      renderContent();
    };
  });
  const quarterPillGroup = document.getElementById('reportQuarterPills');
  if(quarterPillGroup){
    quarterPillGroup.querySelectorAll('.pill').forEach(p=>{
      p.onclick = ()=>{
        const q = parseInt(p.dataset.quarter, 10);
        const year = new Date().getFullYear();
        const [qStart, qEnd] = quarterRange(q, reportYear);
        reportStart = qStart;
        reportEnd = qEnd;
        renderContent();
      };
    });
  }
  document.getElementById('reportStartInput').onchange = (e)=>{
    reportStart = e.target.value;
    renderContent();
  };
  document.getElementById('reportEndInput').onchange = (e)=>{
    reportEnd = e.target.value;
    renderContent();
  };
  document.getElementById('reportCopyBtn').onclick = async ()=>{
    const tickets = TICKETS
      .filter(t=> t.project!=='부재' && t.assignees.includes(reportWorker) && t.startDate <= reportEnd && t.endDate >= reportStart)
      .sort((a,b)=> a.startDate<b.startDate?-1:1);
    const text = buildQuarterFeedbackText(reportWorker, tickets, reportStart, reportEnd);
    try{
      await navigator.clipboard.writeText(text);
      showToast('클립보드에 복사했습니다.');
    }catch(e){
      // 클립보드 API 사용 불가 시 대체 방법
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); showToast('클립보드에 복사했습니다.'); }
      catch(e2){ showToast('복사에 실패했습니다. 직접 선택해 복사해주세요.'); }
      document.body.removeChild(ta);
    }
  };
}

function getFilteredSearchTickets(){
  const q = searchText.trim().toLowerCase();
  const filtered = TICKETS.filter(t=>{
    if(t.project === '부재') return false; // 부재는 아래 별도 "부재 관리" 목록에서 관리
    if(searchStatusFilters.length && !searchStatusFilters.includes(ticketStatus(t))) return false;
    if(searchTypeFilters.length && !searchTypeFilters.includes(t.workType)) return false;
    if(searchWorkerFilters.length && !(t.assignees||[]).some(a=> searchWorkerFilters.includes(a))) return false;
    if(q){
      const hay = [t.title, t.project, ...(t.assignees||[]), t.memo||'', t.sb||'', t.spec||'', t.referenceLink||'', ...((t.resourceLinks)||[]), ...((t.referenceLinks)||[])].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    // 기간 필터: [searchStartFilter, searchEndFilter] 구간과 겹치는 티켓만 표시
    if(searchStartFilter && t.endDate < searchStartFilter) return false;
    if(searchEndFilter && t.startDate > searchEndFilter) return false;
    return true;
  });

  if(!searchSortKey){
    filtered.sort((a,b)=> a.startDate<b.startDate?-1:1);
    return filtered;
  }
  const dir = searchSortDir==='asc' ? 1 : -1;
  filtered.sort((a,b)=>{
    let cmp = 0;
    switch(searchSortKey){
      case 'title': cmp = (a.title||'').localeCompare((b.title||''), 'ko'); break;
      case 'start': cmp = a.startDate<b.startDate?-1:(a.startDate>b.startDate?1:0); break;
      case 'end': cmp = a.endDate<b.endDate?-1:(a.endDate>b.endDate?1:0); break;
      case 'days': cmp = (expectedWorkDays(a)||0) - (expectedWorkDays(b)||0); break;
      case 'actual': { const aa = actualBusinessDays(a), bb = actualBusinessDays(b); cmp = (aa==null?-1:aa) - (bb==null?-1:bb); break; }
    }
    return cmp * dir;
  });
  return filtered;
}

function sortArrowHtml(key){
  if(searchSortKey !== key) return `<span class="sort-arrow inactive">⇅</span>`;
  return `<span class="sort-arrow">${searchSortDir==='asc'?'▲':'▼'}</span>`;
}
