/* ============================= 부재 관리: 날짜 표기 / 정렬 공통 유틸 ============================= */
// 'M/D(요일)' 형식 (예: 9/7(월))
function fmtShortDow(iso){
  const d = parseISO(iso);
  return `${d.getMonth()+1}/${d.getDate()}(${DOW_LABEL[d.getDay()]})`;
}
// PC 부재 목록/알림용: 시작일~마감일, 시작일과 마감일이 같으면 마감일은 '-'로 표시해 헷갈리지 않게 함
function absenceDateRangeShort(t){
  const endStr = t.startDate===t.endDate ? '-' : fmtShortDow(t.endDate);
  return `${fmtShortDow(t.startDate)}~${endStr}`;
}
// 모바일 부재 목록용: 하루짜리는 "9월 7일 월요일" 형태로 풀어서, 여러 날이면 요일 포함 짧은 표기로
function mobileAbsenceDateRangeText(t){
  if(t.startDate === t.endDate){
    const d = parseISO(t.startDate);
    return `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW_LABEL[d.getDay()]}요일`;
  }
  return `${fmtShortDow(t.startDate)}~${fmtShortDow(t.endDate)}`;
}
// 지난 부재(마감일이 오늘 이전)는 항상 목록 맨 아래로 내리고, 그 안에서는 주어진 비교 함수(cmpFn)를 그대로 적용
function absenceSortComparator(a, b, cmpFn){
  const today = todayISO();
  const aPast = a.endDate < today, bPast = b.endDate < today;
  if(aPast !== bPast) return aPast ? 1 : -1;
  return cmpFn ? cmpFn(a, b) : (a.startDate<b.startDate?-1:1);
}

function getFilteredAbsenceTickets(){
  const q = absenceSearchText.trim().toLowerCase();
  const filtered = TICKETS.filter(t=>{
    if(t.project !== '부재') return false;
    if(absenceHideShared && t.assignees && t.assignees.length === WORKERS.length) return false;
    if(absenceWorkerFilter && !t.assignees.includes(absenceWorkerFilter)) return false;
    if(q){
      const hay = [t.title, ...(t.assignees||[]), t.memo||''].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  if(!absenceSortKey){
    filtered.sort((a,b)=> absenceSortComparator(a,b));
    return filtered;
  }
  const dir = absenceSortDir==='asc' ? 1 : -1;
  filtered.sort((a,b)=> absenceSortComparator(a,b,(x,y)=>{
    let cmp = 0;
    switch(absenceSortKey){
      case 'title': cmp = (x.title||'').localeCompare((y.title||''), 'ko'); break;
      case 'start': cmp = x.startDate<y.startDate?-1:(x.startDate>y.startDate?1:0); break;
      case 'end': cmp = x.endDate<y.endDate?-1:(x.endDate>y.endDate?1:0); break;
    }
    return cmp * dir;
  }));
  return filtered;
}

function absenceSortArrowHtml(key){
  if(absenceSortKey !== key) return `<span class="sort-arrow inactive">⇅</span>`;
  return `<span class="sort-arrow">${absenceSortDir==='asc'?'▲':'▼'}</span>`;
}

      if(input) input.placeholder = '예: 인수인계 사항, 연락 가능 여부 등';
      overlay.querySelector('#addResourceLink').style.display='none';
    } else {
      label.innerHTML = '리소스 링크 · 드라이브 위치 <span class="hint">(선택)</span>';
      if(input) input.placeholder = '예: https://drive.google.com/... 또는 사내 드라이브 경로';
      overlay.querySelector('#addResourceLink').style.display='flex';
    }
  }
  updateFieldsForProject();

  overlay.querySelectorAll('#fStatus .pill').forEach(p=>{
    p.onclick = ()=>{
      const prevStatus = selStatus;
      selStatus = p.dataset.val;
      overlay.querySelectorAll('#fStatus .pill').forEach(x=>{ x.classList.remove('selected'); x.style.cssText=''; });
      p.classList.add('selected');
      const c = STATUS_COLORS[selStatus];
      p.style.cssText = `border-color:${c};background:${c}22;color:${c}`;
      overlay.querySelector('#completionField').style.display = (selStatus==='완료') ? 'block' : 'none';
      if(selStatus==='완료' && prevStatus!=='완료'){
        // '완료'로 처음 전환하는 순간에는 마감일을 그대로 완료일 기본값으로 채워준다.
        // 생각보다 일찍 끝난 경우에만 사용자가 이 필드를 수동으로 앞당기면 된다.
        const endVal = overlay.querySelector('#fEnd').value;
        if(endVal){ const _aeEl = overlay.querySelector('#fActualEnd'); if(_aeEl) _aeEl.value = endVal; }
      }
      updateActualDays();
    };
  });

  overlay.querySelector('#fProject').onchange = (e)=>{ selProject = e.target.value || null; updateFieldsForProject(); };
  overlay.querySelectorAll('#fAssignee .pill').forEach(p=>{
    p.onclick = ()=>{
      const val = p.dataset.val;
      const limitMsg = overlay.querySelector('#assigneeLimitMsg');
      if(selAssignees.includes(val)){
        selAssignees = selAssignees.filter(x=>x!==val);
        p.classList.remove('selected');
        limitMsg.style.display = 'none';
      } else if(selAssignees.length >= 4){
        limitMsg.style.display = 'block';
      } else {
        selAssignees.push(val);
        p.classList.add('selected');
        limitMsg.style.display = 'none';
      }
    };
  });
  overlay.querySelector('#fWorkType').onchange = (e)=>{ selWorkType = e.target.value || null; updateDays(); updateActualDays(); };

  const initialResourceLinks = t ? ((t.resourceLinks&&t.resourceLinks.length)?t.resourceLinks:[t.memo||'']) : [''];
  const initialReferenceLinks = t ? ((t.referenceLinks&&t.referenceLinks.length)?t.referenceLinks:[t.referenceLink||'']) : [''];
  // 현재 입력창에 적혀 있는 값을 그대로 읽어온다 (추가/삭제 시 기존에 입력한 내용이 사라지지 않도록)
  function readRepeatValues(containerId){
    return Array.from(overlay.querySelectorAll('#'+containerId+' input')).map(x=>x.value);
  }
  function renderRepeatInputs(containerId, values, placeholder){
    const box=overlay.querySelector('#'+containerId);
    box.innerHTML=values.map((v,i)=>`<div class="repeat-input-row"><input type="text" value="${escapeHtml(v||'')}" placeholder="${placeholder}">${values.length>1?'<button type="button" class="remove-link-btn" title="삭제">✕</button>':''}</div>`).join('');
    box.querySelectorAll('.remove-link-btn').forEach((btn,i)=>{
      btn.onclick=()=>{
        const cur = readRepeatValues(containerId); // 삭제 전 현재 입력값 유지
        cur.splice(i,1);
        renderRepeatInputs(containerId, cur, placeholder);
      };
    });
  }
  renderRepeatInputs('resourceInputs', initialResourceLinks, '예: https://drive.google.com/... 또는 사내 드라이브 경로');
  renderRepeatInputs('referenceInputs', initialReferenceLinks, '예: https://... 참고 자료 링크');
  overlay.querySelector('#addResourceLink').onclick=()=>{
    const cur = readRepeatValues('resourceInputs'); // 첫 번째 입력값을 잃지 않도록 현재 값 유지
    cur.push('');
    renderRepeatInputs('resourceInputs', cur, '예: https://drive.google.com/... 또는 사내 드라이브 경로');
  };
  overlay.querySelector('#addReferenceLink').onclick=()=>{
    const cur = readRepeatValues('referenceInputs');
    cur.push('');
    renderRepeatInputs('referenceInputs', cur, '예: https://... 참고 자료 링크');
  };


  function currentFormTicketDraft(){
    const satEl = overlay.querySelector('#fWeekendSat');
    const sunEl = overlay.querySelector('#fWeekendSun');
    return {
      id: editingId || '__draft__',
      project: selProject,
      assignees: selAssignees || [],
      workType: selWorkType,
      weekendSat: satEl ? satEl.checked : false,
      weekendSun: sunEl ? sunEl.checked : false
    };
  }
  function updateDays(){
    const s = overlay.querySelector('#fStart').value;
    const e = overlay.querySelector('#fEnd').value;
    const rdField = overlay.querySelector('#fResourceDeadline');
    const rd = rdField ? rdField.value : '';
    const satEl = overlay.querySelector('#fWeekendSat');
    const sunEl = overlay.querySelector('#fWeekendSun');
    const sat = satEl ? satEl.checked : false;
    const sun = sunEl ? sunEl.checked : false;
    const el = overlay.querySelector('#daysVal');
    if(s && e && e>=s){
      // 예상 작업일수 = 주말 뺀 월~금 순수 + 토/일 출근 체크 시 +1 (expectedWorkDays와 동일 로직)
      let effectiveStart = rd ? nextBusinessDay(rd) : s;
      if(effectiveStart > e) effectiveStart = s;
      let days = businessDaysBetween(effectiveStart, e);
      if(sat && rangeIncludesWeekday(effectiveStart, e, 6)) days += 1;
      if(sun && rangeIncludesWeekday(effectiveStart, e, 0)) days += 1;
      el.textContent = fmtDays(days) + '일'; // 주말만 있는 기간에 주말 근무 체크 없으면 0일
    }
    else { el.textContent = '-'; }
  }
  function updateActualDays(){
    const s = overlay.querySelector('#fStart').value;
    const endNow = overlay.querySelector('#fEnd').value;
    // 저장된 완료일(actualEndDate)이 있으면 그것을 종점으로 사용해 검색·CSV와 동일 값을 보장한다.
    // 단, 실제 소요일은 마감일을 초과해 늘어나면 의미가 어긋나므로 마감일로 클램프한다.
    const stored = (t && t.actualEndDate) ? t.actualEndDate : '';
    let ae = stored || (selStatus==='완료' ? endNow : '');
    if(ae && endNow && ae > endNow) ae = endNow;
    const el = overlay.querySelector('#actualDaysVal');
    if(!el) return;
    if(s && ae && ae>=s){
      el.textContent = fmtDays(countWorkingDaysForTicket(s, ae, currentFormTicketDraft())) + '일';
    } else { el.textContent = '-'; }
    const infoEl = overlay.querySelector('#actualEndInfo');
    if(infoEl){
      if(stored && endNow && stored > endNow){
        infoEl.textContent = '저장된 완료일: '+stored+' (마감일 '+endNow+' 초과 → 마감일 기준 계산)';
      } else if(stored){
        infoEl.textContent = '저장된 완료일: '+stored;
      } else {
        infoEl.textContent = '저장된 완료일: 없음(마감일 기준 계산)';
      }
    }
  }
  overlay.querySelector('#fStart').oninput = ()=>{ updateDays(); updateActualDays(); };
  overlay.querySelector('#fEnd').oninput = ()=>{ updateDays(); updateActualDays(); };
  overlay.querySelector('#fResourceDeadline').oninput = updateDays;
  const _fAe = overlay.querySelector('#fActualEnd'); if(_fAe) _fAe.oninput = updateActualDays;
  const fWeekendSatEl = overlay.querySelector('#fWeekendSat');
  const fWeekendSunEl = overlay.querySelector('#fWeekendSun');
  if(fWeekendSatEl) fWeekendSatEl.onchange = ()=>{ updateDays(); updateActualDays(); };
  if(fWeekendSunEl) fWeekendSunEl.onchange = ()=>{ updateDays(); updateActualDays(); };
  updateDays();
  updateActualDays();

  function close(){ overlay.remove(); }
  overlay.querySelector('#mClose').onclick = close;
  overlay.querySelector('#mCancel').onclick = close;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) close(); });

  const jumpBtn = overlay.querySelector('#mJumpToBoard');
  if(jumpBtn){
    jumpBtn.onclick = ()=>{
      const ticketId = t.id;
      const jumpStart = overlay.querySelector('#fStart').value || t.startDate;
      close();
      jumpToTicketOnBoard(ticketId, jumpStart);
    };
  }

  const mCsvBtn = overlay.querySelector('#mCsvDownload');
  if(mCsvBtn) mCsvBtn.onclick = ()=>{
    const isAbsenceDraft = selProject === '부재';
    const draftTitle = overlay.querySelector('#fTitle').value.trim();
    const draftStart = overlay.querySelector('#fStart').value;
    const draftEnd = overlay.querySelector('#fEnd').value;
    const draftResourceLinks = isAbsenceDraft ? [] : Array.from(overlay.querySelectorAll('#resourceInputs input')).map(x=>x.value.trim()).filter(Boolean);
    const draftReferenceLinks = isAbsenceDraft ? [] : Array.from(overlay.querySelectorAll('#referenceInputs input')).map(x=>x.value.trim()).filter(Boolean);
    const draftSB = isAbsenceDraft ? '' : (overlay.querySelector('#fSB') ? overlay.querySelector('#fSB').value.trim() : '');
    const draftSpec = isAbsenceDraft ? '' : (overlay.querySelector('#fSpec') ? overlay.querySelector('#fSpec').value.trim() : '');
    const draftResourceDeadline = isAbsenceDraft ? '' : (overlay.querySelector('#fResourceDeadline') ? overlay.querySelector('#fResourceDeadline').value : '');
    const draftWeekendSat = isAbsenceDraft ? false : (overlay.querySelector('#fWeekendSat') ? overlay.querySelector('#fWeekendSat').checked : false);
    const draftWeekendSun = isAbsenceDraft ? false : (overlay.querySelector('#fWeekendSun') ? overlay.querySelector('#fWeekendSun').checked : false);
    const draft = {
      title: draftTitle || '(제목 없음)', project: selProject || '', workType: isAbsenceDraft ? '' : selWorkType,
      assignees: selAssignees, status: selStatus, startDate: draftStart, endDate: draftEnd,
      resourceLinks: draftResourceLinks, referenceLinks: draftReferenceLinks, memo: draftResourceLinks[0]||'',
      referenceLink: draftReferenceLinks[0]||'', sb: draftSB, spec: draftSpec,
      resourceDeadline: draftResourceDeadline, weekendSat: draftWeekendSat, weekendSun: draftWeekendSun
    };
    exportTicketsToCSV([draft], `티켓_${draftTitle||'제목없음'}_${csvFilenameTimestamp()}.csv`);
  };

  if(t){
    const copyLinkBtn = overlay.querySelector('#mCopyLink');
    if(copyLinkBtn){
      copyLinkBtn.onclick = async ()=>{
        const shareUrl = new URL(window.location.href);
        shareUrl.searchParams.set('ticket', t.id);
        shareUrl.hash = '';
        const text = shareUrl.toString();
        try{
          if(navigator.clipboard && window.isSecureContext){
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          showToast('티켓 링크를 복사했습니다.');
        }catch(e){
          window.prompt('아래 티켓 링크를 복사해주세요.', text);
        }
      };
    }
    let deleting = false;
    overlay.querySelector('#mDelete').onclick = async ()=>{
      if(deleting) return;
      if(!confirm('이 티켓을 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) return;
      deleting = true;
      TICKETS = TICKETS.filter(x=>x.id!==t.id);
      const ok = await persistWithProgress(true, '티켓을 삭제하는 중입니다.');
      notifySaveResult(ok, '티켓을 삭제했습니다.');
      close();
      renderApp();
    };
  }

  let saving = false;
  async function attemptSave(retryCount){
    retryCount = retryCount || 0;
    const title = overlay.querySelector('#fTitle').value.trim();
    const start = overlay.querySelector('#fStart').value;
    const end = overlay.querySelector('#fEnd').value;
    const actualEndEl = overlay.querySelector('#fActualEnd');
    // 완료일 입력이 없는 경우(자동 계산 모드)에는 마감일을 완료일로 사용
    const actualEnd = actualEndEl ? actualEndEl.value : (selStatus==='완료' ? end : '');
    const resourceLinks = Array.from(overlay.querySelectorAll('#resourceInputs input')).map(x=>x.value.trim()).filter(Boolean);
    const memo = resourceLinks[0] || '';
    const sb = selProject==='부재' ? '' : overlay.querySelector('#fSB').value.trim();
    const resourceDeadline = selProject==='부재' ? '' : overlay.querySelector('#fResourceDeadline').value;
    const resourceCheckNeeded = selProject==='부재' ? false : (overlay.querySelector('#fResourceCheckNeeded') ? overlay.querySelector('#fResourceCheckNeeded').checked : false);
    const spec = selProject==='부재' ? '' : overlay.querySelector('#fSpec').value.trim();
    const referenceLinks = selProject==='부재' ? [] : Array.from(overlay.querySelectorAll('#referenceInputs input')).map(x=>x.value.trim()).filter(Boolean);
    const referenceLink = referenceLinks[0] || '';
    const weekendSat = selProject==='부재' ? false : overlay.querySelector('#fWeekendSat').checked;
    const weekendSun = selProject==='부재' ? false : overlay.querySelector('#fWeekendSun').checked;
    const qtyInput = overlay.querySelector('#fQty');
    const qty = (selProject==='부재' || !qtyInput) ? 1 : Math.max(1, parseInt(qtyInput.value, 10) || 1);
    const errEl = overlay.querySelector('#formError');
    const footerErrEl = overlay.querySelector('#footerError');
    const saveBtn = overlay.querySelector('#mSave');

    const errors = [];
    if(!title) errors.push('제목을 입력해주세요.');
    if(!selProject) errors.push('프로젝트를 선택해주세요.');
    if(!selAssignees.length) errors.push('담당자를 한 명 이상 선택해주세요.');
    if(!start || !end) errors.push('시작일과 마감일을 모두 입력해주세요.');
    if(start && end && end < start) errors.push('마감일은 시작일보다 빠를 수 없습니다.');
    if(selStatus==='완료' && start && actualEnd && actualEnd < start) errors.push('완료일은 시작일보다 빠를 수 없습니다.');
    if(!selWorkType && selProject!=='부재') errors.push('업무 유형을 선택해주세요.');

    if(errors.length){
      errEl.style.display = 'block';
      errEl.textContent = errors.join(' ');
      // 스크롤을 내려야 보이는 하단 안내문 외에, 저장 버튼 바로 옆에도 즉시 보이도록 표시
      footerErrEl.textContent = '⚠ ' + errors[0];
      showToast(errors.join(' '));
      return;
    }
    errEl.style.display = 'none';
    errEl.textContent = '';
    footerErrEl.textContent = '';

    if(retryCount===0){
      saving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중...';
    }

    const now = new Date().toISOString();
    const isAbsenceSave = selProject === '부재';
    const payload = {
      title, project:selProject, assignees:selAssignees,
      status: isAbsenceSave ? null : selStatus,
      workType: isAbsenceSave ? null : selWorkType,
      startDate:start, endDate:end,
      actualEndDate: (!isAbsenceSave && selStatus==='완료') ? (actualEnd || end || null) : null,
      memo, resourceLinks: isAbsenceSave ? [] : resourceLinks, sb: isAbsenceSave ? '' : sb, resourceDeadline: (isAbsenceSave || !resourceDeadline) ? null : resourceDeadline,
      resourceCheckNeeded: isAbsenceSave ? false : !!resourceCheckNeeded,
      spec: isAbsenceSave ? '' : spec, referenceLink: isAbsenceSave ? '' : referenceLink, referenceLinks: isAbsenceSave ? [] : referenceLinks,
      weekendSat: isAbsenceSave ? false : !!weekendSat, weekendSun: isAbsenceSave ? false : !!weekendSun,
      weekendWork: false, qty: isAbsenceSave ? 1 : qty, updatedAt:now
    };
    if(editingId){
      const idx = TICKETS.findIndex(x=>x.id===editingId);
      if(idx>-1) TICKETS[idx] = {...TICKETS[idx], ...payload};
    } else {
      TICKETS.push({id:uid(), ...payload, createdAt:now});
    }

    // ★ persistTickets 는 먼저 이 브라우저에 변경분을 확실히 기록한 뒤 서버 저장을 시도한다.
    //   따라서 서버 저장이 실패해도 입력한 내용은 사라지지 않고, 자동으로 재시도된다.
    const ok = await persistWithProgress(false, '티켓을 저장하는 중입니다. 완료될 때까지 잠시만 기다려주세요.');
    saving = false;
    saveBtn.disabled = false;
    saveBtn.textContent = '저장';
    close();
    renderApp();
    notifySaveResult(ok, '저장했습니다.');
  }

  overlay.querySelector('#mSave').onclick = ()=>{
    if(saving) return;
    attemptSave(0);
  };
}

function openTicketFromSharedUrl(){
  const params = new URLSearchParams(window.location.search);
  const ticketId = params.get('ticket');
  if(!ticketId) return;
  const exists = TICKETS.some(t=>t.id===ticketId);
  if(exists){
    openModal(ticketId);
  } else {
    showToast('공유된 티켓을 찾을 수 없습니다.');
  }
}

/* ============================= 초기화 ============================= */
wireDeviceModeToggle();
wireSaveStatus();

/* =====================================================================
   저장 진행 팝업
   - 저장이 0.35초 안에 끝나면 아예 뜨지 않는다 (평소엔 방해 없음)
   - 느릴 때만 떠서 화면을 막고 "이 기기 → 클라우드" 진행 상황을 보여준다
   - 완료되면 ✅ 를 보여주고 스스로 닫힌다
   - 단, 6초가 넘으면 '닫기' 버튼을 열어준다. 서버가 죽었을 때 영원히 갇히면 안 되고,
     이때 닫아도 변경분은 이 기기에 남아 자동으로 계속 재시도되기 때문이다.
   ===================================================================== */
let saveProgressEl = null;
let saveProgressTimers = [];
function clearProgressTimers(){ saveProgressTimers.forEach(clearTimeout); saveProgressTimers = []; }
function hideSaveProgress(){
  clearProgressTimers();
  if(saveProgressEl){ saveProgressEl.remove(); saveProgressEl = null; }
}
function showSaveProgress(label){
  if(saveProgressEl) return;
  const el = document.createElement('div');
  el.className = 'save-progress-backdrop';
  el.id = 'saveProgressOverlay';
  el.innerHTML = `
    <div class="save-progress" role="alertdialog" aria-live="assertive">
      <div class="sp-spinner" id="spSpinner"></div>
      <div class="sp-title" id="spTitle">저장 중…</div>
      <div class="sp-steps">
        <div class="sp-step is-done" id="spLocal"><span>💾 이 기기</span><b>✅ 완료</b></div>
        <div class="sp-arrow">→</div>
        <div class="sp-step is-busy" id="spCloud"><span>☁️ 클라우드</span><b>⏳ 전송 중</b></div>
      </div>
      <div class="sp-note" id="spNote">${escapeHtml(label || '수정한 내용을 서버에 올리는 중입니다. 잠시만 기다려주세요.')}</div>
      <div class="sp-actions" id="spActions"></div>
    </div>`;
  document.body.appendChild(el);
  saveProgressEl = el;
  // 6초가 지나면 탈출구를 열어준다 (갇히지 않도록)
  saveProgressTimers.push(setTimeout(()=>{
    const note = document.getElementById('spNote');
    const acts = document.getElementById('spActions');
    if(note) note.textContent = '서버 응답이 느립니다. 계속 시도 중이며, 지금 닫아도 변경 내용은 이 기기에 안전하게 남아 자동으로 다시 올라갑니다.';
    if(acts && !acts.children.length){
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'sp-btn';
      b.textContent = '백그라운드에서 계속하기 (닫기)';
      b.onclick = hideSaveProgress;
      acts.appendChild(b);
    }
  }, 6000));
}
function saveProgressDone(){
  if(!saveProgressEl) return;
  clearProgressTimers();
  const sp = saveProgressEl.querySelector('.save-progress');
  if(sp) sp.classList.add('is-done');
  const spin = document.getElementById('spSpinner');
  if(spin) spin.className = 'sp-check';
  const title = document.getElementById('spTitle');
  if(title) title.textContent = '저장 완료';
  const cloud = document.getElementById('spCloud');
  if(cloud){ cloud.className = 'sp-step is-done'; cloud.querySelector('b').textContent = '✅ 완료'; }
  const note = document.getElementById('spNote');
  if(note) note.textContent = `${fmtClock(Date.now())} · 팀원 모두에게 반영되었습니다.`;
  const acts = document.getElementById('spActions');
  if(acts) acts.innerHTML = '';
  saveProgressTimers.push(setTimeout(hideSaveProgress, 1100));
}
function saveProgressFailed(){
  if(!saveProgressEl){ showSaveProgress(); }
  clearProgressTimers();
  const sp = saveProgressEl.querySelector('.save-progress');
  if(sp) sp.classList.add('is-fail');
  const spin = document.getElementById('spSpinner');
  if(spin) spin.className = 'sp-warn';
  const title = document.getElementById('spTitle');
  if(title) title.textContent = '아직 서버에 저장되지 않았습니다';
  const cloud = document.getElementById('spCloud');
  if(cloud){ cloud.className = 'sp-step is-fail'; cloud.querySelector('b').textContent = '❌ 실패'; }
  const note = document.getElementById('spNote');
  if(note) note.textContent = '수정한 내용은 이 기기에 저장되어 있어 사라지지 않습니다. 자동으로 계속 재시도하며, 이 화면을 닫아도 됩니다.';
  const acts = document.getElementById('spActions');
  if(acts){
    acts.innerHTML = '';
    const retry = document.createElement('button');
    retry.type = 'button'; retry.className = 'sp-btn primary'; retry.textContent = '지금 다시 시도';
    retry.onclick = async ()=>{
      retry.disabled = true; retry.textContent = '다시 시도 중…';
      const ok = await flushNow();
      if(ok) saveProgressDone();
      else { retry.disabled = false; retry.textContent = '지금 다시 시도'; }
    };
    const close = document.createElement('button');
    close.type = 'button'; close.className = 'sp-btn'; close.textContent = '나중에 (닫기)';
    close.onclick = hideSaveProgress;
    acts.appendChild(retry); acts.appendChild(close);
  }
}
/* 저장 + 진행 팝업. 빠르면 팝업 없이 조용히 끝난다. */
async function persistWithProgress(immediate, label){
  const timer = setTimeout(()=>showSaveProgress(label), 350);
  let ok = false;
  try{
    ok = await persistTickets(immediate);
  } finally {
    clearTimeout(timer);
  }
  if(ok){
    if(saveProgressEl) saveProgressDone();
  } else {
    // 실패는 빠르게 끝나도 반드시 알린다 (조용히 넘어가면 저장된 줄 안다)
    saveProgressFailed();
  }
  return ok;
}
function notifySaveResult(ok, successMsg){
  if(saveProgressEl) return;            // 진행 팝업이 이미 결과를 보여주고 있으면 토스트 생략
  if(ok){ showToast(successMsg); return; }
  if(Backend.kind === 'local'){
    showToast('⚠ 서버에 저장하지 못했습니다. 이 브라우저에만 보관했습니다(다른 사람에게는 아직 안 보임). 우측 상단 저장 상태를 확인해주세요.', 6000);
  } else {
    showToast(`⚠ 아직 서버에 저장되지 않았습니다(미저장 ${SAVE.pending}건). 입력한 내용은 이 브라우저에 보관했고 자동으로 계속 재시도합니다. 우측 상단 저장 상태에서 확인/수동 저장할 수 있습니다.`, 6000);
  }
  const root = document.getElementById('saveStatus');
  if(root){
    root.classList.add('flash');
    setTimeout(()=>root.classList.remove('flash'), 2600);
  }
}

function errHint(err){
  const e = String(err || '').toLowerCase();
  if(e.includes('permission') || e.includes('unauthenticated')){
    return ' <b>Firebase 콘솔 → Firestore Database → 규칙(Rules)</b> 탭을 확인해주세요. 테스트 모드 규칙은 30일 뒤 자동으로 만료되어 이때부터 읽기·쓰기가 전부 차단됩니다.';
  }
  if(e.includes('not-found') || e.includes('unavailable') || e.includes('시간 초과') || e.includes('timeout')){
    return ' Firestore Database가 생성되어 있는지, 네트워크(사내 방화벽 포함)가 <code>firestore.googleapis.com</code> 을 막고 있지 않은지 확인해주세요.';
  }
  if(e.includes('로딩 실패')){
    return ' Firebase SDK(<code>gstatic.com</code>) 로딩이 차단된 것 같습니다. 광고 차단 확장이나 사내 방화벽을 확인해주세요.';
  }
  return '';
}
const LOCAL_ONLY_BANNER = err => `<span>💾 <b>서버 저장이 되지 않는 상태입니다.</b> 변경 내용은 이 브라우저에 안전하게 보관되고, 서버가 다시 연결되면 자동으로 올라갑니다. 다만 <b>지금은 다른 기기·다른 사람에게 보이지 않습니다.</b> 우측 상단 저장 상태 → <b>JSON 백업 내려받기</b>로 파일 백업을 함께 남겨두세요.${err?` (원인: <code>${escapeHtml(err)}</code>)`:''}${errHint(err)}</span>`;
const READ_FAIL_BANNER = err => `<span>⛔ <b>서버에서 데이터를 불러오지 못했습니다.</b> 빈 데이터로 서버를 덮어쓰는 사고를 막기 위해 자동 정리·샘플 생성은 하지 않습니다. 화면에 보이는 내용은 이 브라우저에 보관된 마지막 사본이며, 15초마다 자동으로 다시 연결을 시도합니다. 편집은 가능하고 연결되면 자동 반영됩니다.${err?` (원인: <code>${escapeHtml(err)}</code>)`:''}${errHint(err)}</span>`;

(async function init(){
  const veil = document.getElementById('loadingVeil');
  const banner = document.getElementById('storageWarningBanner');
  function showBanner(html){ banner.style.display = 'flex'; banner.innerHTML = html; }
  function hideBanner(){ banner.style.display = 'none'; }

  let revealed = false;
  function reveal(){
    if(revealed) return;
    revealed = true;
    veil.style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    try{ renderApp(); }catch(e){}
  }
  setSaveState('init');

  // 1) 이 브라우저에 보관된 마지막 사본으로 즉시 화면을 띄운다 (서버 응답을 기다리지 않음)
  const hadCache = loadLocalCache();
  refreshKnownIds();
  recomputePending();
  if(hadCache){
    reveal();
    setSaveState(SAVE.pending ? 'pending' : 'syncing');
  }
  const hardTimer = setTimeout(reveal, 9000);

  function retryLoop(){
    const timer = setInterval(async ()=>{
      if(!persistenceAvailable()){
        await chooseBackend();
        if(persistenceAvailable()) startRealtime();
      }
      if(!persistenceAvailable()) return;
      const r = await loadFromServer();
      if(!r.ok) return;
      clearInterval(timer);
      hideBanner();
      setSaveState(SAVE.pending ? 'pending' : 'saved');
      if(SAVE.pending) flushNow();
      renderApp();
      showToast('서버와 다시 연결되었습니다. 보관 중이던 변경을 저장합니다.');
    }, 15000);
  }

  try{
    // 2) 저장 백엔드 연결 (아티팩트 저장소 → Firestore → 로컬 전용)
    const connected = await chooseBackend();

    if(!connected){
      // === 서버 저장이 불가능한 경우의 대책: 로컬 전용 모드 ===
      if(!hadCache){
        TICKETS = buildSeedTickets();
        seedHolidayAbsences();
        refreshKnownIds();
        saveLocalCache();
      }
      clearTimeout(hardTimer);
      setSaveState('localonly');
      showBanner(LOCAL_ONLY_BANNER(SAVE.lastError));
      reveal();
      renderApp();
      openTicketFromSharedUrl();
      retryLoop();
      return;
    }

    // 3) 서버에서 읽어와 로컬 사본과 병합
    setSaveState('syncing');
    const r = await loadFromServer();
    clearTimeout(hardTimer);

    if(!r.ok){
      // === 읽기 실패: 이 상태에서는 시드/자동정리 등 어떤 대량 쓰기도 하지 않는다 ===
      setSaveState('readfail');
      showBanner(READ_FAIL_BANNER(r.error));
      reveal();
      renderApp();
      startRealtime();
      openTicketFromSharedUrl();
      retryLoop();
      return;
    }

    hideBanner();

    // 4) 여기서부터는 서버 데이터를 확실히 확인한 상태이므로 초기 정리 작업이 안전하다
    if(TICKETS.length === 0){
      TICKETS = buildSeedTickets();
      seedHolidayAbsences();
      refreshKnownIds();
      await persistTickets(true);
      LAST_EDIT = null;          // 최초 샘플 생성은 '사용자 수정'이 아니므로 기록하지 않는다
      saveLocalCache();
    } else {
      // ★ 새로고침은 '읽기 전용'이다.
      //   상태 자동 전환은 화면 표시용으로만 계산하고 서버에 쓰지 않는다.
      //   서버 쓰기는 오직 (이전 세션에서 못 올린) 로컬 변경이 클라우드와 다를 때만 발생한다.
      autoAdvanceStatuses();
      checkMissingHolidaySeeds();
      recomputePending();
      if(SAVE.pending > 0) await flushNow();
      else setSaveState('saved');
    }

    reveal();
    renderApp();
    startRealtime();
    openTicketFromSharedUrl();
    if(r.migrated) showToast('기존 데이터를 새 저장 구조(티켓별 저장)로 옮겼습니다.');
  }catch(e){
    clearTimeout(hardTimer);
    setSaveState(SAVE.pending ? 'pending' : 'readfail');
    showBanner(`<span>⚠️ 초기화 중 오류가 발생했습니다: <code>${escapeHtml(errMsg(e))}</code> — 데이터는 이 브라우저에 보관되어 있습니다. 새로고침해보시고, 계속되면 이 메시지를 알려주세요.</span>`);
    reveal();
    retryLoop();
  }
})();
</script>
