<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작업 스케줄 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root{
    --bg:#F4F5F7;
    --panel:#FFFFFF;
    --border:#E3E6EB;
    --border-strong:#C7CCD6;
    --text:#181B22;
    --text-dim:#6B7280;
    --text-faint:#9AA1AC;
    --accent:#0F6E63;
    --accent-dark:#0B5951;
    --accent-soft:#E1F3F0;
    --danger:#C43E3E;
    --danger-soft:#FBE7E7;
    --weekend-bg:#EEF0F3;
    --today-bg:#DCEEEB;
    --today-line:#0F6E63;
    --lane-h:38px;
    --shadow: 0 1px 2px rgba(20,22,26,.04), 0 4px 14px rgba(20,22,26,.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:212px; flex:none; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 14px; gap:18px;
  }
  .brand{padding:2px 6px 10px;}
  .brand-title{font-size:16px; font-weight:700; letter-spacing:-.2px;}
  .brand-sub{font-size:12px; color:var(--text-faint); margin-top:3px; line-height:1.4;}
  .new-ticket-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:#fff; border:none; border-radius:9px;
    padding:10px 12px; font-size:13.5px; font-weight:600; cursor:pointer;
    transition:background .15s ease;
  }
  .new-ticket-btn:hover{background:var(--accent-dark);}
  .new-ticket-btn.secondary{background:#fff; color:var(--text-dim); border:1px solid var(--border);}
  .new-ticket-btn.secondary:hover{background:var(--bg); color:var(--text);}
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px;
    color:var(--text-dim); font-weight:500; cursor:pointer; user-select:none; font-size:13.5px;
  }
  .nav-item:hover{background:var(--bg);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent-dark); font-weight:700;}
  .nav-icon{width:16px; text-align:center; font-size:14px;}
  .sidebar-footer{margin-top:auto; padding:10px 6px; font-size:11px; color:var(--text-faint); line-height:1.6; border-top:1px solid var(--border); padding-top:12px;}

  /* ---------- Main ---------- */
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px 26px; border-bottom:1px solid var(--border); background:var(--panel);
  }
  .topbar-left{display:flex; align-items:center; gap:14px;}
  .topbar-actions{display:flex; align-items:center; gap:8px;}
  .topbar-actions .new-ticket-btn{padding:8px 14px; font-size:12.5px;}
  .subbar{
    display:flex; align-items:center; padding:12px 26px; border-bottom:1px solid var(--border); background:var(--panel);
  }
  .view-title{font-size:17px; font-weight:700;}
  .range-nav{display:flex; align-items:center; gap:8px;}
  .range-btn{
    width:30px; height:30px; border-radius:7px; border:1px solid var(--border);
    background:#fff; cursor:pointer; font-size:14px; color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
  }
  .range-btn:hover{background:var(--bg); border-color:var(--border-strong);}
  .range-label{font-size:13.5px; font-weight:600; color:var(--text); min-width:190px; text-align:center;}
  .today-btn{
    border:1px solid var(--border); background:#fff; border-radius:7px; padding:6px 12px;
    font-size:12.5px; font-weight:600; color:var(--text-dim); cursor:pointer;
  }
  .today-btn:hover{background:var(--bg);}
  .today-label-text{font-size:12.5px; color:var(--text-dim); margin-left:6px; white-space:nowrap;}
  .content{flex:1; overflow:auto; padding:22px 26px 60px;}

  /* ---------- Legend ---------- */
  .legend{display:flex; flex-wrap:wrap; gap:10px 16px; margin-bottom:16px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim);}
  .legend-swatch{width:11px; height:11px; border-radius:3px; flex:none;}
  .legend-chip{
    display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:20px;
    font-size:12px; font-weight:700; color:#2A2E35;
  }
  .legend-chip.filterable{cursor:pointer; user-select:none; transition:box-shadow .12s ease, opacity .12s ease;}
  .legend-chip.filterable:hover{box-shadow:0 0 0 2px rgba(20,22,26,.18) inset;}
  .legend-chip.filterable.active{box-shadow:0 0 0 2px rgba(20,22,26,.55) inset;}
  .legend-chip.reset-chip{background:#fff; border:1.5px dashed var(--border-strong); color:var(--text-faint); cursor:pointer;}
  .worker-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; flex:none; box-shadow:0 0 0 1px rgba(20,22,26,.15) inset;}

  /* ---------- Board ---------- */
  .board{background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); overflow:hidden;}
  .board-head{display:grid; grid-template-columns:132px repeat(14,1fr); border-bottom:1px solid var(--border);}
  .board-head-corner{padding:10px 12px; font-size:11.5px; color:var(--text-faint); font-weight:600; border-right:1px solid var(--border);}
  .day-col-head{
    padding:8px 4px; text-align:center; border-right:1px solid var(--border);
    font-size:11.5px; color:var(--text-dim);
  }
  .day-col-head:last-child{border-right:none;}
  .day-col-head.weekend{background:var(--weekend-bg);}
  .day-col-head.today{background:var(--accent); color:#fff;}
  .day-col-head.today .dow{color:rgba(255,255,255,.85);}
  .day-col-head.today .dnum{color:#fff;}
  .day-col-head .dow{font-size:10px; color:var(--text-faint); margin-bottom:2px;}
  .day-col-head .dnum{font-weight:700; font-size:13px;}
  .week-split{border-left:2px solid var(--border-strong) !important;}

  /* ---------- 월간 캘린더 뷰 ---------- */
  .mode-toggle{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-right:14px; flex:none;}
  .mode-btn{border:none; background:#fff; padding:7px 15px; font-size:12.5px; font-weight:700; color:var(--text-dim); cursor:pointer;}
  .mode-btn:not(:last-child){border-right:1px solid var(--border);}
  .mode-btn.active{background:var(--accent); color:#fff;}
  .mode-btn:hover:not(.active){background:var(--bg);}
  .month-head{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--border);}
  .month-head-cell{padding:9px 4px; text-align:center; font-size:11.5px; font-weight:600; color:var(--text-dim); border-right:1px solid var(--border);}
  .month-head-cell:last-child{border-right:none;}
  .month-head-cell.weekend-label{color:#C0392B;}
  .month-week{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--border);}
  .month-week:last-child{border-bottom:none;}
  .month-day-bg{border-right:1px solid var(--border); position:relative;}
  .month-day-bg:last-child{border-right:none;}
  .month-day-bg.weekend{background:var(--weekend-bg);}
  .month-day-bg.today{background:var(--today-bg); box-shadow:inset 1px 0 0 var(--today-line), inset -1px 0 0 var(--today-line);}
  .month-day-bg.out-month{opacity:.4;}
  .month-daynum{position:absolute; top:3px; left:6px; font-size:11px; font-weight:700; color:var(--text-dim);}
  .month-day-bg.today .month-daynum{color:var(--accent-dark);}
  .today-badge{
    display:inline-block; margin-left:4px; background:#C43E3E; color:#fff; font-size:8.5px; font-weight:800;
    padding:1.5px 6px; border-radius:20px; vertical-align:middle; line-height:1.4;
  }
  .ticket-bar.month-bar{margin:2px 2px;}
  .ticket-bar.month-bar.thin{margin:1px 2px;}
  .ticket-bar.month-bar.thin .seg-main{padding:0 5px;}
  .ticket-bar.month-bar.thin .seg-label{font-size:10px; line-height:1.2;}
  .ticket-bar.month-bar.thin .chain-badge{width:11px; height:11px; font-size:7px; top:-4px; right:-3px;}
  .month-bar-assignee{opacity:.75; font-weight:500;}
  .worker-filter-pill{
    display:inline-flex; align-items:center; padding:5px 13px; border-radius:20px; font-size:12px; font-weight:700;
    border:1.5px solid var(--border); background:#fff; color:var(--text-dim); cursor:pointer;
  }
  .worker-filter-pill:hover{background:var(--bg);}
  .worker-filter-pill.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark);}
  .worker-filter-pill.reset{border-style:dashed; color:var(--text-faint);}

  .board-row{display:grid; grid-template-columns:132px 1fr; border-bottom:1px solid var(--border);}
  .board-row:last-child{border-bottom:none;}
  .worker-cell{
    padding:10px 12px; border-right:1px solid var(--border); display:flex; flex-direction:column; justify-content:center; gap:2px;
    background:#FBFBFC;
  }
  .worker-name{font-weight:700; font-size:13.5px;}
  .worker-meta{font-size:10.5px; color:var(--text-faint);}
  .worker-grid{
    position:relative; display:grid; grid-template-columns:repeat(14,1fr);
    grid-auto-rows:var(--lane-h);
  }
  .day-bg{border-right:1px solid var(--border);}
  .day-bg:last-child{border-right:none;}
  .day-bg.weekend{background:var(--weekend-bg);}
  .day-bg.today{background:var(--today-bg); box-shadow:inset 1px 0 0 var(--today-line), inset -1px 0 0 var(--today-line);}

  .ticket-bar{
    margin:3px 3px; border-radius:7px; display:flex; overflow:hidden; cursor:pointer;
    box-shadow:0 1px 1px rgba(0,0,0,.06); position:relative; align-self:stretch;
  }
  .ticket-bar:hover{outline:2px solid rgba(0,0,0,.18); outline-offset:0;}
  .seg{display:flex; align-items:center; min-width:0; height:100%; position:relative;}
  .seg-main{padding:0 7px; color:#2A2E35;}
  .seg-label{font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:relative; z-index:1;}
  .edge-date{font-size:9.5px; font-weight:800; color:#2A2E35; opacity:.75;}
  .edge-date.start-edge{position:absolute; left:5px; top:1px;}
  .edge-date.end-edge{position:absolute; right:5px; top:1px;}
  .chain-badge{
    position:absolute; top:-6px; right:-4px; background:#fff; border:1.5px solid var(--text);
    border-radius:50%; width:15px; height:15px; font-size:9px; display:flex; align-items:center; justify-content:center;
  }
  .absence-bar{
    background-image:repeating-linear-gradient(-45deg, rgba(255,255,255,.38) 0 6px, rgba(255,255,255,.08) 6px 12px) !important;
  }

  /* ---------- Cards / dashboard ---------- */
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media(max-width:980px){.grid-2{grid-template-columns:1fr;}}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px;}
  .card-title{font-size:14px; font-weight:700; margin:0 0 3px;}
  .card-sub{font-size:11.5px; color:var(--text-faint); margin:0 0 14px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-name{width:64px; flex:none; font-size:12.5px; font-weight:600;}
  .bar-track{flex:1; background:var(--bg); border-radius:6px; height:20px; overflow:hidden; position:relative;}
  .bar-fill{height:100%; border-radius:6px; background:var(--accent);}
  .bar-val{width:56px; flex:none; text-align:right; font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums;}

  table.simple{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.compact-matrix{width:auto; min-width:0;}
  table.compact-matrix th, table.compact-matrix td{padding:6px 14px; text-align:center; white-space:nowrap;}
  table.compact-matrix th:first-child, table.compact-matrix td:first-child{text-align:left; padding-left:8px; padding-right:20px;}
  table.simple th{text-align:left; color:var(--text-faint); font-weight:600; font-size:11.5px; padding:6px 8px; border-bottom:1px solid var(--border);}
  table.simple td{padding:8px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
  table.simple tr:last-child td{border-bottom:none;}
  table.simple th.sortable-th{cursor:pointer; user-select:none; white-space:nowrap; background:rgba(15,110,99,.06); border-radius:4px 4px 0 0;}
  table.simple th.sortable-th:hover{color:var(--text-dim); background:rgba(15,110,99,.12);}
  table.simple th.sortable-th .sort-arrow{color:var(--accent-dark); margin-left:3px; font-size:10px;}
  table.simple th.sortable-th .sort-arrow.inactive{color:var(--accent); opacity:.5;}
  table.simple td.cb-cell, table.simple th.cb-cell{width:34px; padding-left:10px; padding-right:0;}
  .ticket-select-cb, #searchSelectAll{width:15px; height:15px; cursor:pointer; margin:0;}
  .search-results-toolbar{display:flex; align-items:center; justify-content:space-between; margin:14px 0 8px; gap:10px; flex-wrap:wrap;}
  .csv-download-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 13px; font-size:12px;}
  .csv-download-btn:disabled{opacity:.45; cursor:not-allowed;}
  .absence-alert-item{display:flex; align-items:center; gap:8px; font-size:14.5px; padding:12px 15px; border-radius:10px; background:var(--bg); margin-bottom:9px;}
  .absence-alert-item:last-child{margin-bottom:0;}
  .absence-alert-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  @media(max-width:820px){.absence-alert-grid{grid-template-columns:1fr;}}
  .absence-alert-heading{font-size:14px; font-weight:800; color:var(--text-dim); margin:0 0 10px;}
  .dday-badge{display:inline-flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent-dark); font-size:12px; font-weight:800; padding:3px 9px; border-radius:20px; flex:none;}
  .proj-chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:20px; color:#fff; white-space:nowrap;}
  .status-chip{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;}
  .status-progress{background:var(--accent-soft); color:var(--accent-dark);}
  .status-upcoming{background:#EAECF0; color:var(--text-dim);}
  .status-done{background:#F1F2F4; color:var(--text-faint);}
  .status-hold{background:#FBEBD3; color:#8A5518;}
  .empty-note{color:var(--text-faint); font-size:12.5px; padding:18px 4px; text-align:center;}
  .deadline-danger{color:var(--danger); font-weight:800;}
  .qty-badge{display:inline-block; font-size:10.5px; font-weight:800; color:var(--accent-dark); background:var(--accent-soft); padding:1px 6px; border-radius:8px; vertical-align:middle;}
  .resource-flag-badge{display:inline-flex; align-items:center; gap:3px; background:var(--accent); color:#fff; font-size:10px; font-weight:800; padding:2px 7px; border-radius:20px; margin-right:6px; white-space:nowrap; vertical-align:middle;}
  tr.tr-resource-alert td{background:var(--accent-soft);}
  .ticket-bar.tb-done{opacity:.5;}
  .ticket-bar.tb-hold{box-shadow:0 0 0 2px var(--border-strong) inset; opacity:.85;}
  @keyframes ticketJumpFlash{
    0%, 100% { box-shadow:0 0 0 0 rgba(232,169,52,0); filter:brightness(1); }
    15% { box-shadow:0 0 0 5px rgba(232,169,52,.95); filter:brightness(1.3); }
    35% { box-shadow:0 0 0 1px rgba(232,169,52,.35); filter:brightness(1.05); }
    55% { box-shadow:0 0 0 5px rgba(232,169,52,.95); filter:brightness(1.3); }
    75% { box-shadow:0 0 0 1px rgba(232,169,52,.3); filter:brightness(1.05); }
  }
  .ticket-jump-highlight{ animation:ticketJumpFlash 1.7s ease-in-out 1; z-index:6; }
  .board-summary{display:grid; grid-template-columns:1.3fr 1fr; gap:18px; margin-top:18px;}
  @media(max-width:980px){.board-summary{grid-template-columns:1fr;}}
  .mini-legend{display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:var(--text-faint); margin-bottom:14px;}
  .mini-legend span b{color:var(--text-dim); font-weight:700;}

  /* ---------- Ticket list view ---------- */
  .list-toolbar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .list-toolbar select, .list-toolbar input{
    border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:12.5px; font-family:inherit; background:#fff;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,22,26,.42); display:none; align-items:flex-start; justify-content:center;
    padding:5vh 16px; z-index:50; overflow:auto;
  }
  .overlay.open{display:flex;}
  .modal{background:#fff; width:100%; max-width:520px; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.25); overflow:hidden;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
  .modal-head h3{margin:0; font-size:15.5px; font-weight:700;}
  .modal-close{border:none; background:none; font-size:18px; color:var(--text-faint); cursor:pointer; line-height:1;}
  .modal-body{padding:20px 22px; max-height:66vh; overflow:auto;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:7px; color:var(--text);}
  .field .hint{font-weight:400; color:var(--text-faint); font-size:11px; margin-left:4px;}
  .field input[type=text], .field input[type=date], .field textarea{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:13px; font-family:inherit;
  }
  .field input:focus, .field textarea:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:60px;}
  .pill-group{display:flex; flex-wrap:wrap; gap:7px;}
  .pill{
    border:1.5px solid var(--border); background:#fff; border-radius:20px; padding:6px 13px;
    font-size:12.5px; font-weight:600; cursor:pointer; color:var(--text-dim);
  }
  .pill.selected{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark);}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .select-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field select{width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 34px 9px 11px; font-size:13px; font-family:inherit; background:#fff; color:var(--text); cursor:pointer;}
  .field select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}
  .repeat-field-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px;}
  .repeat-field-head label{margin-bottom:0;}
  .add-link-btn{width:26px; height:26px; flex:none; border:1px solid var(--border); border-radius:7px; background:#fff; color:var(--accent-dark); font-size:18px; line-height:1; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .add-link-btn:hover{background:var(--accent-soft); border-color:var(--accent);}
  .copy-drive-btn{
    border:1px solid var(--border); background:#fff; border-radius:6px; padding:3px 9px; font-size:11px; font-weight:700;
    color:var(--accent-dark); cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  .copy-drive-btn:hover{background:var(--accent-soft); border-color:var(--accent);}
  .repeat-input-row{display:flex; gap:6px; margin-bottom:7px;}
  .repeat-input-row:last-child{margin-bottom:0;}
  .repeat-input-row input{flex:1; min-width:0;}
  .remove-link-btn{width:34px; flex:none; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text-faint); cursor:pointer; font-size:15px;}
  .remove-link-btn:hover{background:var(--danger-soft); color:var(--danger); border-color:#F3C6C6;}
  .computed-days{
    display:flex; align-items:center; gap:8px; background:var(--bg); border-radius:8px; padding:10px 12px; font-size:12.5px; color:var(--text-dim);
  }
  .computed-days b{color:var(--text); font-size:14px;}
  .form-error{color:var(--danger); font-size:12px; margin-top:8px; display:none;}
  .footer-error{color:var(--danger); font-size:12.5px; font-weight:700; max-width:280px; text-align:right; line-height:1.4;}
  .modal-foot{display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-top:1px solid var(--border); background:#FAFAFB;}
  .btn{border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:none; color:var(--text-dim); border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--bg);}

function loadScriptWithTimeout(src, timeoutMs){
  return new Promise(resolve=>{
    let done = false;
    const finish = ok => { if(done) return; done = true; resolve(ok); };
    const el = document.createElement('script');
    el.src = src;
    el.onload = ()=>finish(true);
    el.onerror = ()=>finish(false);
    document.head.appendChild(el);
    setTimeout(()=>finish(false), timeoutMs);
  });
}

async function initFirebaseIfConfigured(){
  if(!FIREBASE_CONFIG || firebaseInitAttempted) return;

  try{
    const ok1 = await loadScriptWithTimeout('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js', 4000);
    if(!ok1 || typeof firebase === 'undefined') return;
    const ok2 = await loadScriptWithTimeout('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js', 4000);
    if(!ok2 || typeof firebase === 'undefined' || !firebase.firestore) return;
    firebase.initializeApp(FIREBASE_CONFIG);
    firestoreDb = firebase.firestore();
  }catch(e){
    firestoreDb = null;
  }
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(()=>resolve(null), ms))
  ]);
}
async function storageGet(key, shared){
  if(storageAvailable()){
    return withTimeout(window.storage.get(key, shared), 8000);
  }
  if(firestoreDb){
    try{
      const doc = await withTimeout(firestoreDb.collection(FIREBASE_COLLECTION).doc(key).get(), 8000);
      if(doc === null) return null; // 타임아웃 또는 문서 없음
      return doc.exists ? {key, value: doc.data().value, shared} : null;
    }catch(e){ return null; }
  }
  return null;
}
async function storageSet(key, value, shared){
  if(storageAvailable()){
    return withTimeout(window.storage.set(key, value, shared), 8000);
  }
  if(firestoreDb){
    try{
      const res = await withTimeout(firestoreDb.collection(FIREBASE_COLLECTION).doc(key).set({value, updatedAt: Date.now()}), 8000);
      if(res === null) return null; // 타임아웃 (Firestore set()은 정상 시 undefined를 반환하므로 null과 구분됨)
      return {key, value, shared};
    }catch(e){ return null; }
  }
  return null;
}

/* ============================= 날짜 유틸 ============================= */
function parseISO(s){ return new Date(s+'T00:00:00'); }
function toISO(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function isWeekend(d){ const wd=d.getDay(); return wd===0||wd===6; }
function mondayOf(d){ const wd=d.getDay(); const diff=(wd===0?-6:1-wd); return addDays(d,diff); }
function businessDaysBetween(s,e){
  if(!s||!e) return 0;
  let sd=parseISO(s), ed=parseISO(e);
  if(ed<sd) return 0;
  let c=0, cur=new Date(sd);
  while(cur<=ed){ if(!isWeekend(cur)) c++; cur=addDays(cur,1); }
  return c;
}
function calendarDaysBetween(s,e){
  if(!s||!e) return 0;
  let sd=parseISO(s), ed=parseISO(e);
  if(ed<sd) return 0;
  return Math.round((ed-sd)/86400000)+1;
}
// 오프라인 촬영/라이브는 주말에도 실제로 진행되는 경우가 있어, 이런 유형은 주말도 영업일로 계산
const WEEKEND_WORK_TYPES = ['오프라인 촬영','라이브'];
// 특정 날짜(d)가 이 티켓 기준으로 '업무일'인지 판단.
// - 평일이면 항상 업무일
// - 오프라인 촬영/라이브 유형이면 주말도 항상 업무일
// - 그 외에는 티켓에서 체크한 '토요일 출근'/'일요일 출근' 여부에 따라 그 요일만 업무일로 처리
//   (weekendWork는 과거 단일 체크박스였던 데이터와의 하위 호환을 위해 함께 확인)
function isWorkingDayForTicket(d, t){
  const wd = d.getDay();
  if(wd!==0 && wd!==6) return true;
  if(WEEKEND_WORK_TYPES.includes(t.workType)) return true;
  if(wd===6) return !!(t.weekendSat || t.weekendWork);
  if(wd===0) return !!(t.weekendSun || t.weekendWork);
  return false;
}
// 영업일 '계산'에서 하루 단위로 셀 때 쓰는 기준 (시각적 바 이어보이기 판단용인 isWorkingDayForTicket과는 다름).
// 평일은 항상 포함, 촬영/라이브 유형은 주말도 매일 포함하되, '토요일 출근'/'일요일 출근' 체크로 인한 주말은
// 여기서 세지 않고 countWorkingDaysForTicket 마지막에 체크당 +1일만 별도로 더한다.
// (그렇게 안 하면 체크한 요일이 실제로 그 기간에 있을 때 이중으로 계산되어 버림)
function isCountableDayForTicket(d, t){
  const wd = d.getDay();
  if(wd!==0 && wd!==6) return true;
  return WEEKEND_WORK_TYPES.includes(t.workType);
}
// 영업일 계산: 라이브/오프라인 촬영은 주말도 업무일로 치고, 그 외 유형은 평일만 기본 업무일로 본다.
// 하루 단위로 세면서, 같은 날 같은 담당자가 동시에 진행 중인 티켓이 N개면(자기 자신 포함) 그 날은 1일이 아니라 1/N일로 계산한다.
// (2개 겹치면 각각 0.5일, 3개 겹치면 각각 1/3일 ...)
// '토요일 출근'/'일요일 출근' 체크는 기간과 무관하게 체크당 +1일만 추가한다 (겹침 보정과는 별개, 특정 날짜에 묶이지 않는 값이라 겹침 계산 대상 아님).
// 같은 날 같은 담당자가 동시에 진행 중인 티켓(자기 자신 포함)이 몇 개인지 센다.
// 부재는 '작업'이 아니므로 계산에서 제외한다.
function concurrentTicketCountForDay(iso, t){
  if(t.project === '부재' || !t.assignees || !t.assignees.length) return 1;
  let count = 1; // 자기 자신
  TICKETS.forEach(other=>{
    if(other.id === t.id || other.project === '부재') return;
    if(!other.assignees.some(a=> t.assignees.includes(a))) return;
    if(iso >= other.startDate && iso <= other.endDate) count++;
  });
  return count;
}
// 특정 날짜에 해당 담당자가 등록된 부재(휴가) 중인지 확인
function isAssigneeOnLeave(iso, assignee){
  return TICKETS.some(o=> o.project==='부재' && o.assignees.includes(assignee) && iso>=o.startDate && iso<=o.endDate);
}
// 티켓의 담당자 전원이 그 날 부재 중이면(일할 사람이 아무도 없으면) 그 날은 업무일에서 제외한다.
// (담당자가 여럿인 티켓에서 일부만 부재라면, 남은 담당자가 진행할 수 있으므로 그대로 계산한다)
function isTicketBlockedByAbsence(iso, t){
  if(t.project === '부재' || !t.assignees || !t.assignees.length) return false;
  return t.assignees.every(a=> isAssigneeOnLeave(iso, a));
}
// 티켓 기간 [s,e] 안에 특정 요일(targetDow: 0=일,6=토)이 한 번이라도 있는지 확인
function rangeIncludesWeekday(s, e, targetDow){
  let sd=parseISO(s), ed=parseISO(e);
  if(ed<sd) return false;
  let cur = new Date(sd);
  while(cur<=ed){
    if(cur.getDay()===targetDow) return true;
    cur = addDays(cur,1);
  }
  return false;
}
function countWorkingDaysForTicket(s,e,t){
  if(!s||!e) return 0;
  let sd=parseISO(s), ed=parseISO(e);
  if(ed<sd) return 0;
  let days = 0, cur = new Date(sd);
  while(cur<=ed){
    const iso = toISO(cur);
    if(isCountableDayForTicket(cur, t) && !isTicketBlockedByAbsence(iso, t)){
      days += 1 / concurrentTicketCountForDay(iso, t);
    }
    cur = addDays(cur,1);
  }
  // '토요일 출근'/'일요일 출근' 체크는 그 요일이 실제로 이 기간 안에 있을 때만 +1일 적용
  // (기간에 아예 없는 요일을 체크해도 날짜가 늘어나지 않도록)
  if(!WEEKEND_WORK_TYPES.includes(t.workType)){
    if((t.weekendSat || t.weekendWork) && rangeIncludesWeekday(s,e,6)) days += 1;
    if((t.weekendSun || t.weekendWork) && rangeIncludesWeekday(s,e,0)) days += 1;
  }
  return days;
}
function nextBusinessDay(iso){ let d=addDays(parseISO(iso),1); while(isWeekend(d)) d=addDays(d,1); return toISO(d); }
function overlapBD(startISO,endISO,rs,re){
  const s = startISO > rs ? startISO : rs;
  const e = endISO < re ? endISO : re;
  if(s>e) return 0;
  return businessDaysBetween(s,e);
}
function clipRange(s,e,rs,re){
  const cs = s<rs ? rs : s;
  const ce = e>re ? re : e;
  if(cs>ce) return null;
  return [cs,ce];
}
// 티켓 기준으로 '업무일이 아닌 날(쉬는 토/일)'에는 바를 끊어서, 이어지는 업무일 구간별로 나눠 반환한다.
// alwaysContinuous가 true이면(부재) 나누지 않고 통째로 이어서 반환한다.
function splitSegmentsByWorkDays(startISO, endISO, t, alwaysContinuous){
  if(alwaysContinuous) return [[startISO, endISO]];
  const segments = [];
  let curStart = null, prevIso = null;
  let d = parseISO(startISO);
  const end = parseISO(endISO);
  while(d <= end){
    const iso = toISO(d);
    if(isWorkingDayForTicket(d, t)){
      if(curStart === null) curStart = iso;
    } else if(curStart !== null){
      segments.push([curStart, prevIso]); curStart = null;
    }
    prevIso = iso;
    d = addDays(d,1);
  }
  if(curStart !== null) segments.push([curStart, prevIso]);
  // 극단적으로 티켓 기간 전체가 쉬는 날로만 이루어진 경우, 표시가 아예 사라지지 않도록 원래 구간을 그대로 반환
  return segments.length ? segments : [[startISO, endISO]];
}
function monthRange(offset){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+offset;
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  return [toISO(first), toISO(last)];
}
function quarterRange(q, year){
  const startMonth = (q-1)*3;
  const first = new Date(year, startMonth, 1);
  const last = new Date(year, startMonth+3, 0);
  return [toISO(first), toISO(last)];
}
function fmtShort(iso){ const d=parseISO(iso); return `${d.getMonth()+1}/${d.getDate()}`; }
function fmtFull(iso){ const d=parseISO(iso); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; }
function todayISO(){ return toISO(new Date()); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= 한글 조사 처리 (분기 피드백 텍스트용) ============================= */
function hasBatchim(str){
  if(!str) return false;
  const ch = str[str.length-1];
  const code = ch.charCodeAt(0);
  if(code < 0xAC00 || code > 0xD7A3) return false;
  return (code - 0xAC00) % 28 !== 0;
}
function josa(word, withBatchim, withoutBatchim){
  return hasBatchim(word) ? withBatchim : withoutBatchim;
}

/* ============================= 담당자 분기 피드백 텍스트 생성 ============================= */
function buildQuarterFeedbackText(worker, tickets, start, end){
  const lines = [];
  const header = `[${worker} 작업 내역] ${fmtFull(start)} ~ ${fmtFull(end)}`;
  lines.push(header, '');

  if(!tickets.length){
    lines.push(`해당 기간 동안 ${worker}${josa(worker,'은','는')} 등록된 작업 티켓이 없습니다.`);
    return lines.join('\n');
  }

  // 티켓 1건의 수량(qty)을 건수에 그대로 반영 (예: 숏폼 1티켓에 3종이 묶여있으면 3건으로 집계)
  const qtyOf = t => t.qty || 1;

  // 프로젝트별로 묶기 (등장 순서 유지)
  const projectOrder = [];
  const byProject = {};
  tickets.forEach(t=>{
    if(!byProject[t.project]){ byProject[t.project] = []; projectOrder.push(t.project); }
    byProject[t.project].push(t);
  });

  const projectNameList = projectOrder.join(', ');
  lines.push(`${worker}${josa(worker,'은','는')} 이번 기간 동안 ${projectNameList} 업무를 진행하였습니다.`);
  lines.push('');

  // ---- 프로젝트별 단락 ----
  projectOrder.forEach(project=>{
    const projTickets = byProject[project];
    const projectQtyTotal = projTickets.reduce((sum,t)=> sum+qtyOf(t), 0);

    // 업무 유형별로 묶기 (등장 순서 유지)
    const typeOrder = [];
    const byType = {};
    projTickets.forEach(t=>{
      const wt = t.workType || '기타';
      if(!byType[wt]){ byType[wt] = []; typeOrder.push(wt); }
      byType[wt].push(t);
    });

    lines.push(`■ ${project} (총 ${projectQtyTotal}건)`);
    typeOrder.forEach(wt=>{
      const ts = byType[wt];
      const qty = ts.reduce((sum,t)=> sum+qtyOf(t), 0);
      const titleList = ts.map(t=> `'${t.title}'${qtyOf(t)>1?`(${qtyOf(t)}종)`:''}`).join(', ');
      lines.push(`  - ${wt} ${qty}건: ${titleList}`);
    });
    lines.push('');
  });

  // ---- 기간 내 작업 유형별 평균 소요 영업일 ----
  const typeOrderAll = [];
  const byTypeAll = {};
  tickets.forEach(t=>{
    const wt = t.workType || '기타';
    if(!byTypeAll[wt]){ byTypeAll[wt] = []; typeOrderAll.push(wt); }
    byTypeAll[wt].push(t);
  });

  lines.push(`[이 기간 작업 유형별 평균 소요 영업일]`);
  typeOrderAll.forEach(wt=>{
    const ts = byTypeAll[wt];
    const totalDays = ts.reduce((sum,t)=> sum+expectedWorkDays(t), 0);
    const totalQty = ts.reduce((sum,t)=> sum+qtyOf(t), 0);
    const avg = totalQty ? totalDays/totalQty : 0;
    lines.push(`  - ${wt}: 평균 ${fmtDays(avg)}영업일 (총 ${totalQty}건)`);
  });

  return lines.join('\n');
}
function qtyBadge(t){

  if(n===null || n===undefined || isNaN(n)) return '-';
  const rounded = Math.round(n*10)/10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

const STATUS_LIST = ['예정','작업중','완료','보류'];
const STATUS_COLORS = { '예정':'#6B7280', '작업중':'#0F6E63', '완료':'#9AA1AC', '보류':'#B8790F' };
const STATUS_CHIP_CLASS = { '예정':'status-upcoming', '작업중':'status-progress', '완료':'status-done', '보류':'status-hold' };

function ticketStatus(t){
  if(t.status) return t.status;
  // 하위 호환: 상태값이 없는 과거 티켓은 날짜 기준으로 추정
  const today = todayISO();
  if(today < t.startDate) return '예정';
  if(today > t.endDate) return '완료';
  return '작업중';
}
function autoAdvanceStatuses(){
  // 시작일이 오늘이거나 이미 지난 '예정' 티켓은 자동으로 '작업중'으로 전환.
  // 완료/보류로의 전환은 여전히 사람이 직접 해야 함 (자동으로 완료 처리하지 않음).
  // 단, 부재는 예외 - 마감일이 지나면 사람이 손댈 필요 없이 자동으로 '완료' 처리한다.
  const today = todayISO();
  let changed = false;
  TICKETS.forEach(t=>{
    if(t.status === '예정' && t.startDate <= today){
      t.status = '작업중';
      t.updatedAt = new Date().toISOString();
      changed = true;
    }
    if(t.project === '부재' && t.status !== '완료' && t.endDate < today){
      t.status = '완료';
      t.updatedAt = new Date().toISOString();
      changed = true;
    }
  });
  return changed;
}
function statusChipHtml(status){
  return `<span class="status-chip ${STATUS_CHIP_CLASS[status]||'status-upcoming'}">${status}</span>`;
}
function actualBusinessDays(t){
  if(!t.actualEndDate) return null;
  return countWorkingDaysForTicket(t.startDate, t.actualEndDate, t);
}
function expectedWorkDays(t){
  // 리소스 마감일이 있으면, 리소스가 준비된 다음 영업일부터 실제 제작이 시작되는 것으로 계산
  const rangeStart = t.resourceDeadline ? nextBusinessDay(t.resourceDeadline) : t.startDate;
  return countWorkingDaysForTicket(rangeStart, t.endDate, t);

function isDrivePathLike(val){

  return !/^https?:\/\//i.test(val) && /\\/.test(val);

function renderResourceField(val, label){
  label = label || '리소스';
  if(Array.isArray(val)){
    const vals = val.filter(Boolean);
    if(!vals.length) return '-';
    return vals.map((v,i)=> renderResourceField(v, vals.length>1 ? `${label}${i+1}` : label)).join('<br>');
  }
  if(!val) return '-';
  const trimmed = val.trim();
  if(/^https?:\/\//i.test(trimmed)){
    return `<a href="${escapeHtml(trimmed)}" target="_blank" rel="noopener" style="color:var(--accent-dark); font-weight:700; text-decoration:none;">🔗 ${escapeHtml(label)}</a>`;
  }
  if(isDrivePathLike(trimmed)){
    return `<button type="button" class="copy-drive-btn" data-copy="${escapeHtml(trimmed)}" title="${escapeHtml(trimmed)}">📁 드라이브 주소 복사</button>`;
  }
  return escapeHtml(trimmed);
}

/* ============================= CSV 내보내기 ============================= */
function csvEscape(val){
  const s = String(val ?? '');
  if(/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function downloadCSV(filename, headers, rows){
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(r=> lines.push(r.map(csvEscape).join(',')));
  // 엑셀에서 한글이 깨지지 않도록 BOM 추가
  const csvContent = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}
function plainField(val){
  if(Array.isArray(val)) return val.filter(Boolean).join(' | ');
  return val || '';
}
const CSV_HEADERS = ['제목','프로젝트','업무 유형','담당자','시작일','마감일','예상 작업일수','상태','리소스','레퍼런스','SB·기획','사이즈·포맷'];

function storageAvailable(){
  return !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function');
}
let lastPersistAt = 0;
async function persistTickets(immediate){
  if(!persistenceAvailable()) return false;
  // 저장 API 호출이 너무 잦으면 일시적으로 실패할 수 있어, 최소 간격을 두고 호출
  // (삭제처럼 드물고 의도적인 동작은 즉시 처리)
  if(!immediate){
    const MIN_INTERVAL = 300;
    const wait = lastPersistAt + MIN_INTERVAL - Date.now();
    if(wait > 0) await new Promise(r=>setTimeout(r, wait));
  }
  lastPersistAt = Date.now();
  try{
    const res = await storageSet(STORAGE_KEY, JSON.stringify(TICKETS), true);
    if(!res) throw new Error('no result');
    return true;
  }catch(e){
    return false;
  }
}

async function copyTextToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ document.execCommand('copy'); ok = true; }catch(e2){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
}

/* ============================= 연속 작업(체인) 계산 ============================= */
function computeChains(){
  const chainOf = {}; // ticketId -> {chainId, index, size}
  WORKERS.forEach(w=>{
    const ts = TICKETS.filter(t=>t.assignees.includes(w)).slice().sort((a,b)=>a.startDate<b.startDate?-1:1);
    let chainId = 0, chainMembers = [];
    function flush(){
      if(chainMembers.length>1){
        chainMembers.forEach((t,i)=>{ chainOf[t.id] = {index:i+1, size:chainMembers.length}; });
      }
      chainMembers = [];
    }
    let prev = null;
    ts.forEach(t=>{
      if(prev && t.startDate === nextBusinessDay(prev.endDate)){
        chainMembers.push(t);
      } else {
        flush();
        chainMembers = [t];
      }
      prev = t;
    });
    flush();
  });
  return chainOf;
}

/* ============================= 레인 배치(겹침 방지) ============================= */
function assignLanes(ticketsForWorker, rangeStartISO, rangeEndISO){
  // range of each ticket (사전 작업 기간 제거됨: 시작일~마감일만 사용)
  const items = ticketsForWorker
    .map(t=>({t, rs:t.startDate, re:t.endDate}))
    .filter(x=> x.re>=rangeStartISO && x.rs<=rangeEndISO)
    .sort((a,b)=> a.rs<b.rs?-1:1);
  const lanes = []; // lane end date
  const result = [];
  items.forEach(item=>{
    let laneIdx = lanes.findIndex(end => end < item.rs);
    if(laneIdx === -1){ laneIdx = lanes.length; lanes.push(item.re); }
    else { lanes[laneIdx] = item.re; }
    result.push({...item, lane:laneIdx});
  });
  const maxLanes = Math.max(1, lanes.length);
  return {items:result, maxLanes};
}

    document.getElementById('modeMonth').onclick = ()=>{ boardMode='month'; renderApp(); };
    if(boardMode==='twoWeek'){
      document.getElementById('prevRange').onclick = ()=>{ anchorMonday = addDays(anchorMonday,-14); renderApp(); };
      document.getElementById('nextRange').onclick = ()=>{ anchorMonday = addDays(anchorMonday,14); renderApp(); };
      document.getElementById('todayRange').onclick = ()=>{ anchorMonday = mondayOf(new Date()); renderApp(); };
    } else {
      document.getElementById('prevMonth').onclick = ()=>{ monthAnchor = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth()-1, 1); renderApp(); };
      document.getElementById('nextMonth').onclick = ()=>{ monthAnchor = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth()+1, 1); renderApp(); };
      document.getElementById('todayMonth').onclick = ()=>{ monthAnchor = new Date(); renderApp(); };
    }
  }
  renderContent();
}

// 그 날짜에 해당 담당자에게 적용되는(부재 제외, 주말 출근 체크 반영) 티켓 id 목록
function mobileWorkerTicketIdsOnDate(worker, iso, dateObj){
  return TICKETS.filter(t=> t.project!=='부재' && t.assignees.includes(worker) && t.startDate<=iso && t.endDate>=iso && isWorkingDayForTicket(dateObj, t)).map(t=>t.id);
}
// 담당자 전원이 걸린 부재(공휴일 등 전체 휴가)인지 확인
function mobileIsCompanyWideHoliday(iso){
  return TICKETS.some(t=> t.project==='부재' && t.assignees && t.assignees.length===WORKERS.length && t.startDate<=iso && t.endDate>=iso);
}
// 제목이 '오전/오후 휴가·반차' 같은 반차(半日)인지 확인 (반차가 아니면 전일 휴가로 간주)
function isHalfDayAbsenceTitle(title){
  return /(오전|오후)\s*(휴가|반차)/.test(title || '');
}
// 해당 담당자가 그 날짜에 '전일(하루 종일)' 개인 부재인지 확인 (반차는 제외, 공통휴가는 별도 처리)
function mobileWorkerFullDayAbsenceOnDate(worker, iso){
  return TICKETS.some(t=> t.project==='부재' && t.assignees.includes(worker) && t.startDate<=iso && t.endDate>=iso && !isHalfDayAbsenceTitle(t.title));
}
// hex 색상을 밝게(+percent) 또는 어둡게(-percent) 조정
function shadeHexColor(hex, percent){
  const num = parseInt(hex.slice(1), 16);
  let r = (num>>16)&0xFF, g=(num>>8)&0xFF, b=num&0xFF;
  if(percent >= 0){
    r = r + (255-r)*percent/100;
    g = g + (255-g)*percent/100;
    b = b + (255-b)*percent/100;
  } else {
    const p = -percent;
    r = r*(1-p/100);
    g = g*(1-p/100);
    b = b*(1-p/100);
  }
  const clamp = v=> Math.max(0, Math.min(255, Math.round(v)));
  return `#${clamp(r).toString(16).padStart(2,'0')}${clamp(g).toString(16).padStart(2,'0')}${clamp(b).toString(16).padStart(2,'0')}`;
}
// 겹치는 티켓 수에 따라 담당자 기본색의 톤을 달리한다 (1개=연한 톤, 2개=기본 톤, 3개 이상=진한 톤)
function mobileOverlapShade(baseColor, count){
  if(count <= 1) return shadeHexColor(baseColor, 45);
  if(count === 2) return baseColor;
  return shadeHexColor(baseColor, -35);
}

function renderMobileMonthGrid(){
  if(!mobileMonthAnchor) mobileMonthAnchor = new Date();
  const year = mobileMonthAnchor.getFullYear(), month = mobileMonthAnchor.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOfGrid = addDays(firstOfMonth, -firstOfMonth.getDay());
  const today = todayISO();

  const weeks = [];
  let cur = startOfGrid;
  for(let w=0; w<6; w++){
    const week = [];
    for(let d=0; d<7; d++){ week.push(cur); cur = addDays(cur, 1); }
    weeks.push(week);
  }

  const weeksHtml = weeks.map(week=>{
    // 날짜별 배경 셀 (탭하면 그 날짜의 일별 일정 팝업이 뜸)
    const bgCells = week.map((d,i)=>{
      const iso = toISO(d);
      const inMonth = d.getMonth()===month;
      const cls = ['mmw-bg'];
      if(!inMonth) cls.push('out-month');
      if(iso===today) cls.push('today');
      return `<div class="${cls.join(' ')}" data-date="${iso}" style="grid-column:${i+1}; grid-row:1 / span 5;"></div>`;
    }).join('');

    const numCells = week.map((d,i)=>{
      const iso = toISO(d);
      return `<div class="mmw-num ${iso===today?'today':''}" style="grid-column:${i+1}; grid-row:1;">${d.getDate()}</div>`;
    }).join('');

    // 전체 휴가(공휴일, 담당자 전원)는 큰 야자수 아이콘 하나로 모든 레인을 덮어 표시
    const holidayCells = week.map((d,i)=>{
      const iso = toISO(d);
      if(!mobileIsCompanyWideHoliday(iso)) return '';
      return `<div class="mmw-holiday" style="grid-column:${i+1}; grid-row:2 / span 4;" title="공휴일">🌴</div>`;
    }).join('');

    // 개인 부재(반차 제외, 공통휴가 제외): 1일이면 🌙 아이콘, 2일 이상 이어지면 검은 바 + '병가' 라벨로 표시
    const personalAbsenceCells = [];
    WORKERS.forEach((w, wi)=>{
      let runStart = null;
      const isPersonalFullDayOff = (i)=>{
        const d = week[i];
        if(!d) return false;
        const iso = toISO(d);
        if(mobileIsCompanyWideHoliday(iso)) return false;
        return mobileWorkerFullDayAbsenceOnDate(w, iso);
      };
      for(let i=0;i<=7;i++){
        const active = i<7 && isPersonalFullDayOff(i);
        if(active){
          if(runStart===null) runStart = i;
        } else if(runStart!==null){
          const len = i - runStart;
          if(len >= 2){
            personalAbsenceCells.push(`<div class="mmw-sick-bar" style="grid-column:${runStart+1} / ${i+1}; grid-row:${2+wi};" title="${escapeHtml(w)} 장기 휴가/병가"><span class="mmw-sick-bar-label">병가</span></div>`);
          } else {
            personalAbsenceCells.push(`<div class="mmw-holiday mmw-holiday-lane" style="grid-column:${runStart+1}; grid-row:${2+wi};" title="${escapeHtml(w)} 휴가">🌙</div>`);
          }
          runStart = null;
        }
      }
    });

    // 담당자별로, 실제 티켓의 시작일·마감일 경계에서 바를 끊는다.
    // 겹치는 티켓 구성(집합)이 전날과 완전히 같을 때만 이어붙이고, 하나라도 시작/종료되면(전일 개인 휴가로 막히는 경우 포함) 새 구간으로 분리한다.
    const bars = [];
    WORKERS.forEach((w, wi)=>{
      let segStart = null, segKey = null, segCount = 0;
      const flush = (endIdx)=>{
        if(segStart===null) return;
        bars.push({wi, start:segStart, end:endIdx-1, count:segCount});
        segStart = null; segKey = null; segCount = 0;
      };
      for(let i=0;i<=7;i++){
        const d = i<7 ? week[i] : null;
        const iso = d ? toISO(d) : null;
        const blocked = d ? (mobileIsCompanyWideHoliday(iso) || mobileWorkerFullDayAbsenceOnDate(w, iso)) : true;
        const ids = (d && !blocked) ? mobileWorkerTicketIdsOnDate(w, iso, d) : [];
        const key = ids.length ? ids.slice().sort().join(',') : null;
        if(key===null){
          flush(i);
        } else if(segKey===null){
          segStart = i; segKey = key; segCount = ids.length;
        } else if(key!==segKey){
          flush(i);
          segStart = i; segKey = key; segCount = ids.length;
        }
        // key===segKey인 경우: 같은 티켓 구성이 계속 이어지는 중이므로 구간을 그대로 유지
      }
    });
    const barsHtml = bars.map(r=>{
      const base = WORKER_COLORS[WORKERS[r.wi]] || '#999';
      const color = mobileOverlapShade(base, r.count);
      return `<div class="mmw-bar" style="grid-column:${r.start+1} / ${r.end+2}; grid-row:${2+r.wi}; background:${color};" title="${r.count}건 겹침"></div>`;
    }).join('');

    return `<div class="mobile-month-week">${bgCells}${barsHtml}${personalAbsenceCells.join('')}${holidayCells}${numCells}</div>`;
  }).join('');

  return `
    <div class="mobile-month-header">
      <button type="button" class="mobile-nav-btn" id="mPrevMonth">‹</button>
      <div class="mobile-date-label">${year}.${String(month+1).padStart(2,'0')}</div>
      <button type="button" class="mobile-nav-btn" id="mNextMonth">›</button>
      <button type="button" class="mobile-today-goto-btn" id="mobileThisMonthBtn">이번달</button>
    </div>
    <div class="mobile-month-legend">
      ${WORKERS.map(w=>`<span class="mobile-month-legend-item">${workerDot(w)}${w}</span>`).join('')}
      <span class="mobile-month-legend-item">🌴 공휴일</span>
      <span class="mobile-month-legend-item">🌙 개인 휴가</span>
      <span class="mobile-month-legend-item"><span style="display:inline-block; width:9px; height:9px; border-radius:2px; background:#5A5F68;"></span> 병가/장기휴가</span>
    </div>
    <div class="mobile-month-dow-row">${DOW_LABEL.map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="mobile-month-weeks">${weeksHtml}</div>
  `;
}

function renderMobileInProgressCards(list){
  const today = todayISO();

  const cards = list.map(t=>{
    const status = ticketStatus(t);

    const dueToday = t.endDate === today;
    const cls = [needsResourceCheck?'tr-resource-alert-card':'', dueToday?'tr-due-today-card':''].filter(Boolean).join(' ');

    return `<div class="mobile-ticket-card ${cls}" data-id="${t.id}">

function renderMobileAbsenceView(){
  const today = todayISO();
  const weekEnd = toISO(addDays(new Date(), 7));
  const todaysAbsences = TICKETS.filter(t=> t.project==='부재' && t.startDate<=today && t.endDate>=today)
    .sort((a,b)=> a.startDate<b.startDate?-1:1);
  const upcomingAbsences = TICKETS.filter(t=> t.project==='부재' && t.startDate>today && t.startDate<=weekEnd)
    .sort((a,b)=> a.startDate<b.startDate?-1:1);
  const filtered = TICKETS.filter(t=>{
    if(t.project !== '부재') return false;
    if(mobileAbsenceHideShared && t.assignees && t.assignees.length === WORKERS.length) return false;
    if(mobileAbsenceWorkerFilter && !t.assignees.includes(mobileAbsenceWorkerFilter)) return false;
    return true;
  }).sort((a,b)=> absenceSortComparator(a,b));

  return `
    <div class="card" style="margin-bottom:14px;">
      <p class="absence-alert-heading">📍 오늘 부재</p>
      ${todaysAbsences.length ? todaysAbsences.map(t=>`<div class="absence-alert-item">${t.assignees.map(a=>workerDot(a)+escapeHtml(a)).join(', ')} <span style="color:var(--text-faint);">· ${escapeHtml(t.title)}</span></div>`).join('') : `<div class="empty-note" style="margin:0;">오늘 부재 인원이 없습니다.</div>`}
      <p class="absence-alert-heading" style="margin-top:14px;">📅 부재 예정 (7일 이내)</p>
      ${upcomingAbsences.length ? upcomingAbsences.map(t=>{
        const dDay = Math.round((parseISO(t.startDate)-parseISO(today))/86400000);
        return `<div class="absence-alert-item"><span class="dday-badge">D-${dDay}</span> ${t.assignees.map(a=>workerDot(a)+escapeHtml(a)).join(', ')} <span style="color:var(--text-faint);">· ${absenceDateRangeShort(t)} · ${escapeHtml(t.title)}</span></div>`;
      }).join('') : `<div class="empty-note" style="margin:0;">일주일 이내 예정된 부재가 없습니다.</div>`}
    </div>
    <div class="pill-group" id="mobileAbsenceWorkerPills" style="margin-bottom:10px;">
      ${WORKERS.map(w=>`<div class="pill ${mobileAbsenceWorkerFilter===w?'selected':''}" data-worker="${w}">${workerDot(w)}${w}</div>`).join('')}
      ${mobileAbsenceWorkerFilter ? `<div class="pill" id="mobileResetAbsenceWorker" style="border-style:dashed; color:var(--text-faint);">전체 보기</div>` : ''}
    </div>
    <label style="display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:12px; cursor:pointer;">
      <input type="checkbox" id="mobileHideSharedCb" ${mobileAbsenceHideShared?'checked':''} style="width:15px; height:15px; margin:0;">
      공통휴가(전 직원 부재) 숨기기
    </label>
    <p style="font-size:12px; color:var(--text-dim); margin:0 0 8px;">총 ${filtered.length}건</p>
    ${filtered.length ? filtered.map(t=>`
      <div class="mobile-ticket-card" data-id="${t.id}">
        <div class="mobile-ticket-card-title">${escapeHtml(t.title)}</div>
        <div class="mobile-ticket-card-meta">${escapeHtml(mobileAbsenceAssigneeLabel(t))} · ${mobileAbsenceDateRangeText(t)}</div>
      </div>`).join('') : `<div class="empty-note">등록된 부재가 없습니다.</div>`}
  `;
}

function boardLegendHtml(showTypeColors){
  if(showTypeColors === undefined) showTypeColors = true;
  const chipStyle = wt => showTypeColors
    ? `background:${WORK_TYPE_COLORS[wt]};`
    : `background:#fff; border:1.5px solid var(--border); color:var(--text-dim);`;
  const noTypeStyle = showTypeColors
    ? `background:${NO_TYPE_COLOR};`
    : `background:#fff; border:1.5px solid var(--border); color:var(--text-dim);`;
  return `<div class="legend" id="boardTypeLegend">${WORK_TYPES.map(wt=>`
      <span class="legend-chip filterable ${boardTypeFilters.includes(wt)?'active':''}" data-type="${wt}" style="${chipStyle(wt)}">${WORK_TYPE_ICONS[wt]} ${wt}</span>`).join('')}
      <span class="legend-chip filterable ${boardTypeFilters.includes(ABSENCE_FILTER_KEY)?'active':''}" data-type="${ABSENCE_FILTER_KEY}" style="${noTypeStyle}">부재</span>
      ${boardTypeFilters.length ? `<span class="legend-chip reset-chip" id="resetBoardTypeFilter">전체 보기</span>` : ''}
    </div>`;
}
function wireBoardTypeFilter(){
  const legend = document.getElementById('boardTypeLegend');
  if(!legend) return; // 보드 화면이 아닐 때는 존재하지 않음
  legend.querySelectorAll('.legend-chip[data-type]').forEach(el=>{
    el.onclick = ()=>{
      const wt = el.dataset.type;
      const idx = boardTypeFilters.indexOf(wt);
      if(idx>-1) boardTypeFilters.splice(idx,1); // 이미 선택된 유형을 다시 누르면 해제
      else boardTypeFilters.push(wt); // 연달아 누르면 추가로 선택되어 함께 표시됨
      renderContent();
    };
  });
  const resetBtn = document.getElementById('resetBoardTypeFilter');
  if(resetBtn) resetBtn.onclick = ()=>{ boardTypeFilters = []; renderContent(); };
}

function renderBoard(){
  return boardMode==='month' ? renderMonthBoard() : renderTwoWeekBoard();
}

function renderTwoWeekBoard(){
  const days = Array.from({length:14}, (_,i)=> addDays(anchorMonday,i));
  const rangeStart = toISO(days[0]), rangeEnd = toISO(days[13]);
  const today = todayISO();
  const chains = computeChains();

  const legend = boardLegendHtml();

  const head = `
    <div class="board-head">
      <div class="board-head-corner">작업자</div>
      ${days.map((d,i)=>{
        const iso = toISO(d);
        const cls = ['day-col-head'];
        if(isWeekend(d)) cls.push('weekend');
        if(iso===today) cls.push('today');
        if(i===7) cls.push('week-split');
        return `<div class="${cls.join(' ')}"><div class="dow">${DOW_LABEL[d.getDay()]}</div><div class="dnum">${d.getMonth()+1}/${d.getDate()}</div></div>`;
      }).join('')}
    </div>`;

  const rows = WORKERS.map(w=>{
    const wTickets = TICKETS.filter(t=>t.assignees.includes(w) && matchesBoardTypeFilter(t));
    const {items, maxLanes} = assignLanes(wTickets, rangeStart, rangeEnd);
    const rowHeight = maxLanes * 38 + 6;

    const bgCells = days.map((d,i)=>{
      const iso = toISO(d);
      const cls=['day-bg'];
      if(isWeekend(d)) cls.push('weekend');
      if(iso===today) cls.push('today');
      return `<div class="${cls.join(' ')}" style="grid-row:1 / span ${maxLanes}; grid-column:${i+1}"></div>`;
    }).join('');

    const bars = items.map(({t,lane})=>{
      const idxOf = iso => Math.round((parseISO(iso)-parseISO(rangeStart))/86400000);

      const color = t.workType ? (WORK_TYPE_COLORS[t.workType] || '#666') : NO_TYPE_COLOR;
      const chain = chains[t.id];
      const isAbsence = t.project === '부재';
      const status = ticketStatus(t);
      const statusCls = status==='완료' ? 'tb-done' : status==='보류' ? 'tb-hold' : '';
      const days_bd = expectedWorkDays(t);
      const actual = actualBusinessDays(t);

      const title = `${t.title} · ${t.project}${t.workType?' · '+t.workType:''} · ${status} · ${fmtFull(t.startDate)}~${fmtFull(t.endDate)}${isAbsence?'':` (예상 ${fmtDays(days_bd)}영업일${status==='완료'&&actual!==null?`, 실제 ${fmtDays(actual)}영업일`:''})`}${t.resourceDeadline?` · 리소스 마감 ${fmtFull(t.resourceDeadline)}`:''}${t.spec?` · 사양: ${t.spec}`:''}`;

      // 부재를 포함한 모든 티켓은 주말(비근무일)에 바가 끊기고, '주말 출근 필요' 체크가 있을 때만 이어서 표기
      const segments = splitSegmentsByWorkDays(t.startDate, t.endDate, t, false);

      return segments.map((seg, segIdx)=>{
        const clip = clipRange(seg[0], seg[1], rangeStart, rangeEnd);
        if(!clip) return '';
        const totalStartIdx = idxOf(clip[0]);
        const totalEndIdx = idxOf(clip[1]);
        const isFirstSeg = segIdx===0, isLastSeg = segIdx===segments.length-1;
        const showStartBold = isFirstSeg && t.startDate >= rangeStart && t.startDate <= rangeEnd;
        const showEndBold = isLastSeg && t.endDate >= rangeStart && t.endDate <= rangeEnd;

        return `
          <div class="ticket-bar ${statusCls}" data-id="${t.id}" title="${escapeHtml(title)}"
               style="grid-column:${totalStartIdx+1} / ${totalEndIdx+2}; grid-row:${lane+1};">
            <div class="seg seg-main ${isAbsence?'absence-bar':''}" style="flex:1 0 0; background:${color};">
              ${showStartBold ? `<span class="edge-date start-edge">${fmtShort(t.startDate)}</span>` : ''}
              <span class="seg-label" style="margin-top:9px;">${t.workType?WORK_TYPE_ICONS[t.workType]+' ':''}<b>[${escapeHtml(t.project)}]</b> ${(isAbsence && t.assignees && t.assignees.length===1) ? escapeHtml(t.assignees[0])+' ' : ''}${escapeHtml(t.title)}${qtyBadge(t)}</span>
              ${showEndBold ? `<span class="edge-date end-edge">${fmtShort(t.endDate)}</span>` : ''}
            </div>
            ${(isLastSeg && chain) ? `<span class="chain-badge" title="연속 작업 ${chain.index}/${chain.size}">🔗</span>` : ''}
          </div>`;
      }).join('');
    }).join('');

    return `
      <div class="board-row">
        <div class="worker-cell" style="min-height:${rowHeight}px;">
          <div class="worker-name">${w}</div>
          <div class="worker-meta">${wTickets.length}건 등록</div>
        </div>
        <div class="worker-grid" style="grid-auto-rows:38px; min-height:${rowHeight}px;">
          ${bgCells}
          ${bars}
        </div>
      </div>`;
  }).join('');

  return `${legend}<div class="board">${head}${rows}</div>${renderBoardSummary()}`;
}

function renderMonthBoard(){
  const year = monthAnchor.getFullYear();
  const month = monthAnchor.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const lastOfMonth = new Date(year, month+1, 0);
  const startOfGrid = addDays(firstOfMonth, -firstOfMonth.getDay());
  const totalDays = Math.ceil((Math.round((lastOfMonth - startOfGrid)/86400000) + 1) / 7) * 7;
  const gridDays = Array.from({length: totalDays}, (_,i)=> addDays(startOfGrid, i));
  const weeks = [];
  for(let i=0; i<gridDays.length; i+=7) weeks.push(gridDays.slice(i, i+7));

  const today = todayISO();
  const chains = computeChains();
  const legend = boardLegendHtml(!!monthFilterWorker);
  const ticketPool = TICKETS.filter(t=>
    (!monthFilterWorker || t.assignees.includes(monthFilterWorker)) &&
    matchesBoardTypeFilter(t)
  );
  // 전체보기(작업자 필터 없음)에서 담당자가 2명 이상인 티켓(부재 제외)은, 한 바 안에서 색상을 나누는 대신
  // 담당자별로 완전히 분리된 바(각자 별도의 레인)로 표시되도록 담당자 수만큼 항목을 나눠준다.
  const expandedTicketPool = ticketPool.flatMap(t=>{
    if(!monthFilterWorker && t.project!=='부재' && t.assignees.length>1){
      return t.assignees.map(a=> ({...t, assignees:[a]}));
    }
    return [t];
  });

  // 전체보기(작업자 필터 없음)일 때만 필터 칩 자체에 담당자 바 색상을 입혀서 범례를 대신한다.
  // 특정 작업자를 선택하면 바 색상이 업무 유형 기준으로 바뀌므로, 이때는 필터 칩에서 담당자 색을 빼고
  // 상단 업무 유형 범례(boardLegendHtml)의 색상이 그 역할을 하도록 한다.
  const showWorkerColorOnPills = !monthFilterWorker;
  const workerFilter = `
    <div class="legend" style="margin-top:-4px;">
      <span style="font-size:11.5px; color:var(--text-faint); margin-right:2px;">작업자 필터:</span>
      ${WORKERS.map(w=>{
        const isActive = monthFilterWorker===w;
        const colorStyle = (showWorkerColorOnPills && !isActive) ? `background:${WORKER_COLORS[w]}; border-color:${WORKER_COLORS[w]}; color:#2A2E35;` : '';
        return `<span class="worker-filter-pill ${isActive?'active':''}" data-worker="${w}" style="${colorStyle}">${w}</span>`;
      }).join('')}
      ${monthFilterWorker ? `<span class="worker-filter-pill reset" id="resetWorkerFilter">전체 보기</span>` : ''}
    </div>`;

  const head = `
    <div class="month-head">
      ${DOW_LABEL.map((d,i)=>`<div class="month-head-cell ${i===0||i===6?'weekend-label':''}">${d}</div>`).join('')}
    </div>`;

  const weekRows = weeks.map(week=>{
    const wsISO = toISO(week[0]), weISO = toISO(week[6]);
    const { items, maxLanes } = assignLanes(expandedTicketPool, wsISO, weISO);
    const laneHeight = monthFilterWorker ? 38 : 22;
    const rowTemplate = `24px repeat(${maxLanes}, ${laneHeight}px)`;

    const bgCells = week.map((d,i)=>{
      const iso = toISO(d);
      const inMonth = d.getMonth() === month;
      const cls = ['month-day-bg'];
      if(isWeekend(d)) cls.push('weekend');
      if(iso===today) cls.push('today');
      if(!inMonth) cls.push('out-month');
      return `<div class="${cls.join(' ')}" style="grid-column:${i+1}; grid-row:1 / span ${maxLanes+1};"><span class="month-daynum">${d.getDate()}${iso===today?'<span class="today-badge">오늘</span>':''}</span></div>`;
    }).join('');

    const bars = items.map(({t, lane})=>{
      const idxOf = iso => Math.round((parseISO(iso)-parseISO(wsISO))/86400000);

      const isAbsence = t.project === '부재';
      // 전체보기(작업자 필터 없음)에서는 담당자별 파스텔톤 색상(담당자가 여럿이면 위에서 이미 개별 바로 분리됨),
      // 특정 작업자로 필터링된 경우에는 기존처럼 업무 유형별 색상 사용
      // 단, 부재는 어느 모드에서든 항상 회색(NO_TYPE_COLOR)으로 표시
      const color = isAbsence
        ? NO_TYPE_COLOR
        : (!monthFilterWorker
            ? (WORKER_COLORS[t.assignees[0]] || NO_TYPE_COLOR)
            : (t.workType ? (WORK_TYPE_COLORS[t.workType] || '#666') : NO_TYPE_COLOR));
      const chain = chains[t.id];
      const status = ticketStatus(t);
      const statusCls = status==='완료' ? 'tb-done' : status==='보류' ? 'tb-hold' : '';
      const days_bd = expectedWorkDays(t);
      const actual = actualBusinessDays(t);
      const title = `${t.title} · ${t.project}${t.workType?' · '+t.workType:''} · ${t.assignees.join(',')} · ${status} · ${fmtFull(t.startDate)}~${fmtFull(t.endDate)}${isAbsence?'':` (예상 ${fmtDays(days_bd)}영업일${status==='완료'&&actual!==null?`, 실제 ${fmtDays(actual)}영업일`:''})`}${t.resourceDeadline?` · 리소스 마감 ${fmtFull(t.resourceDeadline)}`:''}${t.spec?` · 사양: ${t.spec}`:''}`;

      // 부재를 포함한 모든 티켓은 주말(비근무일)에 바가 끊기고, '주말 출근 필요' 체크가 있을 때만 이어서 표기
      const segments = splitSegmentsByWorkDays(t.startDate, t.endDate, t, false);

      return segments.map((seg, segIdx)=>{
        const clip = clipRange(seg[0], seg[1], wsISO, weISO);
        if(!clip) return '';
        const s = idxOf(clip[0]), e = idxOf(clip[1]);
        const isLastSeg = segIdx===segments.length-1;

        return `
          <div class="ticket-bar month-bar ${monthFilterWorker?'':'thin'} ${statusCls}" data-id="${t.id}" title="${escapeHtml(title)}"
               style="grid-column:${s+1} / ${e+2}; grid-row:${lane+2};">
            <div class="seg seg-main ${isAbsence?'absence-bar':''}" style="flex:1 0 0; background:${color};">
              <span class="seg-label">${t.workType?WORK_TYPE_ICONS[t.workType]+' ':''}<b>[${escapeHtml(t.project)}]</b> ${escapeHtml(t.title)}${qtyBadge(t)} <span class="month-bar-assignee">· ${escapeHtml(t.assignees.join(','))}</span></span>
            </div>
            ${(isLastSeg && chain) ? `<span class="chain-badge" title="연속 작업 ${chain.index}/${chain.size}">🔗</span>` : ''}
          </div>`;
      }).join('');
    }).join('');

    return `<div class="month-week" style="grid-template-rows:${rowTemplate};">${bgCells}${bars}</div>`;
  }).join('');

  return `${legend}${workerFilter}<div class="board">${head}${weekRows}</div>${renderBoardSummary()}`;
}

function deadlineRemainHtml(endDate){
  const today = todayISO();
  if(endDate === today){
    return `<span class="deadline-danger">오늘 마감</span>`;
  }
  if(endDate < today){
    const daysPast = calendarDaysBetween(endDate, today) - 1;
    const label = daysPast <= 1 ? '어제 마감' : `${daysPast}일 지남`;
    return `<span class="deadline-danger">${label}</span>`;
  }
  return `${businessDaysBetween(today, endDate)}영업일`;
}
/* ============================= 보드 하단 요약 (진행중 티켓 + 진행 예정 티켓) ============================= */
function renderBoardSummary(){
  const today = todayISO();
  const inProgress = TICKETS.filter(t=> ticketStatus(t)==='작업중')
    .sort((a,b)=> a.endDate<b.endDate?-1:1);
  const upcoming = TICKETS.filter(t=> ticketStatus(t)==='예정')
    .sort((a,b)=> a.startDate<b.startDate?-1:1);

  const progressCard = `
    <div class="card">
      <p class="card-title">진행 중 티켓</p>
      <p class="card-sub">상태가 '작업중'으로 설정된 티켓 · <span class="resource-flag-badge" style="margin-right:0;">❗ 리소스 확인</span> 표시는 리소스 도착 확인이 필요한 티켓입니다</p>
      ${inProgress.length ? `
      <table class="simple">
        <thead><tr><th>제목</th><th>프로젝트</th><th>담당자</th><th>기간</th><th>마감까지</th><th>리소스</th><th>레퍼런스</th></tr></thead>
        <tbody>
          ${inProgress.map(t=>{
            const needsResourceCheck = !!t.resourceCheckNeeded;
            return `<tr class="ticket-row ${needsResourceCheck?'tr-resource-alert':''}" data-id="${t.id}" style="cursor:pointer;">
              <td>${needsResourceCheck?'<span class="resource-flag-badge" title="리소스 마감일까지 도착 확인이 필요합니다">❗ 리소스 확인</span>':''}${t.workType?WORK_TYPE_ICONS[t.workType]+' ':''}${escapeHtml(t.title)}${qtyBadge(t)}</td>
              <td><span class="proj-chip" style="background:${PROJECT_COLORS[t.project]}">${t.project}</span></td>
              <td>${t.assignees.join(', ')}</td>
              <td>${fmtShort(t.startDate)} ~ ${fmtShort(t.endDate)}</td>
              <td>${deadlineRemainHtml(t.endDate)}</td>
              <td>${renderResourceCell(t)}</td>
              <td>${renderResourceField((t.referenceLinks&&t.referenceLinks.length)?t.referenceLinks:t.referenceLink, '레퍼런스')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : `<div class="empty-note">현재 진행 중인 티켓이 없습니다.</div>`}
    </div>`;

  const upcomingCard = `
    <div class="card">
      <p class="card-title">진행 예정인 티켓</p>
      <p class="card-sub">상태가 '예정'으로 설정된 티켓 · <span class="resource-flag-badge" style="margin-right:0;">❗ 리소스 확인</span> 표시는 리소스 도착 확인이 필요한 티켓입니다</p>
      ${upcoming.length ? `
      <table class="simple">
        <thead><tr><th>제목</th><th style="white-space:nowrap;">프로젝트</th><th>담당자</th><th style="white-space:nowrap;">시작까지</th><th>리소스</th><th>레퍼런스</th></tr></thead>
        <tbody>
          ${upcoming.map(t=>{
            const dday = businessDaysBetween(today, t.startDate) - 1;
            const needsResourceCheck = !!t.resourceCheckNeeded;
            return `<tr class="ticket-row ${needsResourceCheck?'tr-resource-alert':''}" data-id="${t.id}" style="cursor:pointer;">
              <td>${needsResourceCheck?'<span class="resource-flag-badge" title="리소스 마감일까지 도착 확인이 필요합니다">❗ 리소스 확인</span>':''}${t.workType?WORK_TYPE_ICONS[t.workType]+' ':''}${escapeHtml(t.title)}${qtyBadge(t)}</td>
              <td style="white-space:nowrap; min-width:58px;"><span class="proj-chip" style="background:${PROJECT_COLORS[t.project]}">${t.project}</span></td>
              <td>${t.assignees.join(', ')}</td>
              <td style="white-space:nowrap; min-width:82px;">${fmtShort(t.startDate)} (D-${Math.max(dday,0)})</td>
              <td>${renderResourceCell(t)}</td>
              <td>${renderResourceField((t.referenceLinks&&t.referenceLinks.length)?t.referenceLinks:t.referenceLink, '레퍼런스')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : `<div class="empty-note">진행 예정인 티켓이 없습니다.</div>`}
    </div>`;

  return `<div class="board-summary">${progressCard}${upcomingCard}</div>`;
}

/* ============================= 대시보드 ============================= */
function renderDashboard(){
  const now = new Date();
  const year = now.getFullYear();

  function buildRows(labels, keyFn, ticketsForRows){
    const table = {};
    labels.forEach(l=> table[l] = {});
    ticketsForRows.forEach(t=>{
      const keys = keyFn(t);
      keys.forEach(k=>{
        if(!table[k]) return;
        const wt = t.workType || '기타';
        table[k][wt] = (table[k][wt]||0) + (t.qty||1);
      });
    });
    return labels.map(l=> ({label:l, counts:table[l]}));
  }

  // ---- 작업자별 유형 티켓 수 (좌우 화살표로 월 이동, 기본은 이번달) ----
  const [workerMS, workerME] = monthRange(workerCardMonthOffset);
  const workerMonthDate = new Date(year, now.getMonth()+workerCardMonthOffset, 1);
  const workerMonthLabel = `${workerMonthDate.getFullYear()}년 ${workerMonthDate.getMonth()+1}월`;
  const workerTickets = TICKETS.filter(t=> t.project !== '부재' && t.startDate <= workerME && t.endDate >= workerMS);
  const workerRows = buildRows(WORKERS, t=> t.assignees, workerTickets);

  // ---- 프로젝트별 유형 티켓 수 (전체 프로젝트, 좌우 화살표로 월 이동) ----
  const [projectMS, projectME] = monthRange(projectCardMonthOffset);
  const projectMonthDate = new Date(year, now.getMonth()+projectCardMonthOffset, 1);
  const projectMonthLabel = `${projectMonthDate.getFullYear()}년 ${projectMonthDate.getMonth()+1}월`;
  const projectMonthTickets = TICKETS.filter(t=> t.project !== '부재' && t.startDate <= projectME && t.endDate >= projectMS);
  const allProjectsExceptAbsence = PROJECTS.filter(p=> p!=='부재');
  const projectRows = buildRows(allProjectsExceptAbsence, t=> [t.project], projectMonthTickets);

  // ---- 작업자별 · 유형별 평균 소요 영업일 (전체 기간 기준, 부재 제외, 라이브·오프라인 촬영 제외) ----
  const AVG_DAYS_WORK_TYPES = WORK_TYPES.filter(wt=> wt!=='라이브' && wt!=='오프라인 촬영');
  const avgDaysAllTickets = TICKETS.filter(t=> t.project !== '부재' && t.workType && AVG_DAYS_WORK_TYPES.includes(t.workType));
  function avgDaysRows(){
    return WORKERS.map(w=>{
      const counts = {};
      AVG_DAYS_WORK_TYPES.forEach(wt=>{
        const ts = avgDaysAllTickets.filter(t=> t.workType===wt && t.assignees.includes(w));
        if(ts.length){
          // 티켓 하나에 여러 개(수량)가 묶여 있으면 총 소요일을 수량으로 나눠 '건당' 일수로 환산해 평균에 반영
          // 예: 숏폼 5개를 5영업일 만에 처리했다면 건당 1일로 계산됨
          const totalDays = ts.reduce((sum,t)=> sum+expectedWorkDays(t), 0);
          const totalQty = ts.reduce((sum,t)=> sum+(t.qty||1), 0);
          const avg = totalDays / totalQty;
          counts[wt] = `${fmtDays(avg)}일`;
        }
      });
      return {label:w, counts};
    });
  }

  function typeMatrixTable(rows, rowHeader, types){
    types = types || WORK_TYPES;
    return `
    <table class="simple compact-matrix">
      <thead><tr>
        <th>${rowHeader}</th>
        ${types.map(wt=>`<th>${WORK_TYPE_ICONS[wt]} ${wt}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            <td><b>${r.label}</b></td>
            ${types.map(wt=>`<td>${r.counts[wt]||'-'}</td>`).join('')}
          </tr>`).join('')}
      </tbody>
    </table>`;
  }

  // ---- 작업자별 기간 조회 (분기 피드백용 상세 내역) ----
  if(!reportWorker) reportWorker = WORKERS[0];
  if(!reportStart) reportStart = quarterRange(Math.floor(now.getMonth()/3)+1, year)[0];
  if(!reportEnd) reportEnd = todayISO();

  const reportTickets = TICKETS
    .filter(t=> t.project!=='부재' && t.assignees.includes(reportWorker) && t.startDate <= reportEnd && t.endDate >= reportStart)
    .sort((a,b)=> a.startDate<b.startDate?-1:1);

  function reportTable(){
    if(!reportTickets.length) return `<div class="empty-note">선택한 기간에 해당하는 티켓이 없습니다.</div>`;
    return `
    <table class="simple">
      <thead><tr><th>제목</th><th>프로젝트</th><th>유형</th><th>기간</th><th>상태</th><th>리소스</th><th>SB·기획</th></tr></thead>
      <tbody>
        ${reportTickets.map(t=>{
          const status = ticketStatus(t);
          return `<tr class="ticket-row" data-id="${t.id}" style="cursor:pointer;">
            <td>${escapeHtml(t.title)}${qtyBadge(t)}</td>
            <td><span class="proj-chip" style="background:${PROJECT_COLORS[t.project]}">${t.project}</span></td>
            <td>${t.workType?`${WORK_TYPE_ICONS[t.workType]} ${t.workType}`:'-'}</td>
            <td>${fmtShort(t.startDate)} ~ ${fmtShort(t.endDate)}</td>
            <td>${statusChipHtml(status)}</td>
            <td>${renderResourceCell(t)}</td>
            <td>${renderResourceField(t.sb)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }

  return `
    <div class="card">
      <div style="display:flex; align-items:center; justify-content:flex-start; gap:10px; margin-bottom:2px;">
        <p class="card-title" style="margin-bottom:0;">작업자별 · 유형별 티켓 수</p>
        <div class="range-nav" style="gap:4px;">
          <button class="range-btn" id="workerCardPrev">‹</button>
          <div class="range-label" style="min-width:auto; width:auto; font-size:12.5px; white-space:nowrap;">${workerMonthLabel}</div>
          <button class="range-btn" id="workerCardNext">›</button>
        </div>
      </div>
      <p class="card-sub">해당 달과 기간이 겹치는 티켓 수 · 예정된 작업 포함 (부재 제외)</p>
      ${workerRows.some(r=>Object.keys(r.counts).length) ? typeMatrixTable(workerRows, '작업자') : `<div class="empty-note">해당 달에 등록된 작업이 없습니다.</div>`}
    </div>
    <div class="card">
      <div style="display:flex; align-items:center; justify-content:flex-start; gap:10px; margin-bottom:2px;">
        <p class="card-title" style="margin-bottom:0;">프로젝트별 · 유형별 티켓 수</p>
        <div class="range-nav" style="gap:4px;">
          <button class="range-btn" id="projectCardPrev">‹</button>
          <div class="range-label" style="min-width:auto; width:auto; font-size:12.5px; white-space:nowrap;">${projectMonthLabel}</div>
          <button class="range-btn" id="projectCardNext">›</button>
        </div>
      </div>
      <p class="card-sub">전체 프로젝트 기준 · 예정된 작업 포함 (부재 제외)</p>
      ${projectRows.length ? typeMatrixTable(projectRows, '프로젝트') : `<div class="empty-note">해당 달에 등록된 작업이 없습니다.</div>`}
    </div>
    <div class="card">
      <p class="card-title">담당자별 · 유형별 평균 소요 영업일</p>
      <p class="card-sub">업무 유형별 예상 작업일수(영업일)의 평균 · 전체 기간 기준 (부재·라이브·오프라인 촬영 제외, 수량 있는 티켓은 건당 일수로 환산)</p>
      ${avgDaysAllTickets.length ? typeMatrixTable(avgDaysRows(), '작업자', AVG_DAYS_WORK_TYPES) : `<div class="empty-note">등록된 작업이 없습니다.</div>`}
    </div>
    <div class="card">
      <p class="card-title">작업자별 기간 조회</p>
      <p class="card-sub">담당자와 기간을 선택해 그 기간에 겹치는 모든 티켓 내용을 확인 · 분기 피드백 작성용</p>
      <div class="pill-group" id="reportWorkerPills" style="margin-bottom:12px;">
        ${WORKERS.map(w=>`<div class="pill ${reportWorker===w?'selected':''}" data-val="${w}">${workerDot(w)}${w}</div>`).join('')}
      </div>
      <div class="pill-group" id="reportQuarterPills" style="margin-bottom:12px;">
        ${[1,2,3,4].map(q=>{
          const [qs, qe] = quarterRange(q, year);
          const isSel = reportStart===qs && reportEnd===qe;
          return `<div class="pill ${isSel?'selected':''}" data-quarter="${q}">${q}분기 (${q===1?'1~3':q===2?'4~6':q===3?'7~9':'10~12'}월)</div>`;
        }).join('')}
      </div>
      <div class="two-col" style="margin-bottom:14px;">
        <div class="field" style="margin-bottom:0;">
          <label>시작일</label>
          <input type="date" id="reportStartInput" value="${reportStart}">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>종료일</label>
          <input type="date" id="reportEndInput" value="${reportEnd}">
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <span style="font-size:12px; color:var(--text-dim);">${reportWorker} · ${fmtFull(reportStart)} ~ ${fmtFull(reportEnd)} · 총 ${reportTickets.length}건</span>
        <button class="btn btn-ghost" id="reportCopyBtn" style="padding:6px 12px; font-size:12px;">텍스트로 복사</button>
      </div>
      ${reportTable()}
    </div>
  `;
}

function wireReportPanel(){
  const workerPillGroup = document.getElementById('reportWorkerPills');
  if(!workerPillGroup) return; // 대시보드가 아닌 화면에서는 존재하지 않음

  workerPillGroup.querySelectorAll('.pill').forEach(p=>{
    p.onclick = ()=>{
      reportWorker = p.dataset.val;
      renderContent();
    };
  });
  const quarterPillGroup = document.getElementById('reportQuarterPills');
  if(quarterPillGroup){
    quarterPillGroup.querySelectorAll('.pill').forEach(p=>{
      p.onclick = ()=>{
        const q = parseInt(p.dataset.quarter, 10);
        const year = new Date().getFullYear();
        const [qStart, qEnd] = quarterRange(q, year);
        reportStart = qStart;
        reportEnd = qEnd;
        renderContent();
      };
    });
  }
  document.getElementById('reportStartInput').onchange = (e)=>{
    reportStart = e.target.value;
    renderContent();
  };
  document.getElementById('reportEndInput').onchange = (e)=>{
    reportEnd = e.target.value;
    renderContent();

  document.getElementById('reportCopyBtn').onclick = async ()=>{

      .sort((a,b)=> a.startDate<b.startDate?-1:1);
    const text = buildQuarterFeedbackText(reportWorker, tickets, reportStart, reportEnd);
    try{
      await navigator.clipboard.writeText(text);
      showToast('클립보드에 복사했습니다.');
    }catch(e){
      // 클립보드 API 사용 불가 시 대체 방법
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';

      try{ document.execCommand('copy'); showToast('클립보드에 복사했습니다.'); }
      catch(e2){ showToast('복사에 실패했습니다. 직접 선택해 복사해주세요.'); }
      document.body.removeChild(ta);
    }
  };
}

function getFilteredSearchTickets(){
  const q = searchText.trim().toLowerCase();
  const filtered = TICKETS.filter(t=>{
    if(t.project === '부재') return false; // 부재는 아래 별도 "부재 관리" 목록에서 관리
    if(searchStatusFilter && ticketStatus(t) !== searchStatusFilter) return false;
    if(searchTypeFilter && t.workType !== searchTypeFilter) return false;
    if(searchWorkerFilter && !t.assignees.includes(searchWorkerFilter)) return false;
    if(q){
      const hay = [t.title, t.project, ...(t.assignees||[]), t.memo||'', t.sb||'', t.spec||'', t.referenceLink||'', ...((t.resourceLinks)||[]), ...((t.referenceLinks)||[])].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  if(!searchSortKey){
    filtered.sort((a,b)=> a.startDate<b.startDate?-1:1);
    return filtered;
  }
  const dir = searchSortDir==='asc' ? 1 : -1;
  filtered.sort((a,b)=>{
    let cmp = 0;
    switch(searchSortKey){
      case 'title': cmp = (a.title||'').localeCompare((b.title||''), 'ko'); break;
      case 'start': cmp = a.startDate<b.startDate?-1:(a.startDate>b.startDate?1:0); break;
      case 'end': cmp = a.endDate<b.endDate?-1:(a.endDate>b.endDate?1:0); break;
      case 'days': cmp = (expectedWorkDays(a)||0) - (expectedWorkDays(b)||0); break;
    }
    return cmp * dir;
  });
  return filtered;
}

/* ============================= 부재 관리: 날짜 표기 / 정렬 공통 유틸 ============================= */
// 'M/D(요일)' 형식 (예: 9/7(월))
function fmtShortDow(iso){
  const d = parseISO(iso);
  return `${d.getMonth()+1}/${d.getDate()}(${DOW_LABEL[d.getDay()]})`;
}
// PC 부재 목록/알림용: 시작일~마감일, 시작일과 마감일이 같으면 마감일은 '-'로 표시해 헷갈리지 않게 함
function absenceDateRangeShort(t){
  const endStr = t.startDate===t.endDate ? '-' : fmtShortDow(t.endDate);
  return `${fmtShortDow(t.startDate)}~${endStr}`;
}
// 모바일 부재 목록용: 하루짜리는 "9월 7일 월요일" 형태로 풀어서, 여러 날이면 요일 포함 짧은 표기로
function mobileAbsenceDateRangeText(t){
  if(t.startDate === t.endDate){
    const d = parseISO(t.startDate);
    return `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW_LABEL[d.getDay()]}요일`;
  }
  return `${fmtShortDow(t.startDate)}~${fmtShortDow(t.endDate)}`;
}
// 지난 부재(마감일이 오늘 이전)는 항상 목록 맨 아래로 내리고, 그 안에서는 주어진 비교 함수(cmpFn)를 그대로 적용
function absenceSortComparator(a, b, cmpFn){
  const today = todayISO();
  const aPast = a.endDate < today, bPast = b.endDate < today;
  if(aPast !== bPast) return aPast ? 1 : -1;
  return cmpFn ? cmpFn(a, b) : (a.startDate<b.startDate?-1:1);
}

function getFilteredAbsenceTickets(){
  const q = absenceSearchText.trim().toLowerCase();
  const filtered = TICKETS.filter(t=>{
    if(t.project !== '부재') return false;
    if(absenceHideShared && t.assignees && t.assignees.length === WORKERS.length) return false;
    if(absenceWorkerFilter && !t.assignees.includes(absenceWorkerFilter)) return false;
    if(q){
      const hay = [t.title, ...(t.assignees||[]), t.memo||''].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  if(!absenceSortKey){
    filtered.sort((a,b)=> absenceSortComparator(a,b));
    return filtered;
  }
  const dir = absenceSortDir==='asc' ? 1 : -1;
  filtered.sort((a,b)=> absenceSortComparator(a,b,(x,y)=>{
    let cmp = 0;
    switch(absenceSortKey){
      case 'title': cmp = (x.title||'').localeCompare((y.title||''), 'ko'); break;
      case 'start': cmp = x.startDate<y.startDate?-1:(x.startDate>y.startDate?1:0); break;
      case 'end': cmp = x.endDate<y.endDate?-1:(x.endDate>y.endDate?1:0); break;
    }
    return cmp * dir;
  }));
  return filtered;
}
